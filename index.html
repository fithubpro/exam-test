 ($800 + $7,200). Since there were no investing or financing activities, the net increase in cash and cash equivalents during the period is the same as the net cash provided by operating activities, or $2,000. Therefore, the sum of cash and cash equivalents on the balance sheet at the end of 20X2 must be $10,000: $8,000 at the end of 20X1 plus $2,000 net cash provided by operating activities (which is also the net increase in cash and cash equivalents on the SCF during 20X2). Cash at the end of 20X2 was $1,000. Therefore, marketable securities classified as cash equivalents at the end of 20X2 were $9,000 ($10,000 − $1,000).","explanations":{"A":"This answer results from calculating net cash provided by operating activities incorrectly, by subtracting the decrease in accounts receivable from net income instead of adding it to net income. Please see the correct answer explanation for full information. Note: The answer to this question is a complex one to calculate, and you may have arrived at this answer in a different way from the preceding explanation. If so, please let us know what you did, and we will add that information to this explanation as another method of calculating this incorrect answer. Please send us an email at support@hockinternational.com. Include the full Question ID number and the actual incorrect answer choice -- not its letter, because that can change with every study session created. Thank you.","C":"This answer results from calculating net cash provided by operating activities incorrectly, by omitting the amount of change in prepaids, accounts payable, and wages and salaries payable. Please see the correct answer explanation for full information. Note: The answer to this question is a complex one to calculate, and you may have arrived at this answer in a different way from the preceding explanation. If so, please let us know what you did, and we will add that information to this explanation as another method of calculating this incorrect answer. Please send us an email at support@hockinternational.com. Include the full Question ID number and the actual incorrect answer choice -- not its letter, because that can change with every study session created. Thank you.","D":"This answer results from calculating net cash provided by operating activities incorrectly, as follows: • By subtracting the decrease in accounts receivable from net income instead of adding it; • By adding the increase in prepaids to net income instead of subtracting it; • By subtracting the increase in accounts payable from net income instead of adding it; and • By adding the decrease in wages and salaries payable to net income instead of subtracting it. Please see the correct answer explanation for full information. Note: The answer to this question is a complex one to calculate, and you may have arrived at this answer in a different way from the preceding explanation. If so, please let us know what you did, and we will add that information to this explanation as another method of calculating this incorrect answer. Please send us an email at support@hockinternational.com. Include the full Question ID number and the actual incorrect answer choice -- not its letter, because that can change with every study session created. Thank you."},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":42},{"num":95,"id":"ICMA 19.P1.003","topic":"The Indirect Method","question":"Consider the following financial data for a company that is preparing its cash flow statement. Amortization expense = $150,000 Cash dividends paid to common shareholders = $75,000 Net income = $1,500,000 Work-in-process inventory increase over the prior year = $300,000 Gain on sale of equipment = $50,000 Using the indirect method, cash flow from operating activities would be","intro":"","table":[],"tail":"","options":{"A":"$1,300,000.","B":"$1,225,000.","C":"$1,350,000.","D":"$1,375,000."},"correct":"A","correctExplanation":"Under the indirect method of presenting net cash provided by operating activities, adjustments are made to net income, which was $1,500,000. The adjustments that are needed are: 1) Add back the $150,000 of amortization expense because it was not a cash payment. 2) Subtract the $300,000 increase in work-in-progress inventory because asset accounts that increased require a deduction from net income 3) Subtract the $50,000 gain on the sale of equipment because it is a result of an investing activity and does not belong in the operating activities section of the statement of cash flows. Cash flow from operating activities = $1,500,000 + $150,000 − $300,000 − $50,000 = $1,300,000.","explanations":{"B":"This answer incorrectly deducts the cash paid for dividends from net income in calculating net cash provided by operating activities. Dividends are not reported on the income statement, and so net income is not adjusted for them when using the indirect method to calculate net cash provided by operating activities. Dividends paid are classified as a financing activity on the statement of cash flows. Please see the correct answer explanation for more information.","C":"This answer results from not subtracting the $50,000 gain on the sale of equipment from net income in calculating net cash flows from operating activities. The gain on the sale is the result of an investing activity and should not be included in cash flows from operating activities, so it needs to be subtracted from net income. Please see the correct answer explanation for more information.","D":"This answer results from adding the dividend paid to common shareholders to net income in making the adjustments to net income that are needed to calculate net cash flows from operating activities under the indirect method. The dividend paid did not reduce net income, so it should not be added to net income to calculate net cash flows from operating activities. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":79},{"num":96,"id":"CIA 1191 P4 Q32","topic":"The Indirect Method","question":"In a statement of cash flows (indirect method), depreciation expense should be presented as:","intro":"","table":[],"tail":"","options":{"A":"an inflow of cash.","B":"a deduction from net income in converting net income to net cash flows from operating activities.","C":"an addition to net income in converting net income to net cash flows from operating activities.","D":"an outflow of cash."},"correct":"C","correctExplanation":"Because depreciation expense is a reduction to net income on the income statement but it is not a cash expense, the depreciation expense needs to be added back to net income in order to calculate the net cash provided by operating activities using the indirect method.","explanations":{"A":"Depreciation is not a cash flow so it is not an inflow of cash. Depreciation is a noncash transaction that decreases net income but does not represent a cash outflow.","B":"Depreciation expense should not be deducted from net income to calculate cash flows from operating activities. Because depreciation expense is a reduction to net income on the income statement but it is not a cash expense, the depreciation expense needs to be added back to net income in order to calculate the net cash provided by operating activities using the indirect method.","D":"Depreciation is not a cash flow so it is not an outflow of cash. Depreciation is a noncash transaction that decreases net income but does not represent a cash outflow."},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":89},{"num":97,"id":"HOCK CMA P1.A.1.06006","topic":"The Indirect Method","question":"The balance sheets for Sunshine Nursery Wholesale for December 31, 20X3 and 20X4 are below. What was net cash provided by operating activities? 20X3 20X4 Assets Liabilities Equity Other information: • Net income was $50,000. • A dividend of $20,000 was declared and paid during the year. • Equipment with a cost of $12,000 and accumulated depreciation of $5,000 was sold for $3,000. • Depreciation expense was $60,000. • On December 31, 20X4, equipment costing $75,000 was purchased. A down payment of $10,000 was made and the remainder of the sales price was financed with a term loan. The lender disbursed the loan funds directly to the equipment vendor.","intro":"The balance sheets for Sunshine Nursery Wholesale for December 31, 20X3 and 20X4 are below. What was net cash provided by operating activities? 20X3 20X4 Assets Liabilities Equity Other information: • Net income was $50,000. • A dividend of $20,000 was declared and paid during the year. • Equipment with a cost of $12,000 and accumulated depreciation of $5,000 was sold for $3,000. • Depreciation expense was $60,000. • On December 31, 20X4, equipment costing $75,000 was purchased. A down payment of $10,000 was made and the remainder of the sales price was financed with a term loan. The lender disbursed the loan funds directly to the equipment vendor.","table":[["Cash and cash equivalents         $24,000","$105,000"],["Accounts receivable (net)         45,000","53,000"],["Inventory                         75,000","82,000"],["Prepaid expenses                  5,000","7,000"],["Land                              100,000","100,000"],["Buildings                         250,000","250,000"],["Equipment                        125,000","188,000"],["Accumulated depreciation         (105,000)","(160,000)"],["Total assets                    $519,000","$625,000"],["Accounts payable                 $50,000","$60,000"],["Accrued liabilities              7,000","8,000"],["Long-term debt                   0","65,000"],["Total liabilities               $57,000","$133,000"],["Common stock                     $10,000","$10,000"],["Additional paid-in capital       202,000","202,000"],["Retained earnings                250,000","280,000"],["Total equity                    $462,000","$492,000"],["Total liabilities and equity    $519,000","$625,000"]],"tail":"","options":{"A":"$108,000.","B":"$84,000.","C":"$48,000.","D":"$104,000."},"correct":"A","correctExplanation":"Net cash provided by operating activities is calculated as follows: Net income $50,000 Adjustments to reconcile net income to net cash provided by operating activities: Depreciation expense $ 60,000 Loss on sale of eqipment 4,000 Increase in accounts payable 10,000 Increase in accrued liabilities 1,000 Increase in net accounts receivable (8,000) Increase in inventory (7,000) Increase in prepaid expenses (2,000) Net cash provided by operating activities $108,000","explanations":{"B":"This answer results from two errors: • Not adding back to net income the loss on the sale of the equipment. The loss reduced net income, but on the statement of cash flows, it should be part of the cash inflow from the sale of the equipment and classified as an investing activity, not an operating activity. • Deducting the dividend from net income. The dividend is a financing cash outflow, not an operating cash outflow. Please see the correct answer explanation for more information.","C":"This answer results from not adding the depreciation to net income. Depreciation reduces net income, but it is a noncash transaction, so it needs to be added back to net income to calculate net cash provided by operating activities using the indirect method. Please see the correct answer explanation for more information.","D":"This answer results from not adding back to net income the loss on the sale of the equipment. The loss reduced net income, but on the statement of cash flows, it should be part of the cash inflow from the sale of the equipment and classified as an investing activity, not an operating activity. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":50},{"num":98,"id":"HOCK CMA P1.A.1.06002","topic":"The Indirect Method","question":"Gray Company’s net income for 20X4 was $525,000. Depreciation expensed during the year was $56,000. Balance sheet accounts changed by the following amounts from the beginning to the end of the year: Increases: Decreases: On Gray's statement of cash flows for the year ended Decemver 31, 20X4, what amount is shown for net cash provided by operating activities?","intro":"Gray Company’s net income for 20X4 was $525,000.","table":[["Accounts payable","$152,000"],["Inventory","$139,000"],["Accounts receivable (net)","$78,000"],["Prepaid expenses","$42,000"],["Accrued liabilities","$57,000"]],"tail":"Depreciation expensed during the year was $56,000. Balance sheet accounts changed by the following amounts from the beginning to the end of the year: Increases: Decreases: On Gray's statement of cash flows for the year ended Decemver 31, 20X4, what amount is shown for net cash provided by operating activities?","options":{"A":"$601,000.","B":"$467,000.","C":"$657,000.","D":"$695,000."},"correct":"C","correctExplanation":"Using the indirect method, net cash provided by operating activities is calculated as follows: Net income $525,000 Adjustments to reconcile net income to cash provided by operating activities: Depreciation expense 56,000 Increase in accounts payable 152,000 Decrease in net accounts receivable 78,000 Decrease in prepaid expenses 42,000 Increase in inventory (139,000) Decrease in accrued liabilities (57,000) Net cash provided by operating activities $657,000","explanations":{"A":"This answer results from not adding depreciation back to net income to calculate the net cash provided by operating activities using the indirect method. Please see the correct answer explanation for more information.","B":"This answer results from deducting from net income all the balance sheet operating items, both assets and liabilities, that increased during the year and adding to net income all the balance sheet operating items that decreased during the year. Specifically, the amount of increase in accounts payable is deducted from net income instead of adding it to net income; and the amount of decrease in accrued liabilities is added to net income instead of deducting it from net income. Whether an amount of change in an operating asset or liability account is to be added to net income or deducted from net income to calculate net cash provided by operating activities depends on whether the balance increased or decreased and whether the account is an asset or a liability. An increase in an operating liability account such as accounts payable increases operating cash flow and should be added to net income, not deducted from it. A decrease in an operating liability account such as accrued liabilities decreases operating cash flow and should be deducted from net income, not added to it. Please see the correct answer explanation for more information.","D":"This answer results from adding to net income all the balance sheet operating items, both assets and liabilities, that increased during the year and deducting from net income all the balance sheet operating items that decreased during the year. Specifically, the amount of decrease in net accounts receivable and prepaid expenses are deducted from net income instead of adding them to net income; the amount of increase in inventory is added to net income instead of deducting it from net income. Whether an amount of change in an operating asset or liability account is to be added to net income or deducted from net income to calculate net cash provided by operating activities depends on whether the balance increased or decreased and whether the account is an asset or a liability. A decrease in an operating asset such as net accounts receivable or prepaid expenses increases operating cash flow and should be added to net income, not deducted from it. An increase in an operating asset account such as inventory decreases operating cash flow and should be deducted from net income, not added to it. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":85},{"num":99,"id":"ICMA 10Q.2.004","topic":"The Indirect Method","question":"At the end of the current fiscal year, Premiere Company reported net income of $30,000. In addition, the following information is available. Prior Fiscal Year Current Fiscal Year What amount should be reported as cash flow from operating activities on Premiere’s Statement of Cash Flows for the current fiscal year?","intro":"At the end of the current fiscal year, Premiere Company reported net income of $30,000.","table":[["Accounts receivable         $10,000","$12,000"],["Inventories                 22,000","19,000"],["Prepaid expenses            6,000","7,000"],["Accounts payable            14,000","19,000"],["Long-term debt              70,000","62,000"]],"tail":"In addition, the following information is available. Prior Fiscal Year Current Fiscal Year What amount should be reported as cash flow from operating activities on Premiere’s Statement of Cash Flows for the current fiscal year?","options":{"A":"$27,000","B":"$25,000","C":"$33,000","D":"$35,000"},"correct":"D","correctExplanation":"The calculation of cash flows from operating activities is: Net income $ 30,000 Adjustments to reconcile net income to net cash provided by operating activities: Decrease in inventories 3,000 Increase in accounts payable 5,000 Increase in accounts receivable (2,000) Increase in prepaid expenses (1,000) Net cash provided by operating activities $35,000","explanations":{"A":"This answer results from omitting the adjustments for the decrease in inventories and the increase in accounts payable, both of which result in an increase in net cash provided by operating activities. Please see the correct answer explanation for more information.","B":"This answer results from reversing the addition and subtraction of each of the adjustments. Please see the correct answer explanation for more information.","C":"This answer results from omitting the adjustments for the increases in accounts payable, accounts receivable, and prepaid expenses. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":77},{"num":100,"id":"HOCK CMA P1.A.1.06004","topic":"The Indirect Method","question":"Comparative balance sheets for years ended December 31, 20X4 and 20X3 and the income statement for 20X4 for Toys 4U, Inc. are below. What is Toys 4U's net cash provided by operating activities during 20X4 using the indirect method? BALANCE SHEETS 20X3 20X4 Assets Cash $ 40,000 $ 57,000 Liabilities and equity Liabilities Accounts payable $ 70,000 $ 80,000 Accrued interest expense 300 400 Taxes payable 3,000 7,600 Accrued other liabilities 10,300 6,650 Long-term debt 80,000 96,000 Total liabilities $163,600 $190,650 Equity Common stock $ 20,000 $ 20,000 Additional paid-in capital 80,000 80,000 Retained earnings 68,400 116,350 Total equity $168,400 $216,350 Total liabilities and equity $332,000 $407,000 INCOME STATEMENT - 12 MONTHS ENDED DECEMBER 31, 20X4 Sales $1,156,000 Cost of goods sold 786,000 Gross profit $370,000 Operating expenses (including depreciation) 264,243 Operating income $105,757 Interest expense (4,400) Net income $ 70,950","intro":"Comparative balance sheets for years ended December 31, 20X4 and 20X3 and the income statement for 20X4 for Toys 4U, Inc. are below. What is Toys 4U's net cash provided by operating activities during 20X4 using the indirect method? BALANCE SHEETS 20X3 20X4 Assets Cash $ 40,000 $ 57,000 Liabilities and equity Liabilities Accounts payable $ 70,000 $ 80,000 Accrued interest expense 300 400 Taxes payable 3,000 7,600 Accrued other liabilities 10,300 6,650 Long-term debt 80,000 96,000 Total liabilities $163,600 $190,650 Equity Co dends paid can be calculated as the difference between 20X4's net income and the amount of increase in retained earnings from 20X3 to 20X4. Please see the correct answer explanation for more information.","C":"This is the amount of increase in cash on the balance sheet. Cash flows from operating activities are not the only activities that impact cash. Net cash provided by investing and financing activities also impacts the balance of cash. Financing activities during 20X4 included receipt of additional long-term loan proceeds and the payment of a dividend. Toys 4U's long-term debt increased by $16,000 (the difference between the 20X4 balance and the 20X3 balance), and the company paid a dividend of $23,000 (the difference between 20X4's net income and the amount of increase in retained earnings from 20X3 to 20X4). Those activities resulted in a cash inflow from financing activities of $16,000 and a cash outflow from financing activities of $23,000, for a net cash outflow of $7,000 from financing activities. Please see the correct answer explanation for more information.","D":"This answer results from deducting the depreciation expense from net income instead of adding it to net income to calculate net cash provided by operating activities using the indirect method. Depreciation is a noncash expense that reduces net income, so it needs to be added to net income. Note: Because the balance in the PP&E account did not change from 20X3 to 20X4 and the problem does not say any fixed assets were purchased or disposed of during 20X4, depreciation can be calculated as the difference between the 20X4 balance of accumulated depreciation and the 20X3 balance of accumulated depreciation. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":67},{"num":101,"id":"ICMA 1310.P2.078","topic":"The Indirect Method","question":"Hauschka Company reported net income for the year of $1,050,000. During the year, accounts receivable decreased $300,000, prepaid expenses increased $150,000, accounts payable for merchandise decreased $150,000, and liabilities for other expenses increased $100,000. Administrative expenses include depreciation expense of $50,000, and the company reported a loss on the sale of obsolete equipment of $10,000. Calculate Hauschka’s net cash flows from operating activities during the year.","intro":"","table":[],"tail":"","options":{"A":"$1,110,000.","B":"$1,690,000.","C":"$1,210,000.","D":"$1,790,000."},"correct":"C","correctExplanation":"Net cash flows from operating activities are calculated as follows: Net income $ 1,050,000 Adjustments to reconcile net income to net cash provided by operating activities: Depreciation 50,000 Loss on sale of equipment 10,000 Decrease in accounts receivable 300,000 Increase in other liabilities 100,000 Increase in prepaid expenses (150,000) Decrease in accounts payable (150,000) Net cash provided by operating activities $1,210,000","explanations":{"A":"This answer results from subtracting the depreciation expensed from net income instead of adding it to net income. Please see the correct answer explanation for more information. Note: Because several items go into the calculation of net cash flows from operating activities, this incorrect answer choice may be calculated in more than one way.","B":"This answer results from three errors: 1. adding the prepaid expense increase and the accounts payable decrease to net income instead of subtracting them from net income, 2. subtracting the loss on the sale of equipment from net income instead of adding it to net income, and 3. subtracting the depreciation expensed from net income instead of adding it to net income. Please see the correct answer explanation for more information. Note: Because several items go into the calculation of net cash flows from operating activities, this incorrect answer choice may be calculated in more than one way.","D":"This answer results from two errors: 1. adding the prepaid expense increase and the accounts payable decrease to net income instead of subtracting them from net income, and 2. subtracting the loss on the sale of equipment from net income instead of adding it to net income. Please see the correct answer explanation for more information. Note: Because several items go into the calculation of net cash flows from operating activities, this incorrect answer choice may be calculated in more than one way."},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":83},{"num":102,"id":"ICMA 19.P1.012","topic":"The Indirect Method","question":"Which one of the following items could be identified on the cash flow statement prepared using the indirect method?","intro":"","table":[],"tail":"","options":{"A":"Depreciation related to buildings and equipment.","B":"The terms of a settlement of a lawsuit that was previously accrued.","C":"Interest expense of $200,000.","D":"Unrealized holding gains of $50,000 on available-for-sale debt securities."},"correct":"A","correctExplanation":"The indirect method of preparing the operating activities section of the statement of cash flows starts with net income and then makes adjustments to net income to back out items that affected net income but that are either not classified as operating activities or were non-cash transactions. One of the adjustments under the indirect method is to add back the depreciation expense that is on the income statement, since depreciation is a non-cash transation. Therefore, this item would be shown on the statement of cash flows in the calculation of net cash flow from operating activities prepared according to the indirect method.","explanations":{"B":"The terms of a settlement of a lawsuit that was previously accrued would not appear in net cash from operating activities calculated using the indirect method in a statement of cash flows.","C":"Interest expense (the amount of interest expense incurred, not the amount paid) would not appear separately in the presentation of net cash flow from operating activities because interest expense would be a part of the net income figure. (The actual amount of cash paid in interest is a disclosure in the statement of cash flows, but not the amount of interest expensed.)","D":"Unrealized holding gains on available-for-sale debt securities are not part of net income and they are not part of net cash from operating activities. Unrealized holding gains on AFS debt securities are recorded in Accumulated Other Comprehensive Income in equity. Therefore, they would not be identified on the cash flow statement prepared using the indirect method."},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":68},{"num":103,"id":"ICMA 10.P2.095","topic":"The Indirect Method","question":"Carlson Company has the following payments recorded for the current period. The total amount of the above items to be shown in the Operating Activities Section of Carlson's Cash Flow Statement should be","intro":"Carlson Company has the following payments recorded for the current period. The total amount of the above items to be shown in the Operating Activities Section of Carlson's Cash Flow Statement should be","table":[["Dividends paid to Carlson shareholders","$150,000"],["Interest paid on bank loan","250,000"],["Purchase of equipment","350,000"]],"tail":"","options":{"A":"$250,000.","B":"$150,000.","C":"$350,000.","D":"$750,000."},"correct":"A","correctExplanation":"The $250,000 interest paid on the bank loan is the only operating activity noted. The dividends paid to shareholders are a financing activity and the purchase of equipment is an investment activity.","explanations":{"B":"The interest paid on the bank loan is the only operating activity noted. The dividends paid to shareholders are a financing activity and the purchase of equipment is an investment activity.","C":"The interest paid on the bank loan is the only operating activity noted. The dividends paid to shareholders are a financing activity and the purchase of equipment is an investment activity.","D":"The interest paid on the bank loan is the only operating activity noted. The dividends paid to shareholders are a financing activity and the purchase of equipment is an investment activity."},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":85},{"num":104,"id":"CMA 1296 P2 Q21","topic":"The Indirect Method","question":"All of the following should be adjustments to net income in calculating cash flows from operating activities using the indirect method of preparing the operating activities section of a statement of cash flows except","intro":"","table":[],"tail":"","options":{"A":"a decrease in inventory.","B":"depreciation expense.","C":"a decrease in prepaid insurance.","D":"the purchase of land and building in exchange for a long-term note."},"correct":"D","correctExplanation":"The purchase of land and a building in exchange for a long-term note is not an adjustment included in calculating net cash provided by operating activities using the indirect method of preparing the operating activities section of a statement of cash flows. The purchase of land and a building in exchange for a long-term note is reported in the supplemental schedule of noncash investing and financing activities at the end of the statement of cash flows.","explanations":{"A":"A decrease in the inventory account is an adjustment included in calculating net cash provided by operating activities using the indirect method of preparing the operating activities section of a statement of cash flows.","B":"Depreciation expense is an adjustment included in calculating net cash provided by operating activities using the indirect method of preparing the operating activities section of a statement of cash flows.","C":"A decrease in the prepaid insurance account is an adjustment included calculating net cash provided by operating activities using the indirect method of preparing the operating activities section of a statement of cash flows."},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":94},{"num":105,"id":"HOCK CMA P1.A.1.06003","topic":"The Indirect Method","question":"Cashcow Company earned net income of $475,000 for the year ended December 31, 20X4. The income statement included depreciation expense of $70,000, an impairment loss of $18,000 on equipment that management expected to sell, to write it down to its expected sales value, and $6,000 in amortization of a premium on bonds payable. In addition, Cashcow paid a dividend of $95,000, and the following changes took place in balance sheet accounts over the course of the year: • Increase of $430,000 in cash and cash equivalents • Decrease of $74,000 in net accounts receivable • Increase of $19,000 in inventory • Increase of $24,000 in prepaid expenses • Increase of $16,000 in accounts payable • Decrease of $23,000 in accrued salaries • Increase of $2,000 in accrued interest expense • Decrease of $14,000 in accrued other liabilities On Cashcow’s statement of cash flows for the year ended December 31, 20X4, what amount is reported for net cash provided by operating activities?","intro":"","table":[],"tail":"","options":{"A":"$581,000.","B":"$551,000.","C":"$474,000.","D":"$569,000."},"correct":"D","correctExplanation":"Net cash provided by operating activities is calculated as follows: Net income $475,000 Adjustments to reconcile net income to net cash provided by operating activities: Depreciation expense 70,000 Impairment of equipment 18,000 Decrease in accounts receivable 74,000 Increase in accounts payable 16,000 Increase in accrued interest expense 2,000 Amortization of premium on bonds payable (6,000) Increase in inventory (19,000) Increase in prepaid expenses (24,000) Decrease in accrued salaries (23,000) Decrease in accrued other liabilities (14,000) Net cash provided by operating activities $569,000","explanations":{"A":"This answer results from adding the amortization of the premium on bonds payable to net income instead of deducting it from net income in calculating net cash provided by operating activities. The amortization of the premium on bonds payable reduces interest expense on the income statement but it is a noncash transaction. Reducing interest expense increases net income, so the amortization of the premium needs to be backed out of net income by deducting it from net income when calculating net cash provided by operating activities using the indirect method. Please see the correct answer explanation for more information.","B":"This excludes the impairment loss. The impairment loss is a noncash transaction that reduced net income, and the reduction in net income should be reversed by adding the impairment loss back to net income to calculate net cash provided by operating activities using the indirect method. Please see the correct answer explanation for more information.","C":"This includes a deduction for the dividends paid. Dividends paid are a cash flow from financing activities and do not affect operating activities. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":45},{"num":106,"id":"CMA 1294 P2 Q18","topic":"The Indirect Method","question":"When using the indirect method to prepare the statement of cash flows, the impairment of goodwill should be presented as a(n)","intro":"","table":[],"tail":"","options":{"A":"addition to net income.","B":"investing and financing activity not affecting cash.","C":"cash flow from investing activities.","D":"deduction from net income."},"correct":"A","correctExplanation":"The impairment of goodwill reduces net income but it is a non-cash transaction. In calculating net cash flows from operating activities under the indirect method, the amount of the impairment needs to be added back to net income.","explanations":{"B":"Impairment of goodwill is not an investing or financing activity and it is not a cash flow at all. It is a non-cash transaction that reduces net income. Therefore, it is an adjustment to net income in calculating net cash flows from operating activities.","C":"Impairment of goodwill is not an investing activity, and it is not a cash flow at all. The impairment of goodwill reduces net income but it is a non-cash transaction. It needs to be added back to net income in calculating net cash provided by operating activities using the indirect method.","D":"The impairment of goodwill reduces net income but it is a non-cash transaction. In calculating net cash provided operating activities under the indirect method, the amount of the impairment of goodwill is an adjustment to net income, but it needs to be added back to net income, not deducted from it."},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":56},{"num":107,"id":"HTB 1.1.009","topic":"The Indirect Method","question":"The most commonly used method for calculating and reporting a company’s net cash flow from operating activities on its statement of cash flows is the:","intro":"","table":[],"tail":"","options":{"A":"Multiple-step method.","B":"Direct method.","C":"Indirect method.","D":"Single-step method."},"correct":"C","correctExplanation":"The indirect method of calculating and reporting a company’s net cash flow from operating activities on its statement of cash flows is the method most commonly used.","explanations":{"A":"\"Multiple-step\" is a method of preparing an income statement, not a method of preparing a statement of cash flows. A multiple-step income statement format includes sub-classifications of income such as gross profit, operating income, income from continuing operations, and income/(loss) on discontinued operations, in addition to net income. Please see the correct answer explanation for more information.","B":"The direct method is not the most commonly used method for calculating and reporting a company’s net cash flow from operating activities.","D":"\"Single-step\" is a method of preparing an income statement, not a method of preparing a statement of cash flows. A single-step income statement has only two groupings, revenues and expenses. Total expenses are subtracted from total revenues to determine the net income or loss. A single-step form of income statement is simpler than a multi- step income statement and eliminates potential classification problems. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":87},{"num":108,"id":"HTB 1.1.007","topic":"The Indirect Method","question":"For the fiscal year just ended, Doran Electronics had the following results. Doran’s net cash flow from operating activities is:","intro":"For the fiscal year just ended, Doran Electronics had the following results. Doran’s net cash flow from operating activities is:","table":[["Net income","$920,000"],["Depreciation expense","110,000"],["Increase in accounts payable","45,000"],["Increase in accounts receivable","73,000"],["Increase in deferred income tax liability","16,000"]],"tail":"","options":{"A":"$1,074,000","B":"$986,000","C":"$928,000","D":"$1,018,000"},"correct":"D","correctExplanation":"Net cash flow from operating activities is: Net income $ 920,000 Adjustments to reconcile net income to net cash provided by operating activities: Depreciation expense 110,000 Increase in accounts payable 45,000 Increase in deferred income tax liability 16,000 Increase in accounts receivable (73,000) Net cash provided by operating activities $1,018,000","explanations":{"A":"This answer results from calculating the adjustments to net income for changes in the accounts payable and accounts receivable balances backwards: • Subtracting the increase in accounts payable from net income instead of adding it to net income • Adding the increase in accounts receivable to net income instead of subtracting it from net income Please see the correct answer explanation for more information.","B":"This answer results from deducting the increase in the deferred income tax liability from net income instead of adding it to net income. Please see the correct answer explanation for more information.","C":"This answer results from deducting the increase in accounts payable from net income instead of adding it to net income. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":85},{"num":109,"id":"HOCK CMA P1.A.1.06009","topic":"The Indirect Method","question":"A condensed balance sheet for Miami Production Co. is below: 20X5 20X4 Accounts payable $ 79,000 $ 89,000 Common stock $ 15,000 $ 15,000 The company did not pay any dividends during 20X5, did not sell any equipment during the year, and purchased equipment for $30,000. Depreciation expensed was $28,000. What was the company's net cash provided by operating activities for 20X5?","intro":"A condensed balance sheet for Miami Production Co.","table":[["Cash and cash equivalents              $210,000","$188,000"],["Accounts receivable                    98,000","95,000"],["Held-to-maturity debt securities       75,000","75,000"],["Discount-HTM debt securities           (8,000)","(9,000)"],["Property, plant, and equipment         250,000","220,000"],["Accumulated depreciation-PP&E           (125,000)","(97,000)"],["Total assets                           $500,000","$472,000"],["Other liabilities                      35,000","42,000"],["Long-term debt                          175,000","160,000"],["Total liabilities                       $289,000","$291,000"],["Additional paid-in capital              65,000","65,000"],["Retained earnings                        131,000","101,000"],["Total equity                            $211,000","$181,000"]],"tail":"is below: 20X5 20X4 Accounts payable $ 79,000 $ 89,000 Common stock $ 15,000 $ 15,000 The company did not pay any dividends during 20X5, did not sell any equipment during the year, and purchased equipment for $30,000. Depreciation expensed was $28,000. What was the company's net cash provided by operating activities for 20X5?","options":{"A":"$37,000.","B":"$39,000.","C":"$52,000.","D":"$54,000."},"correct":"A","correctExplanation":"Net cash provided by operating activities was as follows: Net income $30,000 * Adjustments to reconcile net income to net cash provided by operating activities: Depreciation expense 28,000 Amortization of discount-HTM debt securities (1,000) ** Increase in accounts receivable (3,000) Decrease in accounts payable (10,000) Decrease in other liabilities (7,000) Net cash provided by operating activities $37,000 * Since no dividends were paid during 20X5, net income for 20X5 is the difference between retained earnings at the end of 20X5 and retained earnings at the end of 20X4. ** Since the company did not sell or purchase any HTM securities during the year, amortization of discount on HTM debt securities for 20X5 is calculated as the amount of the decrease in the credit balance in the contra-account Discount- HTM Debt Securities between 20X4 and 20X5.","explanations":{"B":"This answer results from adding the amortization of the discount on HTM debt securities to net income instead of deducting it from net income. When a bond is purchased at a discount as an investment, the investor pays less than the face (par) value of the bond. The discount decreases the initial valuation of the investment on the investor’s balance sheet. The investor amortizes the discount over the life of the bond as an adjustment to interest income, and the amortization is a non- cash transaction. As the discount is amortized, the amortization increases reported interest income and also increases the net carrying value of the asset. An increase in reported interest income also increases reported net income. Therefore, to reverse the effect of the increase to reported net income, the amortization of the discount should be deducted from net income when calculating net cash provided by operating activities. Please see the correct answer explanation for more information.","C":"This answer results from including the increase in long-term debt as part of (an increase in) net cash provided by operating activities. Cash inflows from increases in long-term debt and outflows for reductions of long-term debt are cash flows from financing activities, not cash flows from operating activities. Please see the correct answer explanation for more information.","D":"This answer results from two errors: 1. Including the increase in long-term debt as part of (an increase in) net cash provided by operating activities. Cash inflows from increases in long-term debt and outflows for reductions of long-term debt are cash flows from financing activities, not cash flows from operating activities. 2. Adding the amortization of the discount on HTM debt securities to net income instead of deducting it from net income. When a bond is purchased at a discount as an investment, the investor pays less than the face (par) value of the bond. The discount decreases the initial valuation of the investment on the investor’s balance sheet. The investor amortizes the discount over the life of the bond as an adjustment to interest income, and the amortization is a non- cash transaction. As the discount is amortized, the amortization increases reported interest income and also increases the net carrying value of the asset. An increase in reported interest income also increases reported net income. Therefore, to reverse the effect of the increase to reported net income, the amortization of the discount should be deducted from net income when calculating net cash provided by operating activities. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":35},{"num":110,"id":"ICMA 10.P2.003","topic":"The Indirect Method","question":"Which one of the following would result in a decrease to cash flow in the indirect method of preparing a statement of cash flows?","intro":"","table":[],"tail":"","options":{"A":"Decrease in inventories.","B":"Decrease in income taxes payable.","C":"Proceeds from the issuance of common stock.","D":"Amortization expense."},"correct":"B","correctExplanation":"A decrease in income taxes payable results from making payment of taxes due. It represents a decrease in net cash provided by operating activities.","explanations":{"A":"A decrease in inventories means more inventory was sold than was purchased, so it represents an increase in cash, not a decrease.","C":"The issuance of common stock means cash was received from the sale of the stock, so it results in an increase to cash, not a decrease.","D":"Amortization expense is a non-cash transaction that increases expense and decreases net income. Since it is a non-cash transaction, it is added to net income in calculating net cash flow and increases net cash provided by operations."},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":69},{"num":111,"id":"HOCK CMA P1.A.1.06011","topic":"The Indirect Method","question":"A condensed balance sheet for Glick Brick Manufacturing is below: 20X5 20X4 Accounts payable $ 79,000 $ 89,000 Common stock $ 15,000 $ 15,000 The company did not pay any dividends during 20X5, did not sell any equipment during the year, and purchased equipment for $30,000. Depreciation expensed was $28,000. What was the company's net cash provided by operating activities for 20X5?","intro":"A condensed balance sheet for Glick Brick Manufacturing is below:","table":[["Cash and cash equivalents              $210,000","$188,000"],["Accounts receivable                    98,000","95,000"],["Property, plant, and equipment         250,000","220,000"],["Accumulated depreciation-PP&E           (125,000)","(97,000)"],["Total assets                           $433,000","$406,000"],["Other liabilities                      35,000","42,000"],["Bonds payable (par value)               175,000","175,000"],["Discount on bonds payable                (4,000)","(5,000)"],["Total liabilities                      $285,000","$301,000"],["Additional paid-in capital             65,000","65,000"],["Retained earnings                           68,000","25,000"],["Total equity                            $148,000","$105,000"]],"tail":"20X5 20X4 Accounts payable $ 79,000 $ 89,000 Common stock $ 15,000 $ 15,000 The company did not pay any dividends during 20X5, did not sell any equipment during the year, and purchased equipment for $30,000. Depreciation expensed was $28,000. What was the company's net cash provided by operating activities for 20X5?","options":{"A":"$22,000.","B":"$50,000.","C":"$52,000.","D":"$20,000."},"correct":"C","correctExplanation":"Net cash provided by operating activities was as follows: Net income $43,000 * Adjustments to reconcile net income to net cash provided by operating activities: Depreciation expense 28,000 Amortization of discount-bonds payable 1,000 ** Increase in accounts receivable (3,000) Decrease in accounts payable (10,000) Decrease in other liabilities (7,000) Net cash provided by operating activities $52,000 * Since no dividends were paid during 20X5, net income for 20X5 is the difference between retained earnings at the end of 20X5 and retained earnings at the end of 20X4. ** The amortization of the discount on bonds payable for 20X5 is calculated as the amount of the decrease in the debit balance in the contra-account Discount on Bonds Payable between 20X4 and 20X5.","explanations":{"A":"This answer results from including the increase in property, plant, and equipment as part of (a decrease in) net cash provided by operating activities. Cash outflows for purchases and inflows for sales of equipment or any fixed asset are cash flows from investing activities, not cash flows from operating activities. Please see the correct answer explanation for more information.","B":"This answer results from deducting the amortization of the discount on bonds payable from net income instead of adding it to net income. When a bond is sold at a discount, the issuer receives less than the face (par) value of the bond when it is originally issued. The discount decreases the initial valuation of the bond liability on the issuer’s balance sheet. The issuer amortizes the discount over the life of the bond as an adjustment to interest expense, and the amortization is a non-cash transaction. As the discount is amortized, the amortization increases reported interest expense and increases the net carrying value of the liability. An increase in reported interest expense decreases reported net income. Therefore, to reverse the effect of the decrease to net income, the amortization of the discount should be added to net income when calculating net cash provided by operating activities. Please see the correct answer explanation for more information.","D":"This answer results from two errors: 1. Including the increase in property, plant, and equipment as part of (a decrease in) net cash provided by operating activities. Cash outflows for purchases and inflows for sales of equipment or any fixed asset are cash flows from investing activities, not cash flows from operating activities. 2. Deducting the amortization of the discount on bonds payable from net income instead of adding it to net income. When a bond is sold at a discount, the issuer receives less than the face (par) value of the bond when it is originally issued. The discount decreases the initial valuation of the bond liability on the issuer’s balance sheet. The issuer amortizes the discount over the life of the bond as an adjustment to interest expense, and the amortization is a non-cash transaction. As the discount is amortized, the amortization increases reported interest expense and increases the net carrying value of the liability. An increase in reported interest expense decreases reported net income. Therefore, to reverse the effect of the decrease to net income, the amortization of the discount should be added to net income when calculating net cash provided by operating activities. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":52},{"num":112,"id":"CMA 1293 P2 Q30","topic":"The Indirect Method","question":"When using the indirect method to prepare a statement of cash flows, net cash flows from operating activities are determined by adding back or deducting from net income those items included in net income that had no effect on cash. Which one of the following items should be deducted from net income when determining net cash flows from operating activities?","intro":"","table":[],"tail":"","options":{"A":"Amortization of a premium on a bond payable.","B":"An increase in accrued liabilities.","C":"A decrease in accounts receivable.","D":"A loss on the sale of plant assets."},"correct":"A","correctExplanation":"A premium on a bond payable is an amount received over and above the bond's par value when the bond is originally issued (sold). Only the par value of the bond will be repayable as principal when the bond matures. The additional amount (the premium) received from its sale is not repaid, so it is a gain. The premium is amortized over the life of the bond as a reduction of interest expense on the bond. The amortization of the premium on a bond payable is a noncash transaction that reduces interest expense on the bond, so it increases net income. Therefore, the amount of the periodic amortization needs to be deducted from net income when determining net cash flows from operating activities using the indirect method.","explanations":{"B":"An increase in accrued liabilities represents an increase in costs that have been expensed but have not yet been paid. Since net income has been reduced by those unpaid expenses, the amount of the increase in the accrued liabilities should be added to net income to determine net cash flows from operating activities using the indirect method.","C":"A decrease in accounts receivable means more receivables were collected than were created during the period. The amount of the decrease should be added to net income to determine net cash flow from operating activities using the indirect method.","D":"A loss on the sale of plant assets decreases net income. The loss is a part of investing activities (when combined with the book value of the assets sold to calculate the cash received from the sale) and does not belong in operating activities. Because the loss reduces net income but it is not an operating activity, the amount of the loss should be added to net income in determining net cash flows from operating activities using the indirect method. (The amount of the loss will be included in the cash inflow from the sale of the assets that will be reported in net cash flow from investing activities.)"},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":73},{"num":113,"id":"I22 1.03","topic":"Investing and Financing Activities, SCF Disclosures","question":"An accountant is preparing a company’s cash flow statement and is evaluating how to classify certain transactions. The company paid dividends, invested in the stock of other corporations, sold plant and equipment, and reacquired some of its own stock. Which of these would be in the cash flow from financing activities in the statement of cash flow?","intro":"","table":[],"tail":"","options":{"A":"The dividends and the reacquiring of stock.","B":"The selling of plant and equipment and the reacquiring of some of its stock.","C":"Only the dividends.","D":"Only the investment in the stock of other corporations."},"correct":"A","correctExplanation":"Financing activities are activities a company undertakes to raise capital to finance the business and the repayment of the same. Common events that are financing activities according to the Accounting Standards Codification® include the following, and the second and third items are the two items in this answer choice: • Proceeds from issuance of stock. • Treasury stock transactions (treasury stock is shares that have been issued and then later repurchased by the issuer.) • Paying cash dividends. • Proceeds from issuing debt such as bonds, mortgages, notes, and payments for debt issuance costs and repayment of principal on debt obligations. • Obtaining a loan and repaying the principal of the loan. • Debt prepayment or debt extinguishment costs, including call premiums paid and fees paid to lenders or third parties that are directly related to the debt prepayment or debt extinguishment, excluding accrued interest. • Payments not made soon after the acquisition date of a business combination by an acquirer to settle a contingent consideration liability, up to the amount of liability recognized at the acquisition date. • Payments for the settlement of the principal of zero-coupon debt instruments. • A lessee classifies repayment of the principal portion (lease liability) of finance lease payments as a financing activity.","explanations":{"B":"The selling of plant and equipment is a cash flow from investing activities, not a cash flow from financing activities. Please see the correct answer explanation for more information.","C":"The dividends are not the only item that is classified as a cash flow from financing activities. Please see the correct answer explanation for more information.","D":"Investment in the stock of other corporations is a cash flow from investing activities, not a cash flow from financing activities. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 7: A.1. Investing and Financing Activities, SCF Disclosures covers the","pctCorrect":77},{"num":114,"id":"HOCK CMA P1.A.1.06005","topic":"Investing and Financing Activities, SCF Disclosures","question":"When the indirect method is used to prepare the cash flows from operating activities section of the statement of cash flows, a supplemental schedule showing the amount of cash paid for interest and the amount of cash paid for income taxes must also be disclosed. Using the following balance sheets and income statement for Toys 4U, determine the amounts of cash payments for interest and income taxes that must be disclosed for 20X4 when the indirect method is used to prepare the cash flows from operating activities section of the statement of cash flows. BALANCE SHEETS 20X3 20X4 Assets Cash $ 40,000 $ 57,000 Liabilities and equity Liabilities Accounts payable $ 70,000 $ 80,000 Equity Common stock $ 20,000 $ 20,000 Additional paid-in capital 80,000 80,000 Retained earnings 68,400 116,350 Total equity $168,400 $216,350 Total liabilities and equity $332,000 $407,000 INCOME STATEMENT - 12 MONTHS ENDED DECEMBER 31, 20X4 Sales $1,156,000 Cost of goods sold 786,000 Gross profit $370,000 Operating expenses (including depreciation) 264,243 Operating income $105,757 Interest expense (4,400) Income before income taxes $101,357 Income tax (30,407) Net income $ 70,950","intro":"When the indirect method is used to prepare the cash flows from operating activities section of the statement of cash flows, a supplemental schedule showing the amount of cash paid for interest and the amount of cash paid for income taxes must also be disclosed. Using the following balance sheets and income statement for Toys 4U, determine the amounts of cash payments for interest and income taxes that must be disclosed for 20X4 when the indirect method is used to prepare the cash flows from operating activities section of the s
