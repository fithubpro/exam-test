did not result from delivering or producing goods, rendering services, or other activities as defined above.","D":"A decrease in an asset resulting from delivering to a customer an item sold cannot result in revenue. According to the FASB’s Statement of Financial Accounting Concepts No. 8, Conceptual Framework for Financial Reporting, Chapter 4, Elements of Financial Statements, revenues are inflows or other enhancements of assets or settlements of liabilities (or a combination of both) that result from delivering or producing goods, rendering services, or other activities. “Other activities” are things like permitting others to use the company’s resources, resulting in interest, rent, royalties, and fees. For a charitable organization, “other activities” includes contributions received. However, a decrease in an asset resulting from delivering to a customer an item sold would result in recognizing an expense, for example selling inventory that results in reducing the inventory account and increasing the cost of goods sold expense account. Although the related revenue from the sale would be recognized along with an increase in an asset account, such as an increase in cash or an increase in accounts receivable, that is not what the question asks. The question is asking only what kind of a transaction would, by itself, result in recognizing revenue. And a decrease in an asset from delivering to a customer an item sold results in an expense, not revenue."},"studyUnit":"Study Unit 2: A.1. Comprehensive Income and the Income Statement covers the","pctCorrect":41},{"num":29,"id":"HTB 1.1.002","topic":"Income Statement","question":"The financial statement that provides a summary of the firm’s operations for a period of time is the","intro":"","table":[],"tail":"","options":{"A":"statement of retained earnings.","B":"statement of financial position.","C":"income statement.","D":"statement of shareholders’ equity."},"correct":"C","correctExplanation":"The income statement reports the results of operations for a period of time.","explanations":{"A":"In fnancial statements prepared according to U.S. GAAP, there is no such financial statemeent as \"statement of retained earnings.\"","B":"The statement of financial position does not report the results of operations for a period of time.","D":"The statement of shareholders’ equity does not report the results of operations for a period of time."},"studyUnit":"Study Unit 2: A.1. Comprehensive Income and the Income Statement covers the","pctCorrect":90},{"num":30,"id":"ICMA 1603.P1.026","topic":"Income Statement","question":"According to U.S. GAAP, where on the income statement should a multinational company report the loss from the disposal sale of a major operating unit?","intro":"","table":[],"tail":"","options":{"A":"Report the loss, net of tax, in a separate section between income from continuing operations and net income.","B":"Report the loss, net of tax, in a separate section between income before tax and net income.","C":"Report the loss, pretax, in a separate section between income from operations and income before income tax.","D":"Report the loss, pretax, in a separate section between income from continuing operations and net income."},"correct":"A","correctExplanation":"The gain or loss from the disposal of a major operating unit should be reported net of tax separately along with the related results of operations of the discontinued component in the discontinued operations section of the income statement. The discontinued operations section of the income statement follows income from continuing operations (after tax). For example, a loss on a discontinued component would be presented in the discontinued operations section of the income statement as: Income from continuing operations (after tax) XXXXXX Loss from operations of discontinued Component X (including loss on disposal of $XXXX) XXXXX Income tax benefit on loss from discontinued Component X XXXX Loss on discontinued operation XXXX Net income XXXXXX","explanations":{"B":"The discontinued operations section of the income statement follows income from continuing operations (after tax). Please see the correct answer explanation for more information.","C":"The loss is reported net of tax. The discontinued operations section of the income statement follows income from continuing operations (after tax). Please see the correct answer explanation for more information.","D":"The loss is reported net of tax. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 2: A.1. Comprehensive Income and the Income Statement covers the","pctCorrect":60},{"num":31,"id":"HCH CMA P1.A.1.02002","topic":"Income Statement","question":"When reporting prior period net income or loss for a component subsequently reported as a discontinued operation, which of the following is the correct approach?","intro":"","table":[],"tail":"","options":{"A":"Prior period net income or loss related to the component should be adjusted in the retained earnings section of the balance sheet.","B":"Prior period net income or loss related to the component should remain classified as income from continuing operations in all prior period income statements presented for comparison with the current year’s financial statements presented for comparison, since it was part of the company's operations during that period.","C":"Prior period net income or loss related to the component should be reclassified as an unusual item in all prior period income statements presented for comparison.","D":"Prior period net income or loss related to the component should be removed from income from continuing operations and reclassified as income from discontinued operations in all prior period income statements presented for comparison."},"correct":"D","correctExplanation":"When a component of a company is reported as a discontinued operation, any net income or loss associated with that component in prior periods must be reclassified to discontinued operations in all prior period income statements presented for comparison. This ensures that the financial statements are comparable across periods and that users can accurately assess the ongoing operations of the company without the influence of the discontinued component.","explanations":{"A":"Adjusting the prior period net income or loss in the retained earnings section of the balance sheet is not the correct accounting treatment for reporting of prior period net income or loss related to a component subsequently classified as a discontinued operation. Please see the correct answer explanation for more information.","B":"Reporting as income from continuing operations the prior period net income or loss on a component subsequently reported as a discontinued operation would distort the comparison between periods. This approach would not properly reflect the impact of the discontinued operations on the company's ongoing business. Please see the correct answer explanation for more information.","C":"Reclassifying as an unusual item in all income statements presented for comparison the net income or loss of a component subsequently classified as a discontinued operation is incorrect. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 2: A.1. Comprehensive Income and the Income Statement covers the","pctCorrect":52},{"num":32,"id":"HOCK CMA P.1.A.1.02001","topic":"Income Statement","question":"How are income taxes on discontinued operations reported in the financial statements?","intro":"","table":[],"tail":"","options":{"A":"Income taxes on discontinued operations are reported on the income statement as an unusual expense.","B":"Income taxes on discontinued operations are reported in accumulated other comprehensive income.","C":"Income taxes on discontinued operations are reported on the income statement along with income from continuing operations.","D":"Income taxes are allocated on the income statement between income from continuing operations and income from discontinued operations."},"correct":"D","correctExplanation":"Income taxes are allocated on the income statement between income from continuing operations and income from discontinued operations, called intra-period tax allocation. Income tax due should be allocated first to income from continuing operations. The remaining tax due should be allocated to income/loss from discontinued operations and other items reported in accumulated other comprehensive income according to each one’s proportion of the total other taxable items.","explanations":{"A":"Income taxes on discontinued operations are not reported as an unusual expense. Please see the correct answer explanation for more information.","B":"Income taxes on discontinued operations are not reported in accumulated other comprehensive income. Please see the correct answer explanation for more information.","C":"Income taxes on discontinued operations are not reported along with income from continuing operations. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 2: A.1. Comprehensive Income and the Income Statement covers the","pctCorrect":65},{"num":33,"id":"HOCK CMA P.1.A.1.02002","topic":"Income Statement","question":"When is the line “Income from continuing operations” used on the income statement?","intro":"","table":[],"tail":"","options":{"A":"The line “Income from continuing operations” is used on the income statement when income or losses on discontinued operations occur.","B":"The line “Income from continuing operations” is used on the income statement to indicate that the company will continue to operate for the foreseeable future.","C":"The line “Income from continuing operations” is used on the income statement to present the company’s operating income.","D":"The line “Income from continuing operations” is used on the income statement when liquidation of the company is being contemplated."},"correct":"A","correctExplanation":"Companies use the line “Income from continuing operations” on the income statement only when income or losses on discontinued operations occur, in order to segregate income from continuing operations from income from discontinued operations.","explanations":{"B":"Companies do not use the line “Income from continuing operations” on the income statement to indicate that the company will continue to operate for the foreseeable future. Please see the correct answer explanation for more information.","C":"Companies do not use the line “Income from continuing operations” on the income statement to present the company’s operating income. Operating income is called operating income or income from operations on the income statement. Please see the correct answer explanation for more information.","D":"Companies do not use the line “Income from continuing operations” on the income statement when liquidation of the company is being contemplated. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 2: A.1. Comprehensive Income and the Income Statement covers the","pctCorrect":56},{"num":34,"id":"ICMA 19.P1.002","topic":"Income Statement","question":"An income statement could be used by an external investor for all of the following purposes except to","intro":"","table":[],"tail":"","options":{"A":"predict the company’s future revenues.","B":"analyze the company’s performance compared to the budget.","C":"assess the risk of the company achieving future profitability.","D":"compare the company’s results to those of its competitors."},"correct":"B","correctExplanation":"The income statement cannot be used by a external investor to analyze the company's performance compared to the budget because the budget is not part of the financial statements and would not be available for an external investor to consult.","explanations":{"A":"The income statement may be used to predict the company’s future revenues.","C":"The income statement may be used to assess the risk of the company achieving future profitability.","D":"The income statement may be used to compare the company’s results to those of its competitors."},"studyUnit":"Study Unit 2: A.1. Comprehensive Income and the Income Statement covers the","pctCorrect":55},{"num":35,"id":"ICMA 19.P1.010","topic":"Statement of Comprehensive Income","question":"A company is preparing its financial statements in accordance with U.S. GAAP. Listed below are select financial data for the company. Net income = $950,000 Depreciation = $40,000 Investment by owners = $60,000 Unrealized gain on available-for-sale debt securities = $90,000 Foreign currency translation adjustment (loss) = $20,000 What is the amount that would be reported as comprehensive income?","intro":"","table":[],"tail":"","options":{"A":"$1,060,000.","B":"$1,020,000.","C":"$1,120,000.","D":"$970,000."},"correct":"B","correctExplanation":"Comprehensive income includes everything on the income statement plus some specific items that do not appear on the income statement that are called \"other comprehensive income\" and are recorded in equity in the Accumulated Other Comprehensive Income account. Those \"other comprehensive income\" items are added to or subtracted from net income to calculate comprehensive income. In this question, those items include the unrealized gain on available-for-sale securities ($90,000 added to net income) and the foreign currency translation adjustment ($20,000 loss subtracted from net income). Net income of $950,000 plus the unrealized gain of $90,000 minus the foreign currency translation adjustment of $20,000 equals comprehensive income of $1,020,000. The investment by owners is not included in comprehensive income and depreciation is already included in net income.","explanations":{"A":"Comprehensive income includes everything on the income statement plus some specific items that do not appear on the income statement that are called \"other comprehensive income\" and are recorded in equity in the Accumulated Other Comprehensive Income account. Those \"other comprehensive income\" items are added to or subtracted from net income to calculate comprehensive income. This answer choice does not make the correct adjustments to net income. The foreign currency translation adjustment was added instead of being subtracted. Please see the correct answer explanation for more information.","C":"Comprehensive income includes everything on the income statement plus some specific items that do not appear on the income statement that are called \"other comprehensive income\" and are recorded in equity in the Accumulated Other Comprehensive Income account. Those \"other comprehensive income\" items are added to or subtracted from net income to calculate comprehensive income. This answer choice does not make the correct adjustments to net income. Depreciation and the investment by owners are both incorrectly added to net income. Please see the correct answer explanation for more information.","D":"Comprehensive income includes everything on the income statement plus some specific items that do not appear on the income statement that are called \"other comprehensive income\" and are recorded in equity in the Accumulated Other Comprehensive Income account. Those \"other comprehensive income\" items are added to or subtracted from net income to calculate comprehensive income. This answer choice does not make the correct adjustments to net income. The unrealized gain on available-for-sale securities is not included and the foreign currency translation adjustment (loss) is added instead of subtracted from net income. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 3: A.1. The Statement of Comprehensive Income  for","pctCorrect":81},{"num":36,"id":"HTB 1.1.004","topic":"Statement of Comprehensive Income","question":"Comprehensive income is best defined as:","intro":"","table":[],"tail":"","options":{"A":"The change in net assets for the period excluding owner transactions.","B":"Net income excluding income from discontinued operations.","C":"Total revenues minus total expenses.","D":"The change in net assets for the period including investments by owners and distributions to owners."},"correct":"A","correctExplanation":"Comprehensive Income is the change in equity (net assets) during a period from transactions and other events except for those resulting from transactions made with the owners of the company such as distribution of dividends or the sale or repurchase of shares.","explanations":{"B":"Net income excluding income from discontinued operations is not the definition of comprehensive income.","C":"Total revenues minus total expenses is not the definition of comprehensive income.","D":"The change in net assets for the period including investments by owners and distributions to owners is not the definition of comprehensive income."},"studyUnit":"Study Unit 3: A.1. The Statement of Comprehensive Income  for","pctCorrect":64},{"num":37,"id":"HINT21 CMA 1.A.006","topic":"Statement of Comprehensive Income","question":"Which of the following statements is accurate with respect to the reporting of Comprehensive Income?","intro":"","table":[],"tail":"","options":{"A":"The balance of Accumulated Other Comprehensive Income is represented in the Shareholders' Equity section of the balance sheet.","B":"The Accumulated Other Comprehensive Income account is a temporary account and is closed out every year.","C":"Comprehensive Income must be presented as a single continuous statement including both Net Income and Other Comprehensive Income.","D":"Comprehensive Income Per Share must be reported."},"correct":"A","correctExplanation":"Accumulated Other Comprehensive Income is a line in the Equity section of the balance sheet that includes the items that are not reflected on the Income Statement. Net Income flows to Retained Earnings in Equity when the year-end close is performed, so Net Income ends up in Equity. However, certain specific items are considered “Other Comprehensive Income” items, and they are not presented on the Income Statement. Instead, they go straight to Equity by means of the Accumulated Other Comprehensive Income account.","explanations":{"B":"The word “accumulated” in “Accumulated Other Comprehensive Income” means that the balance in the account keeps accumulating. As Accumulated Other Comprehensive Income is a balance sheet account, it is a permanent account. It is never closed out, and the balance in it keeps accumulating just like any other balance sheet account. The Accumulated Other Comprehensive Income balance in the account may be referred to as AOCI. Other Comprehensive Income for a year is the amount of change in the Accumulated Other Comprehensive Income account.","C":"The Statement of Comprehensive Income can be presented as a single continuous statement, including Net Income followed by Other Comprehensive Income. Or, it can be presented as two separate but consecutive financial statements: a Statement of Net Income and a Statement of Comprehensive Income presenting the components of Other Comprehensive Income. The Statement of Comprehensive Income should immediately follow the Statement of Net Income and begin with the Net Income figure.","D":"Comprehensive Income Per Share is not reported."},"studyUnit":"Study Unit 3: A.1. The Statement of Comprehensive Income  for","pctCorrect":57},{"num":38,"id":"HINT21 CMA 1.A.013","topic":"Statement of Comprehensive Income","question":"Which of the following is not part of Other Comprehensive Income?","intro":"","table":[],"tail":"","options":{"A":"Gain on a derivative instrument that qualifies as and has been designated as a cash flow hedge.","B":"Prior service costs associated with a defined benefit pension plan.","C":"Unrealized gains or losses on available-for-sale debt securities.","D":"Allowance for credit losses on accounts receivable."},"correct":"D","correctExplanation":"The Allowance for Credit Losses on accounts receivable is a contra-asset account on the balance sheet. Credit Loss Expense is an Income Statement item. Neither one is a part of Other Comprehensive Income.","explanations":{"A":"Gain on a derivative instrument that qualifies as and has been designated as a cash flow hedge is reported as Other Comprehensive Income.","B":"Prior service costs associated with a defined benefit pension plan are reported as Other Comprehensive Income.","C":"Unrealized gains or losses on available-for-sale debt securities are reported as Other Comprehensive Income."},"studyUnit":"Study Unit 3: A.1. The Statement of Comprehensive Income  for","pctCorrect":86},{"num":39,"id":"HINT21 CMA 1.A.009","topic":"Statement of Comprehensive Income","question":"As of January 1, Year 7, XYZ Inc. had an opening balance of $358,000 in its Accumulated Other Comprehensive Income account. Based on the following information, determine the amounts of Net Income, Comprehensive Income, and Accumulated Other Comprehensive Income at year-end, Year 7 (before income tax): Comprehensive Accumulated Other Net Income Income Comprehensive Income I. $607,000 $588,000 $ 339,000 II. $677,000 $658,000 $ 339,000","intro":"As of January 1, Year 7, XYZ Inc. had an opening balance of $358,000 in its Accumulated Other Comprehensive Income account. Based on the following information, determine the amounts of Net Income, Comprehensive Income, and Accumulated Other Comprehensive Income at year-end, Year 7 (before income tax): Comprehensive Accumulated Other Net Income Income Comprehensive Income I. $607,000 $588,000 $ 339,000 II. $677,000 $658,000 $ 339,000","table":[["Net sales revenue","$1,700,000"],["Cost of goods sold","750,000"],["Operating expenses","285,000"],["Gain on sale of land","35,000"],["Foreign currency translation adjustment (gain)","12,000"],["Unrealized loss on trading securities","23,000"],["Unrealized loss on available-for-sale debt securities","31,000"],["III.         $700,000     $677,000","$1,016,000"],["IV.          $677,000     $677,000","$1,016,000"]],"tail":"","options":{"A":"I.","B":"IV.","C":"II.","D":"III."},"correct":"C","correctExplanation":"The correct calculations for Net Income, Comprehensive Income and Accumulated Other Comprehensive Income are as follows: Net sales revenue $ 1,700,000 Cost of goods sold ( 750,000) Operating expenses ( 285,000) Operating income $ 665,000 Gain on sale of land 35,000 Unrealized loss on trading securities ( 23,000) Net income $ 677,000 Foreign currency translation adjustment (gain) 12,000 Unrealized loss on available-for-sale debt securities ( 31,000) Comprehensive income $ 658,000 Ending balance of Accumulated Other Comprehensive Income = Opening balance + Credits during the year − Debits during the year Ending balance of Accumulated Other Comprehensive Income = $358,000 + $12,000 − $31,000 = $339,000.","explanations":{"A":"Net Income of $607,000 and Comprehensive Income of $588,000 are incorrect because both amounts result from deducting $35,000 for the gain on the sale of land instead of adding it.","B":"Comprehensive Income of $677,000 is not correct because it does not include the Other Comprehensive Income items, which are the foreign currency translation adjustment and the unrealized loss on available-for-sale debt securities. $1,016,000 is not the correct ending balance of the Accumulated Other Comprehensive Income account because $1,016,000 is the total of Net Income and the ending balance of the Accumulated Other Comprehensive Income account. Net Income is not included in the balance of the Accumulated Other Comprehensive Income account.","D":"Net Income of $700,000 is incorrect because it is not reduced for the unrealized loss on trading securities. All gains and losses on trading securities, realized and unrealized, are recognized in Net Income. Comprehensive Income of $677,000 is not correct because it does not include the Other Comprehensive Income items, which are the foreign currency translation adjustment and the unrealized loss on available-for-sale debt securities. $1,016,000 is not the correct ending balance of the Accumulated Other Comprehensive Income account because $1,016,000 is the total of Net Income and the ending balance of the Accumulated Other Comprehensive Income account. Net Income is not included in the balance of the Accumulated Other Comprehensive Income account."},"studyUnit":"Study Unit 3: A.1. The Statement of Comprehensive Income  for","pctCorrect":51},{"num":40,"id":"HINT21 CMA 1.A.010","topic":"Statement of Comprehensive Income","question":"Among the following items, which would cause the Comprehensive Income amount reported in the Statement of Comprehensive Income to differ from Net Income?","intro":"","table":[],"tail":"","options":{"A":"Transition pension assets that are not recognized immediately as a component of net periodic benefit cost.","B":"Unrealized gains on trading securities.","C":"Introducing an initial public offering in the market.","D":"Gains and losses on a fair value hedge."},"correct":"A","correctExplanation":"Comprehensive Income is the change in equity during a period from transactions and other events except for those resulting from transactions made with the owners of the company such as distribution of dividends or the sale or repurchase of shares. It includes everything on the Income Statement plus some specific items that do not appear on the Income Statement that are called “Other Comprehensive Income.” Comprehensive Income = Net Income + Other Comprehensive Income Thus, only items included in Other Comprehensive Income will cause Comprehensive Income reported in the Statement of Comprehensive Income to differ from Net Income. Transition pension assets or obligations that are not recognized immediately as a component of net periodic benefit cost are items that are included as Other Comprehensive Income, so they will cause Comprehensive Income to differ from Net Income.","explanations":{"B":"Comprehensive Income is the change in equity during a period from transactions and other events except for those resulting from transactions made with the owners of the company such as distribution of dividends or the sale or repurchase of shares. It includes everything on the Income Statement plus some specific items that do not appear on the Income Statement that are called “Other Comprehensive Income.” Comprehensive Income = Net Income + Other Comprehensive Income Thus, only items included as Other Comprehensive Income will cause Comprehensive Income reported in the Statement of Comprehensive Income to differ from Net Income. Unrealized gains on trading securities are reported in Net Income, so they are also included in Comprehensive Income. Thus, they would not cause a difference between Comprehensive Income and Net Income.","C":"Comprehensive Income is the change in equity during a period from transactions and other events except for those resulting from transactions made with the owners of the company such as distribution of dividends or the sale or repurchase of shares. Introducing an initial public offering in the market involves selling stock, and thus it is an owner transaction. Since it is an owner transaction, it is not part of either Comprehensive Income or Net Income, so it would not cause a difference between them.","D":"Comprehensive Income is the change in equity during a period from transactions and other events except for those resulting from transactions made with the owners of the company such as distribution of dividends or the sale or repurchase of shares. It includes everything on the Income Statement plus some specific items that do not appear on the Income Statement that are called “Other Comprehensive Income.” Comprehensive Income = Net Income + Other Comprehensive Income Thus, only items included as Other Comprehensive Income will cause Comprehensive Income reported in the Statement of Comprehensive Income to differ from Net Income. In a fair value hedge, when the relationship between the hedged item and the hedging instrument is highly effective, gains and losses on the derivative and the hedged item are both recognized currently in Net Income. Since gains and losses on a fair value hedge are recognized in Net Income and also in Comprehensive Income, they will not cause a difference between Comprehensive Income and Net Income. Only gains and losses on derivative instruments that are designated as, and qualify as, cash flow hedges will create a difference between Net Income and Comprehensive Income, because gains and losses on cash flow hedges are reported as Other Comprehensive Income."},"studyUnit":"Study Unit 3: A.1. The Statement of Comprehensive Income  for","pctCorrect":39},{"num":41,"id":"HINT21 CMA 1.A.001","topic":"Statement of Comprehensive Income","question":"On January 2, Year 1, ABC Ltd. started operations manufacturing widgets. By the end of the year, it had operations in six countries. At the end of the year, the company reported the following information: What was ABC's Other Comprehensive Income amount for the year?","intro":"On January 2, Year 1, ABC Ltd.","table":[["Net income","$150,000"],["Foreign currency translation adjustment (gain)","23,000"],["Investments by owners","72,000"],["Foreign currency remeasurement loss","33,000"],["Deferred net periodic pension cost","21,000"],["Unrealized gains on available-for-sale debt securities","15,000"],["Dividends to owners","23,000"],["Deferred loss on a cash flow hedge","12,000"]],"tail":"started operations manufacturing widgets. By the end of the year, it had operations in six countries. At the end of the year, the company reported the following information: What was ABC's Other Comprehensive Income amount for the year?","options":{"A":"$204,000.","B":"$5,000.","C":"$171,000.","D":"$155,000."},"correct":"B","correctExplanation":"Comprehensive Income is the change in equity during a period from transactions and other events except for those resulting from transactions made with the owners of the company such as distribution of dividends or the sale or repurchase of shares. Comprehensive Income includes everything on the Income Statement plus some specific items that do not appear on the Income Statement that are called “Other Comprehensive Income.\" Comprehensive Income = Net Income + Other Comprehensive Income This question is about Other Comprehensive Income only. The items included in this question that are considered Other Comprehensive Income include: Foreign currency translation adjustment (gain) $23,000 Deferred net periodic pension cost (21,000) Unrealized gains on available-for-sale debt securities 15,000 Deferred loss on a cash flow hedge (12,000) Other comprehensive income $ 5,000 Investments by owners and dividends to owners should not be included in the calculation of Other Comprehensive Income as these are owner transactions. Note the difference between foreign currency translation gains and losses and foreign currency remeasurement gains and losses. Foreign currency translation gains and losses are reported in Other Comprehensive Income, whereas foreign currency remeasurement gains and losses are reported in Net Income.","explanations":{"A":"Comprehensive Income is the change in equity during a period from transactions and other events except for those resulting from transactions made with the owners of the company such as distribution of dividends or the sale or repurchase of shares. Comprehensive Income = Net Income + Other Comprehensive Income Other Comprehensive Income items include the foreign currency translation adjustment (+23,000), the deferred net periodic pension cost (-21,000), the unrealized gains on AFS debt securities (+15,000), and the deferred loss on a cash flow hedge (- 12,000). This answer includes those items, but it also includes Net Income (+150,000) which is part of Comprehensive Income but not part of Other Comprehensive Income. It also includes investments by owners (+72,000) and dividends to owners (-23,000). Investments by owners and dividends to owners should not be included in the calculation of Other Comprehensive Income as these are owner transactions.","C":"Comprehensive Income is the change in equity during a period from transactions and other events except for those resulting from transactions made with the owners of the company such as distribution of dividends or the sale or repurchase of shares. Comprehensive Income = Net Income + Other Comprehensive Income Other Comprehensive Income items include the foreign currency translation adjustment (+23,000), the deferred net periodic pension cost (-21,000), the unrealized gains on AFS debt securities (+15,000), and the deferred loss on a cash flow hedge (- 12,000). This answer includes those items, but it also includes Net Income (+150,000), which is part of Comprehensive Income but is not included in Other Comprehensive Income. It also includes investments by owners (+72,000) and dividends to owners (-23,000). Investments by owners and dividends to owners should not be included in the calculation of Other Comprehensive Income as these are owner transactions. This answer also includes the foreign currency remeasurement loss (-33,000), which is part of Net Income but not part of Other Comprehensive Income Note the difference between foreign currency translation gains and losses and foreign currency remeasurement gains and losses. Foreign currency translation gains and losses are reported in Other Comprehensive Income, whereas foreign currency remeasurement gains and losses are reported in Net Income.","D":"Comprehensive Income is the change in equity during a period from transactions and other events except for those resulting from transactions made with the owners of the company such as distribution of dividends or the sale or repurchase of shares. Comprehensive Income = Net Income + Other Comprehensive Income Other Comprehensive Income items include the foreign currency translation adjustment (+23,000), the deferred net periodic pension cost (-21,000), the unrealized gains on AFS debt securities (+15,000), and the deferred loss on a cash flow hedge (- 12,000). This answer also includes Net Income (+150,000), which is part of Comprehensive Income but not part of Other Comprehensive Income. Note the difference between foreign currency translation gains and losses and foreign currency remeasurement gains and losses. Foreign currency translation gains and losses are reported in Other Comprehensive Income, whereas foreign currency remeasurement gains and losses are reported in Net Income"},"studyUnit":"Study Unit 3: A.1. The Statement of Comprehensive Income  for","pctCorrect":52},{"num":42,"id":"HINT21 CMA 1.A.011","topic":"Statement of Comprehensive Income","question":"Accumulated Other Comprehensive Income is reported in which of the following financial statements?","intro":"","table":[],"tail":"","options":{"A":"The Statement of Cash Flows.","B":"The Statement of Comprehensive Income.","C":"Balance sheet.","D":"The income statement."},"correct":"C","correctExplanation":"Accumulated Other Comprehensive Income (AOCI) is a permanent account in the Equity section of the balance sheet. The balance in the account is reported in the balance sheet and is also included in the Statement of Changes in Stockholders’ Equity.","explanations":{"A":"Accumulated Other Comprehensive Income is not reported in the Statement of Cash Flows. It is a permanent account in the Equity section of the balance sheet.","B":"Accumulated Other Comprehensive income is not reported in the Statement of Comprehensive Income. Accumulated Other Comprehensive Income is a permanent account in the Equity section of the balance sheet. The amount of change in the Accumulated Other Comprehensive Income account during the reporting period is the Other Comprehensive Income amount that is reported in the Statement of Comprehensive Income.","D":"Accumulated Other Comprehensive Income is not reported in the Income Statement. It is a permanent account in the Equity section of the balance sheet."},"studyUnit":"Study Unit 3: A.1. The Statement of Comprehensive Income  for","pctCorrect":54},{"num":43,"id":"HINT21 CMA 1.A.004","topic":"Statement of Comprehensive Income","question":"Other Comprehensive Income includes which of the following: Investments Foreign Currency By Owners Translation Adjustments Net income I. No Yes Yes II. Yes Yes No III. No No No IV. No Yes No","intro":"","table":[],"tail":"","options":{"A":"II.","B":"III.","C":"I.","D":"IV."},"correct":"D","correctExplanation":"Comprehensive Income is the change in equity during a period from transactions and other events except for those resulting from transactions made with the owners of the company such as distribution of dividends or the sale or repurchase of shares. Comprehensive Income includes everything on the Income Statement plus some specific items that do not appear on the Income Statement that are called “Other Comprehensive Income.” Comprehensive Income = Net Income + Other Comprehensive Income The only item that is included in Other Comprehensive Income is foreign currency translation adjustments. Investments by owners are not included and Net Income is not included.","explanations":{"A":"Comprehensive Income is the change in equity during a period from transactions and other events except for those resulting from transactions made with the owners of the company such as distribution of dividends or the sale or repurchase of shares. Comprehensive Income includes everything on the Income Statement plus some specific items that do not appear on the Income Statement that are called “Other Comprehensive Income. Comprehensive Income = Net Income + Other Comprehensive Income Investments by owners are not included in Other Comprehensive Income.","B":"Comprehensive Income is the change in equity during a period from transactions and other events except for those resulting from transactions made with the owners of the company such as distribution of dividends or the sale or repurchase of shares. Comprehensive Income includes everything on the Income Statement plus some specific items that do not appear on the Income Statement that are called “Other Comprehensive Income.” Foreign currency translation adjustments are included in Other Comprehensive Income. Note the difference between foreign currency translation gains and losses and foreign currency remeasurement gains and losses. Foreign currency translation gains and losses are reported in Other Comprehensive Income, whereas foreign currency remeasurement gains and losses are reported in Net Income. Thus, the foreign currency remeasurement gain is included in Net Income, not in Other Comprehensive Income.","C":"Comprehensive Income is the change in equity during a period from transactions and other events except for those resulting from transactions made with the owners of the company such as distribution of dividends or the sale or repurchase of shares. Comprehensive Income includes everything on the Income Statement plus some specific items that do not appear on the Income Statement that are called “Other Comprehensive Income.” Comprehensive Income = Net Income + Other Comprehensive Income Net Income is not included in Other Comprehensive Income."},"studyUnit":"Study Unit 3: A.1. The Statement of Comprehensive Income  for","pctCorrect":57},{"num":44,"id":"HINT21 CMA 1.A.002","topic":"Statement of Comprehensive Income","question":"A full set of financial statements presents the elements of financial statements. One of the financial statements is the statement of comprehensive income. A statement of comprehensive income will include all of the following except:","intro":"","table":[],"tail":"","options":{"A":"Investments by owners.","B":"Foreign currency translation adjustment.","C":"Loss from discontinued operations.","D":"Foreign currency remeasurement losses."},"correct":"A","correctExplanation":"Elements of comprehensive income include revenues, expenses, gains, and losses. Comprehensive income is the change in equity (net assets) of a business entity during a period from transactions and other events and circumstances from nonowner sources. It includes all changes in equity during a period except those resulting from investments by owners and distributions to owners. Thus, comprehensive income includes all transactions that result in a change in equity except for those that result from investments by owners and distributions to owners (such as distribution of dividends or the sale or repurchase of shares). Comprehensive income includes everything on the income statement plus some specific items that do not appear on the income statement that are called “Other Comprehensive Income.” Comprehensive Income = Net Income + Other Comprehensive Income Thus, investments by owners are not included in the statement of comprehensive income.","explanations":{"B":"Elements of comprehensive income include revenues, expenses, gains, and losses. A foreign currency translation adjustment is part of other comprehensive income, and other comprehensive income is a part of comprehensive income. Comprehensive Income = Net Income + Other Comprehensive Income","C":"Elements of comprehensive income include revenues, expenses, gains, and losses. A loss from discontinued operations is part of net income, and net income is a part of comprehensive income. Comprehensive Income = Net Income + Other Comprehensive Income","D":"Elements of comprehensive income include revenues, expenses, gains, and losses. Foreign currency remeasurement losses are part of net income, and net income is a part of comprehensive income. Comprehensive Income = Net Income + Other Comprehensive Income Note the difference between foreign currency remeasurement gains and losses and foreign currency translation gains and losses. Both are part of comprehensive income, but foreign currency remeasurement gains and losses are reported in net income whereas foreign currency translation gains and losses are reported in other comprehensive income."},"studyUnit":"Study Unit 3: A.1. The Statement of Comprehensive Income  for","pctCorrect":82},{"num":45,"id":"HINT21 CMA 1.A.007","topic":"Statement of Comprehensive Income","question":"Which of the following would cause the Comprehensive Income reported in the Statement of Comprehensive Income to differ from Net Income?","intro":"","table":[],"tail":"","options":{"A":"Foreign currency remeasurement losses.","B":"Gains and losses of a cash flow hedge.","C":"Dividends declared but remaining unpaid at the end of the year.","D":"Realized gain on available-for-sale debt securities."},"correct":"B","correctExplanation":"Comprehensive Income is the change in equity during a period from transactions and other events except for those resulting from transactions made with the owners of the company such as distribution of dividends or the sale or repurchase of shares. It includes everything on the Income Statement plus some specific items that do not appear on the Income Statement that are called “Other Comprehensive Income.” Comprehensive Income = Net Income + Other Comprehensive Income Thus, only items included in Other Comprehensive Income will cause Comprehensive Income reported in the Statement of Comprehensive Income to differ from Net Income. Gains and losses of a cash flow hedge are reported in Other Comprehensive Income and not in Net Income, so they would cause Comprehensive Income to differ from Net Income. Note the difference between foreign currency translation gains and losses and foreign currency remeasurement gains and losses. Foreign currency translation gains and losses are reported in Other Comprehensive Income, whereas foreign currency remeasurement gains and losses are reported in Net Income. Thus, a foreign currency remeasurement loss would be reported in Net Income and would not cause the Comprehensive Income reported in the Statement of Comprehensive Income to differ from Net Income.","explanations":{"A":"Comprehensive Income = Net Income + Other Comprehensive Income Thus, only items included in Other Comprehensive Income will cause Comprehensive Income reported in the Statement of Comprehensive Income to differ from Net Income. Foreign currency remeasurement gains and losses are reported in Net Income and so would also be included in Comprehensive Income, so they would not cause Comprehensive Income to differ from Net Income. Note the difference between foreign currency translation gains and losses and foreign currency remeasurement gains and losses. Foreign currency translation gains and losses are reported in Other Comprehensive Income, whereas foreign currency remeasurement gains and losses are reported in Net Income.","C":"Comprehensive Income is the change in equity during a period from transactions and other events except for those resulting from transactions made with the owners of the company such as distribution of dividends or the sale or repurchase of shares. Dividends declared are transactions with the owners of the company. Dividends declared do not affect either Net Income or Comprehensive Income, so they would not cause Comprehensive Income to differ from Net Income.","D":"Comprehensive Income = Net Income + Other Comprehensive Income Thus, only items included in Other Comprehensive Income will cause Comprehensive Income reported in the Statement of Comprehensive Income to differ from Net Income. Realized gain on available-for-sale debt securities is reported in Net Income and so would also be included in Comprehensive Income, so it would not cause Comprehensive Income to differ from Net Income. (Unrealized gain on available-for- sale debt securities is not reported in the Income Statement but is part of Other Comprehensive Income and thus would cause Comprehensive Income to differ from Net Income, but this answer choice asks about realized gain on AFS debt securities.)"},"studyUnit":"Study Unit 3: A.1. The Statement of Comprehensive Income  for","pctCorrect":43},{"num":46,"id":"HINT21 CMA 1.A.005","topic":"Statement of Comprehensive Income","question":"Comprehensive Income includes which of the following: Dividends Foreign Currency Loss on Paid Remeasurement Discontinued To Owners Adjustments Operations I. No No Yes II. Yes No Yes III. No No No IV. Yes No No","intro":"","table":[],"tail":"","options":{"A":"II.","B":"I.","C":"III.","D":"IV."},"correct":"A","correctExplanation":"Comprehensive Income is the change in equity during a period from transactions and other events except for those resulting from transactions made with the owners of the company such as distribution of dividends or the sale or repurchase of shares. Comprehensive Income includes everything on the Income Statement plus some specific items that do not appear on the Income Statement that are called “Other Comprehensive Income.” Comprehensive Income = Net Income + Other Comprehensive Income Foreign currency remeasurement adjustments are included in Net Income, so they are part of Comprehensive Income. Dividends to owners are transactions with owners of the company, so those are not part of Comprehensive Income. Gains and losses on discontinued operations are included in Net Income, so a loss on discontinued operations is included in Comprehensive Income.","explanations":{"B":"Comprehensive Income is the change in equity during a period from transactions and other events except for those resulting from transactions made with the owners of the company such as distribution of dividends or the sale or repurchase of shares. Comprehensive Income includes everything on the Income Statement plus some specific items that do not appear on the Income Statement that are called “Other Comprehensive Income.” Foreign currency remeasurement adjustments are included on the Income Statement, so those are part of Comprehensive Income. Note the difference between foreign currency translation gains and losses and foreign currency remeasurement gains and losses. Foreign currency translation gains and losses are reported in Other Comprehensive Income, whereas foreign currency remeasurement gains and losses are reported in Net Income.","C":"Comprehensive Income is the change in equity during a period from transactions and other events except for those resulting from transactions made with the owners of the company such as distribution of dividends or the sale or repurchase of shares. Comprehensive Income includes everything on the Income Statement plus some specific items that do not appear on the Income Statement that are called “Other Comprehensive Income.” Foreign currency remeasurement adjustments are included on the Income Statement, so those are part of Comprehensive Income. Note the difference between foreign currency translation gains and losses and foreign currency remeasurement gains and losses. Foreign currency translation gains and losses are reported in Other Comprehensive Income, whereas foreign currency remeasurement gains and losses are reported in Net Income. Gains and losses on discontinued operations are included in Net Income, so a loss on discontinued operations is included in Comprehensive Income.","D":"Comprehensive Income is the change in equity during a period from transactions and other events except for those resulting from transactions made with the owners of the company such as distribution of dividends or the sale or repurchase of shares. Comprehensive Income includes everything on the Income Statement plus some specific items that do not appear on the Income Statement that are called “Other Comprehensive Income.” Gains and losses on discontinued operations are included in Net Income, so a loss on discontinued operations is included in Comprehensive Income."},"studyUnit":"Study Unit 3: A.1. The Statement of Comprehensive Income  for","pctCorrect":48},{"num":47,"id":"HINT21 CMA 1.A.012","topic":"Statement of Comprehensive Income","question":"Which of the following is a part of Other Comprehensive Income?","intro":"","table":[],"tail":"","options":{"A":"Impairment losses on fixed assets.","B":"Unrealized gains and losses on a debt security transferred from the held-to- maturity classification to the available-for-sale classification.","C":"Allowance for credit losses on accounts receivable under the Current Expected Credit Losses model.","D":"Year-end accruals of liabilities."},"correct":"B","correctExplanation":"Unrealized gains and losses on a debt security transferred from the held-to-maturity classification to the available-for-sale classification are reported as Other Comprehensive Income. If a held-to-maturity debt security is transferred into the available-for-sale classification, the entity must • Reverse in earnings any allowance for credit losses previously recorded on the security at the transfer date • Reclassify the debt security to the available-for-sale classification at its amortized cost basis (reduced by any previous writeoffs but excluding any allowance for credit losses). The amortized cost basis is used for subsequent amortization of the historical premium or discount and for comparisons of fair value and amortized cost for determining unrealized holding gains and losses going forward. • Determine if an allowance for credit losses is necessary • Report in Other Comprehensive Income any unrealized gain or loss on the available-for-sale debt security at the date of transfer, excluding any amount recorded in the Allowance for Credit Losses • Consider whether the transfer calls into question the entity’s intent and ability to continue to classify as held-to-maturity the securities remaining in the held-to- maturity category.","explanations":{"A":"Under U.S. GAAP, fixed assets are not written up to recognize any increase in the fair value of the asset over time. However, according to ASC 360-10-35-17, a company must write its fixed assets down if the carrying value of the assets is not recoverable and exceeds their fair value. The amount by which an impaired asset is written down is reported as a current period loss, so it is reported in earnings and not as Other Comprehensive Income.","C":"The Allowance for Credit Losses is a contra-asset account on the balance sheet. Credit Loss Expense is an Income Statement item. Neither one is part of Other Comprehensive Income.","D":"Year-end accruals of liabilities are reported on the balance sheet and the accrued expense is reported in the income statement. Neither one is part of Other Comprehensive Income."},"studyUnit":"Study Unit 3: A.1. The Statement of Comprehensive Income  for","pctCorrect":92},{"num":48,"id":"HINT21 CMA 1.A.003","topic":"Statement of Comprehensive Income","question":"On January 4, Year 1, XYZ Inc. started operations manufacturing bathroom accessories. By the end of Year 5, it had operations in nine countries. At the end of the year, the company reported the following information: What is XYZ's Comprehensive Income (Loss) for Year 5?","intro":"On January 4, Year 1, XYZ Inc.","table":[["Net income","$323,000"],["Foreign currency translation adjustment (loss)","33,000"],["Investments by owners","32,000"],["Foreign currency remeasurement gain","22,000"],["Deferred net periodic pension benefit cost","55,000"],["Unrealized losses on available-for-sale debt securities","215,000"],["Dividends paid to owners","125,000"],["Deferred gain on a cash flow hedge","57,000"]],"tail":"started operations manufacturing bathroom accessories. By the end of Year 5, it had operations in nine countries. At the end of the year, the company reported the following information: What is XYZ's Comprehensive Income (Loss) for Year 5?","options":{"A":"$(246,000).","B":"$77,000.","C":"$6,000.","D":"$99,000."},"correct":"B","correctExplanation":"Comprehensive Income is the change in equity during a period from transactions and other events except for those resulting from transactions made with the owners of the company such as distribution of dividends or the sale or repurchase of shares. Comprehensive Income includes everything on the Income Statement plus some specific items that do not appear on the Income Statement that are called “Other Comprehensive Income.\" Comprehensive Income = Net Income + Other Comprehensive Income. This question asks about Comprehensive Income, so it includes Net Income plus the specific items included in Other Comprehensive Income: Net income $ 323,000 Other Comprehensive Income items: Foreign currency translation adjustment (loss) (33,000) Deferred net periodic pension benefit cost (55,000) Unrealized losses on available-for-sale debt (215,000) securities Deferred gain on a cash flow hedge 57,000 Total other comprehensive income (OCI) items (246,000) Comprehensive income (net income and OCI) $ 77,000 Investments by owners and dividends to owners are not included as those are owner transactions. Note the difference between foreign currency translation adjustments and foreign currency remeasurement gains and losses. Foreign currency translation adjustments are reported in Other Comprehensive Income, whereas foreign currency remeasurement gains and losses are reported in Net Income. Thus, the foreign currency remeasurement adjustment is included in Net Income, not in Other Comprehensive Income.","explanations":{"A":"This answer represents the amount of Other Comprehensive Income (Loss) for the year. However, the question asks for Comprehensive Income. Comprehensive Income includes both Net Income and Other Comprehensive Income (Loss). (“Other Comprehensive Income [Loss]” for a period is the net of the debit and credit transactions for the period in the Accumulated Other Comprehensive Income account.) Comprehensive Income = Net Income + Other Comprehensive Income","C":"Comprehensive Income includes both Net Income and Other Comprehensive Income. Comprehensive Income = Net Income + Other Comprehensive Income This answer includes Net Income and Other Comprehensive Income, including correctly as Other Comprehensive Income the foreign currency translation adjustment, deferred net periodic pension benefit cost, unrealized losses on AFS debt securities, and deferred gains on a cash flow hedge) However, it also incorrectly includes owner transactions, which are not part of Comprehensive Income; and it also incorrectly includes the foreign currency remeasurement gain, which is already included in Net Income. Note the difference between foreign currency translation adjustments and foreign currency remeasurement gains and losses. Foreign currency translation adjustments are reported in Other Comprehensive Income, whereas foreign currency remeasurement gains and losses are reported in Net Income. Thus, the foreign currency remeasurement gain is included in Net Income, not in Other Comprehensive Income.","D":"Comprehensive Income includes both Net Income and Other Comprehensive Income. Comprehensive Income = Net Income + Other Comprehensive Income This answer correctly includes Other Comprehensive Income (the foreign currency translation adjustment, deferred net periodic pension benefit cost, unrealized losses on AFS debt securities, and deferred gains on a cash flow hedge) and Net Income. However, it incorrectly also includes the foreign currency remeasurement gain, which is an Income Statement item and is already a part of Net Income; so that item is included twice. Note the difference between foreign currency translation adjustments and foreign currency remeasurement gains and losses. Foreign currency translation adjustments are reported in Other Comprehensive Income, whereas foreign currency remeasurement gains and losses are reported in Net Income."},"studyUnit":"Study Unit 3: A.1. The Statement of Comprehensive Income  for","pctCorrect":47},{"num":49,"id":"ICMA 10.P2.004","topic":"Statement of Owners Equity and Limitations of Financial Statements","question":"The statement of changes in stockholders' equity shows a","intro":"","table":[],"tail":"","options":{"A":"listing of all stockholders' equity accounts and their corresponding dollar amounts.","B":"reconciliation of the beginning and ending balances in the individual stockholders' equity accounts.","C":"computation of the number of shares outstanding used for earnings per share calculations.","D":"reconciliation of the beginning and ending balances in the Retained Earnings account."},"correct":"B","correctExplanation":"Firms are required to present a reconciliation of the beginning and ending balances of their stockholders' equity accounts. The statement of changes in stockholders' equity reports the changes in each stockholders' equity account and in total stockholders' equity during the year and reconciles the beginning balance in each account with the ending balance.","explanations":{"A":"This is a description of the equity section of the balance sheet. The statement of changes in stockholders' equity shows more than just the ending balances of the stockholders' equity accounts.","C":"The computation of the number of shares outstanding used for earnings per share calculations is not shown on the statement of changes in stockholders' equity.","D":"The statement of changes in stockholders' equity shows more than just a reconciliation of the beginning and ending balances in the Retained Earnings account."},"studyUnit":"Study Unit 4: A.1. The Statement of Owners' Equity and Notes to FS covers the","pctCorrect":69},{"num":50,"id":"HCH CMA P1.A.1.04001","topic":"Statement of Owners Equity and Limitations of Financial Statements","question":"What is the primary purpose of the notes to financial statements?","intro":"","table":[],"tail":"","options":{"A":"To present a thorough picture of the company's financial position and the results of its operations.","B":"To detail management’s future business strategies.","C":"To explain the company's marketing and sales performance.","D":"To disclose financial data of competitors for benchmarking purposes."},"correct":"A","correctExplanation":"The notes to financial statements are meant to give users a comprehensive understanding of a company’s financial health and operational results by explaining the figures reported in the main financial statements, including the assumptions and methods used in accounting practices.","explanations":{"B":"The notes to financial statements do not typically include details about management’s future strategies. Instead, notes are focused on providing additional information about the company’s current financial status and the methods used to prepare the financial statements.","C":"The notes to financial statements are not designed to discuss marketing or sales performance. The notes are supplementary information intended to provide clarity on financial data, accounting policies, and any items that affect the financial statements.","D":"The notes to financial statements do not contain information about competitors. The purpose of the notes is to provide further insight into the company’s own financial statements, not to compare the company with its competitors."},"studyUnit":"Study Unit 4: A.1. The Statement of Owners' Equity and Notes to FS covers the","pctCorrect":87},{"num":51,"id":"HOCK CMA P1.A.1.04001","topic":"Statement of Owners Equity and Limitations of Financial Statements","question":"Which of the following is not a part of a full set of financial statements but is a part of general purpose financial reporting?","intro":"","table":[],"tail":"","options":{"A":"Liabilities.","B":"Assets.","C":"Comprehensive income.","D":"Notes to the financial statements."},"correct":"D","correctExplanation":"Notes to the financial statements are a required part of general purpose financial reporting, but they are not considered to be part of a full set of financial statements according to the FASB’s Statement of Financial Accounting Concepts No. 8, Chapter 7, dated December 2021.","explanations":{"A":"Liabilities are one of the elements of financial statements, and they are part of a full set of financial statements and a part of general purpose financial reporting. Please see the correct answer explanation for more information.","B":"Assets are one of the elements of financial statements, and they are part of a full set of financial statements and a part of general purpose financial reporting. Please see the correct answer explanation for more information.","C":"Comprehensive income is one of the elements of financial statements, and it is part of a full set of financial statements and a part of general purpose financial reporting. Please see the correct answer explanation for more information"},"studyUnit":"Study Unit 4: A.1. The Statement of Owners' Equity and Notes to FS covers the","pctCorrect":86},{"num":52,"id":"HCH CMA P1.A.1.04002","topic":"Statement of Owners Equity and Limitations of Financial Statements","question":"Which of the following is not a limitation of financial statements in general?","intro":"","table":[],"tail":"","options":{"A":"Financial statements provide a qualitative assessment of management effectiveness.","B":"Financial statements do not include transactions of other companies, such as competitors.","C":"Financial statements primarily reflect transactions that have already occurred.","D":"Financial statements are based on historical cost, which may not reflect current market values."},"correct":"A","correctExplanation":"This is not a limitation of financial statements in general, because financial statements do not provide a qualitative assessment of management effectiveness. They are quantitative documents that present financial data such as assets, liabilities, income, and expenses. Any assessment of management effectiveness would come from other sources, such as management discussion and analysis (MD&A) sections or internal performance evaluations.","explanations":{"B":"Financial statements are specific to the reporting entity and do not provide information about other companies, including competitors. This limitation means users cannot directly compare the company’s performance with that of others solely based on its financial statements.","C":"Financial statements reflect past transactions and events. They do not provide forward- looking information, which is a limitation. The historical nature of financial statements can limit their usefulness for predicting future performance or conditions.","D":"Financial statements often use historical cost as a basis for valuing assets and liabilities. This can be a limitation as historical costs may not reflect the current fair value or market value, leading to potentially outdated or irrelevant information for decision-making purposes."},"studyUnit":"Study Unit 4: A.1. The Statement of Owners' Equity and Notes to FS covers the","pctCorrect":58},{"num":53,"id":"HCH CMA P1.A.1.04003","topic":"Statement of Owners Equity and Limitations of Financial Statements","question":"Which of the following is an example of an accounting policy disclosure required in the notes to financial statements?","intro":"","table":[],"tail":"","options":{"A":"The company's long-term strategic goals and objectives.","B":"The company’s marketing strategy and future sales projections.","C":"The basis of consolidation used for preparing financial statements.","D":"The detailed salaries of the executive management team."},"correct":"C","correctExplanation":"For a company that consolidates its financial statements with those of other entities, the basis of consolidation is an example of an accounting policy disclosure that must be included in the notes to financial statements. It explains how a company consolidates its financial statements, detailing whether it includes subsidiaries, joint ventures, or associates in its consolidated financial statements and the methods used for consolidation.","explanations":{"A":"Long-term strategic goals and objectives are not part of the required accounting policy disclosures. These goals and objectives are usually found in the management discussion and analysis (MD&A) or other narrative sections of a company's annual report, not in the notes that accompany financial statements. The notes focus on accounting practices, such as revenue recognition, inventory valuation, and depreciation methods.","B":"Marketing strategies and sales projections are not part of accounting policy disclosures in the notes to financial statements. Accounting policy disclosures focus on the accounting principles and methods applied in financial reporting, not on business strategies or forecasts.","D":"Detailed salaries of executive management are not typically included in the accounting policy disclosures in the notes to financial statements. While some disclosures related to executive compensation might be required in other parts of a financial report, they are not considered accounting policies"},"studyUnit":"Study Unit 4: A.1. The Statement of Owners' Equity and Notes to FS covers the","pctCorrect":81},{"num":54,"id":"ICMA 0807.P2.064","topic":"Statement of Owners Equity and Limitations of Financial Statements","question":"A statement concerning the accounting principles employed by a company in the preparation of its publicly issued financial statements","intro":"","table":[],"tail":"","options":{"A":"should be disclosed in the notes to the financial statements.","B":"should be disclosed in the management’s discussion and analysis.","C":"must be shown on the face of the income statement.","D":"may be disclosed in the notes to the financial statements or on the face of the income statement."},"correct":"A","correctExplanation":"Notes and supplemental information are a required part of general purpose financial reporting. “General purpose financial reporting” is defined as a full set of financial statements plus the notes to financial statements and other required supplemental information. Whenever financial statements claim to present fairly the financial position, cash flows, and results of operations in accordance with generally accepted accounting principles, a description of all significant accounting policies of the company must be included. The first note to financial statements is a summary of significant accounting policies, such as what method of depreciation is being used or how inventories are valued and what cost flow assumption is being used. Disclosure of accounting policies is used to identify and describe the principles of accounting being followed by the company and the methods used for applying the principles that materially affect the presentation of the company’s financial position, cash flows, and results of operations in accordance with generally accepted accounting principles.","explanations":{"B":"A statement concerning the accounting principles employed by a company in the preparation of its publicly issued financial statements is not disclosed in the Management’s Discussion and Analysis. The Management Discussion and Analysis (MD&A) is an important part of the financial statements that must be submitted to the SEC by all companies that report to the SEC. The purposes of the MD&A are (1) to provide a narrative explanation of the company’s financial statements for investors; (2) to improve overall financial disclosure and provide context within which the financial statements should be analyzed; and (3) to provide information about the quality and potential variability of the company’s earnings and cash flows so that investors can ascertain the likelihood that past performance is indicative of future performance. However, the MD&A section of the annual report is not the place to disclose the accounting principles employed by the company. Please see the correct answer explanation for more information.","C":"A statement concerning the accounting principles employed by a company in the preparation of its publicly issued financial statements is not shown on the face of the income statement. Please see the correct answer explanation for more information.","D":"A statement concerning the accounting principles employed by a company in the preparation of its publicly issued financial statements is not disclosed on the face of the income statement. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 4: A.1. The Statement of Owners' Equity and Notes to FS covers the","pctCorrect":74},{"num":55,"id":"CIA 1193 P4 Q33","topic":"Statement of Cash Flows Overview","question":"Select the combination below that explains the impact of credit card interest incurred and paid during the period on (1) equity on the balance sheet and (2) the statement of cash flows.","intro":"","table":[],"tail":"","options":{"A":"(1) Decrease (2) Operating outflow","B":"(1) Decrease (2) Financing outflow","C":"(1) No effect (2) Operating outflow","D":"(1) No effect (2) Financing outflow"},"correct":"A","correctExplanation":"Credit card interest that is incurred will decrease equity because it is an expense that will reduce income, and therefore retained earnings. Interest paid is an operating activity on the statement of cash flows so it will be recorded as an operating cash outflow.","explanations":{"B":"Interest paid is classified as an operating activity on the statement of cash flows. See the correct answer for a complete explanation.","C":"Interest expense incurred will have an effect on equity on the balance sheet. See the correct answer for a complete explanation.","D":"Interest expense incurred will have an effect on equity on the balance sheet, and interest paid will be classified as an operating activity on the statement of cash flows. See the correct answer for a complete explanation."},"studyUnit":"Study Unit 5: A.1. Statement of Cash Flows Introduction  for this","pctCorrect":39},{"num":56,"id":"CMA 1296 P2 Q22","topic":"Statement of Cash Flows Overview","question":"Which one of the following transactions should be classified as a financing activity in a statement of cash flows?","intro":"","table":[],"tail":"","options":{"A":"Purchase of equipment.","B":"Sale of trademarks.","C":"Purchase of treasury stock.","D":"Payment of interest on a mortgage note."},"correct":"C","correctExplanation":"The purchase of treasury shares is classified as a cash flow from financing activities in the statement of cash flows.","explanations":{"A":"Purchase of equipment is a cash flow from investing activities in the statement of cash flows.","B":"The sale of trademarks would be classified as a cash inflow from investing activities on the statement of cash flows because a trademark is considered to be a long-lived asset.","D":"The payment of interest is classified as a cash flow from operating activities on the statement of cash flows"},"studyUnit":"Study Unit 5: A.1. Statement of Cash Flows Introduction  for this","pctCorrect":76},{"num":57,"id":"CIA 0592 P4 Q35","topic":"Statement of Cash Flows Overview","question":"A financial statement includes all of the following items: net income, depreciation, operating activities, and financing activities. What financial statement is this?","intro":"","table":[],"tail":"","options":{"A":"Income statement.","B":"Statement of changes in stockholders' equity.","C":"Balance sheet.","D":"Statement of cash flows."},"correct":"D","correctExplanation":"Net income, depreciation, operating activities, and financing activities are items that will appear on a statement of cash flows prepared using the indirect method.","explanations":{"A":"Operating activities and financing activities are not part of the income statement.","B":"Depreciation, operating activities, and financing activities are not part of the statement of changes in stockholders' equity.","C":"Net income, operating activities and financing activities are not part of the balance sheet."},"studyUnit":"Study Unit 5: A.1. Statement of Cash Flows Introduction  for this","pctCorrect":82},{"num":58,"id":"CMA 0695 P2 Q21","topic":"Statement of Cash Flows Overview","question":"With respect to the statement of cash flows, the FASB Accounting Standards Codification® classifies business transactions into operating, investing, and financing activities. Which one of the following transactions should not be classified as a financing activity?","intro":"","table":[],"tail":"","options":{"A":"Issuance of common stock.","B":"Income tax refund.","C":"Payment of dividends.","D":"Purchase of treasury stock."},"correct":"B","correctExplanation":"An income tax refund is classified as an operating activity.","explanations":{"A":"The issuance of common stock is classified as a financing activity.","C":"The payment of dividends is classified as a financing activity.","D":"The purchase of treasury stock is classified as a financing activity"},"studyUnit":"Study Unit 5: A.1. Statement of Cash Flows Introduction  for this","pctCorrect":84},{"num":59,"id":"HTB 1.1.015","topic":"Statement of Cash Flows Overview","question":"On November 15, 20X0, Senger Machining Corp. purchased a $300,000 U.S. Treasury bond with a maturity date of January 31, 20X1. On December 31, 20X0, Senger still owned the Treasury bond. Senger treats all highly liquid investments with maturities of three months or less when purchased as cash equivalents. On Senger’s statement of cash flows for December 31, 20X0, how should the U.S. Treasury bond be reported?","intro":"","table":[],"tail":"","options":{"A":"As a cash outflow from lending activities.","B":"As a part of the cash, cash equivalents, and restricted cash ending balance.","C":"It should not be included.","D":"As a cash outflow from investing activities."},"correct":"B","correctExplanation":"The Treasury bond with a maturity date of January 31, 20X1 was a highly liquid investment with a maturity of three months or less when it was purchased on November 15, 20X0, and therefore, it is a cash equivalent. The purchase (and sale) of a cash equivalent is not reflected on the statement of cash flows as either a cash inflow or a cash outflow. However, its balance will be included in the ending balance of cash, cash equivalents, and restricted cash on the statement of cash flows.","explanations":{"A":"The Treasury bond with a maturity date of January 31, 20X1 should not be reported as a lending activity.","C":"The Treasury bond with a maturity date of January 31, 20X1 is included in the statement of cash flows.","D":"The Treasury bond with a maturity date of January 31, 20X1 should not be included as an investing activity."},"studyUnit":"Study Unit 5: A.1. Statement of Cash Flows Introduction  for this","pctCorrect":47},{"num":60,"id":"CMA 0688 P4 Q28","topic":"Statement of Cash Flows Overview","question":"In preparing a statement of cash flows, an item included in determining net cash flow from operating activities is the","intro":"","table":[],"tail":"","options":{"A":"amortization of a bond premium.","B":"purchase of treasury stock.","C":"proceeds from the sale of equipment for cash.","D":"cash dividends paid."},"correct":"A","correctExplanation":"The adjustment for the amortization of bond premium is part of the calculation of cash flows from operating activities.","explanations":{"B":"Purchase of treasury stock is a cash flow from a financing activity.","C":"Proceeds from the sale of equipment for cash are cash flows from investing activities.","D":"Cash dividends paid are cash flows from financing activities."},"studyUnit":"Study Unit 5: A.1. Statement of Cash Flows Introduction  for this","pctCorrect":64},{"num":61,"id":"CMA 0697 P2 Q2","topic":"Statement of Cash Flows Overview","question":"When preparing the statement of cash flows, companies are required to report separately as operating cash flows all of the following except","intro":"","table":[],"tail":"","options":{"A":"Cash dividends paid on the company's stock.","B":"Interest paid on the company's bonds.","C":"Interest received on investments in bonds.","D":"Cash collected from customers."},"correct":"A","correctExplanation":"Cash dividends paid are classified as cash flows from financing activities on the statement of cash flows.","explanations":{"B":"Interest paid is a cash flow from operating activities.","C":"Interest received is a cash flow from operating activities.","D":"Cash collected from customers is a cash flow from operating activities."},"studyUnit":"Study Unit 5: A.1. Statement of Cash Flows Introduction  for this","pctCorrect":74},{"num":62,"id":"ICMA 10.P2.012","topic":"Statement of Cash Flows Overview","question":"The sale of available-for-sale debt securities should be accounted for on the statement of cash flows as a(n)","intro":"","table":[],"tail":"","options":{"A":"financing activity.","B":"investing activity.","C":"operating activity.","D":"noncash investing and financing activity."},"correct":"B","correctExplanation":"Investing activities are those activities that the company undertakes to generate a future profit, or return, such as purchasing and selling fixed assets, purchasing and selling stock of other companies, purchasing and selling debt instruments, and purchasing and selling available-for-sale or held-to-maturity securities. Therefore, the sale of available-for-sale debt securities should be classified on the statement of cash flows as an investing activity. According to the FASB Accounting Standards Codification®, Paragraph 230-10-45-11, \"Cash flows from purchases, sales, and maturities of available-for-sale debt securities shall be classified as cash flows from investing activities and reported gross in the statement of cash flows.\"","explanations":{"A":"Financing activities are the activities that a company undertakes to raise capital to finance the business. The sale of available-for-sale debt securities is not classified on the statement of cash flows as a financing activity.","C":"The sale of available-for-sale debt securities
