<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0C0F14" />
<meta name="description" content="CMA US exam practice — questions, explanations, and 20-question mock exams." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="CMA Practice" />
<meta name="mobile-web-app-capable" content="yes" />
<title>CMA Practice · Section A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0C0F14; --surface:#141A22; --surface-2:#1B222C; --surface-3:#212B37;
    --border:#263040; --border-soft:#1E2732;
    --text:#E7EBF1; --text-dim:#8A94A6; --text-faint:#5C6675;
    --gold:#E5B567; --gold-soft:rgba(229,181,103,.13); --gold-line:rgba(229,181,103,.35);
    --emerald:#46D19E; --emerald-soft:rgba(70,209,158,.12); --emerald-line:rgba(70,209,158,.4);
    --rose:#F0778A; --rose-soft:rgba(240,119,138,.12); --rose-line:rgba(240,119,138,.4);
    --sans:'Inter',system-ui,-apple-system,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --r:14px; --r-sm:10px;
    --shadow:0 8px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--text);font-family:var(--sans);
    font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  .app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
    padding:0 18px calc(28px + env(safe-area-inset-bottom));position:relative}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .mono{font-family:var(--mono)}

  /* ---------- Top bar ---------- */
  .topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 72%,rgba(12,15,20,0));
    padding:calc(14px + env(safe-area-inset-top)) 0 10px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em}
  .brand .mark{width:30px;height:30px;border-radius:8px;background:var(--gold-soft);
    border:1px solid var(--gold-line);display:grid;place-items:center;color:var(--gold);
    font-family:var(--mono);font-weight:700;font-size:14px}
  .brand small{display:block;font-size:11px;font-weight:500;color:var(--text-dim);letter-spacing:.04em}
  .backbtn{margin-left:0;display:inline-flex;align-items:center;gap:7px;color:var(--text-dim);
    font-weight:600;font-size:14px;padding:8px 12px 8px 8px;border-radius:10px}
  .backbtn:active{background:var(--surface)}
  .spacer{flex:1}
  .pill{font-family:var(--mono);font-size:12px;color:var(--text-dim);
    border:1px solid var(--border);border-radius:999px;padding:5px 11px;background:var(--surface)}

  /* ---------- Home ---------- */
  .hero{padding:16px 2px 8px}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--gold);
    text-transform:uppercase;margin-bottom:14px}
  .hero h1{font-size:34px;line-height:1.05;letter-spacing:-.03em;font-weight:800}
  .hero h1 em{font-style:normal;color:var(--gold)}
  .hero p{color:var(--text-dim);margin-top:12px;font-size:15px;max-width:44ch}
  .stats{display:flex;gap:10px;margin:22px 0 8px}
  .stat{flex:1;background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--r);
    padding:14px 14px 12px}
  .stat .n{font-family:var(--mono);font-size:23px;font-weight:700;letter-spacing:-.02em}
  .stat .l{font-size:12px;color:var(--text-dim);margin-top:2px}

  .section-label{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--text-faint);margin:26px 2px 12px}

  .mode{display:block;width:100%;text-align:left;background:var(--surface);
    border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:12px;
    transition:transform .12s ease,border-color .18s ease,background .18s ease;position:relative;overflow:hidden}
  .mode:active{transform:scale(.985)}
  .mode.primary{border-color:var(--gold-line);background:
    linear-gradient(180deg,var(--gold-soft),transparent 60%),var(--surface)}
  .mode h3{font-size:18px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
  .mode h3 .ico{width:22px;height:22px;color:var(--gold);flex:0 0 auto}
  .mode p{color:var(--text-dim);font-size:14px;margin-top:6px;padding-right:30px}
  .mode .go{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--text-faint)}
  .mode.primary .go{color:var(--gold)}

  /* topic chips */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .chip{font-size:13px;color:var(--text-dim);background:var(--surface);border:1px solid var(--border-soft);
    border-radius:999px;padding:9px 13px;font-weight:500;transition:.15s;line-height:1.2}
  .chip .c{font-family:var(--mono);color:var(--text-faint);margin-left:6px;font-size:11px}
  .chip.on{color:var(--bg);background:var(--gold);border-color:var(--gold)}
  .chip.on .c{color:rgba(12,15,20,.6)}
  .chip:active{transform:scale(.96)}

  /* ---------- Question card ---------- */
  .progress-rail{display:flex;align-items:center;gap:12px;margin:6px 2px 16px}
  .bar{flex:1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .3s ease}
  .bar.exam > i{background:linear-gradient(90deg,var(--gold),#F0C77E)}
  .count{font-family:var(--mono);font-size:13px;color:var(--text-dim);white-space:nowrap}
  .count b{color:var(--text);font-weight:700}

  .qcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
    padding:20px 18px;box-shadow:var(--shadow)}
  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .qnum{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--gold);
    background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:8px;padding:4px 9px}
  .qtopic{font-size:12px;color:var(--text-dim);line-height:1.3}
  .qid{font-family:var(--mono);font-size:11px;color:var(--text-faint);margin-left:auto;flex:0 0 auto}

  .qtext{font-size:17px;line-height:1.5;font-weight:500;letter-spacing:-.005em}
  .qtext .intro{color:var(--text)}
  .qtail{font-size:17px;line-height:1.5;font-weight:600;margin-top:14px;letter-spacing:-.005em}

  table.data{width:100%;border-collapse:collapse;margin:14px 0 2px;
    background:var(--surface-2);border:1px solid var(--border-soft);border-radius:10px;overflow:hidden}
  table.data td{padding:8px 12px;font-size:14px;border-bottom:1px solid var(--border-soft)}
  table.data tr:last-child td{border-bottom:none}
  table.data td:first-child{color:var(--text-dim)}
  table.data td:last-child{text-align:right;font-family:var(--mono);font-weight:500;white-space:nowrap}

  .options{margin-top:18px;display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;
    background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);
    padding:14px 14px;font-size:15px;line-height:1.45;transition:border-color .15s,background .15s,transform .1s}
  .opt:active{transform:scale(.99)}
  .opt .key{font-family:var(--mono);font-weight:700;font-size:13px;width:26px;height:26px;flex:0 0 auto;
    border-radius:7px;display:grid;place-items:center;background:var(--surface-3);color:var(--text-dim);
    border:1px solid var(--border);transition:.15s}
  .opt .txt{flex:1;padding-top:2px}
  .opt.sel{border-color:var(--gold-line);background:linear-gradient(180deg,var(--gold-soft),transparent),var(--surface-2)}
  .opt.sel .key{background:var(--gold);color:var(--bg);border-color:var(--gold)}
  /* revealed states */
  .opt.correct{border-color:var(--emerald-line);background:var(--emerald-soft)}
  .opt.correct .key{background:var(--emerald);color:#062319;border-color:var(--emerald)}
  .opt.wrong{border-color:var(--rose-line);background:var(--rose-soft)}
  .opt.wrong .key{background:var(--rose);color:#2a0810;border-color:var(--rose)}
  .opt.dim{opacity:.55}
  .opt .tick{margin-left:auto;flex:0 0 auto;align-self:center}
  .locked .opt{cursor:default}

  /* explanation */
  .explain{margin-top:16px;border-top:1px dashed var(--border);padding-top:16px;
    animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .verdict{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;margin-bottom:12px}
  .verdict.ok{color:var(--emerald)} .verdict.no{color:var(--rose)}
  .verdict .ans{font-family:var(--mono);margin-left:auto;font-size:13px;color:var(--text-dim);font-weight:500}
  .exp-block{margin-bottom:12px}
  .exp-block .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--text-faint);margin-bottom:4px}
  .exp-block.main .lbl{color:var(--emerald)}
  .exp-block p{font-size:14px;line-height:1.6;color:var(--text-dim)}
  .exp-block.main p{color:var(--text)}
  .meta{font-family:var(--mono);font-size:11px;color:var(--text-faint);margin-top:6px;line-height:1.5}

  /* ---------- Bottom action bar ---------- */
  .actions{position:sticky;bottom:0;z-index:15;margin-top:18px;padding:14px 0 calc(6px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,var(--bg) 70%,rgba(12,15,20,0));display:flex;gap:10px}
  .btn{flex:1;border-radius:12px;padding:15px;font-weight:700;font-size:15px;letter-spacing:-.01em;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,opacity .15s;
    border:1px solid var(--border)}
  .btn:active{transform:scale(.98)}
  .btn.gold{background:var(--gold);color:#1a1206;border-color:var(--gold)}
  .btn.ghost{background:var(--surface);color:var(--text)}
  .btn.ghost.icon{flex:0 0 auto;width:54px}
  .btn[disabled]{opacity:.4;pointer-events:none}
  .btn.wide{flex:1}

  /* ---------- Results ---------- */
  .score-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;
    padding:26px 20px;text-align:center;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .ring{width:150px;height:150px;margin:6px auto 4px;position:relative}
  .ring svg{transform:rotate(-90deg)}
  .ring .pct{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
  .ring .pct b{font-family:var(--mono);font-size:38px;font-weight:700;letter-spacing:-.03em;display:block}
  .ring .pct span{font-size:12px;color:var(--text-dim);font-family:var(--mono)}
  .verdict-line{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
  .verdict-sub{color:var(--text-dim);font-size:14px;margin-top:4px}
  .score-split{display:flex;gap:10px;margin-top:18px}
  .score-split .s{flex:1;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:12px;padding:12px}
  .score-split .s .n{font-family:var(--mono);font-size:20px;font-weight:700}
  .score-split .s.correct .n{color:var(--emerald)}
  .score-split .s.wrong .n{color:var(--rose)}
  .score-split .s .l{font-size:11px;color:var(--text-dim);margin-top:2px}

  .review-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%}
  .review-item .idx{font-family:var(--mono);font-size:13px;font-weight:700;width:30px;height:30px;flex:0 0 auto;
    border-radius:8px;display:grid;place-items:center}
  .review-item.ok .idx{background:var(--emerald-soft);color:var(--emerald);border:1px solid var(--emerald-line)}
  .review-item.no .idx{background:var(--rose-soft);color:var(--rose);border:1px solid var(--rose-line)}
  .review-item .rtext{flex:1;font-size:14px;line-height:1.45}
  .review-item .rmeta{font-family:var(--mono);font-size:11px;color:var(--text-faint);margin-top:5px}
  .review-item .rmeta b.ok{color:var(--emerald)} .review-item .rmeta b.no{color:var(--rose)}
  .review-item .chev{color:var(--text-faint);align-self:center}

  .empty{color:var(--text-dim);text-align:center;padding:40px 20px;font-size:15px}
  .fadein{animation:fade .35s ease}
  .footer-note{text-align:center;color:var(--text-faint);font-size:11px;font-family:var(--mono);
    margin:26px 0 6px;letter-spacing:.03em}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
  ::selection{background:var(--gold-soft)}
</style>
</head>

<div class="app" id="app"></div>

<script>
const QUESTIONS = [{"num":1,"id":"ICMA 0807.P2.059","topic":"The Financial Statements and the Balance Sheet","question":"All of the following accounts are classified as current liabilities except","intro":"","table":[],"tail":"","options":{"A":"accrued interest payable.","B":"current portions of long-term debt.","C":"accounts payable.","D":"right-of-use assets obtained under finance lease agreements."},"correct":"D","correctExplanation":"Right-of-use assets obtained under finance lease agreements are noncurrent assets, not liabilities.","explanations":{"A":"Accrued interest payable is classified as a current liability.","B":"Current portions of long-term debt are classified as current liabilities.","C":"Accounts payable are classified as current liabilities."},"studyUnit":"Study Unit 1: A.1. The Financial Statements, The Balance Sheet","pctCorrect":77},{"num":2,"id":"ICMA 10.P2.016","topic":"The Financial Statements and the Balance Sheet","question":"All of the following are limitations to the information provided on the statement of financial position except the","intro":"","table":[],"tail":"","options":{"A":"quality of the earnings reported for the enterprise.","B":"judgments and estimates used regarding the collectibility, salability, and longevity of assets.","C":"omission of items that are of financial value to the business such as the worth of the employees.","D":"lack of current valuation for most assets and liabilities."},"correct":"A","correctExplanation":"The statement of financial position, or balance sheet, does not report earnings for the enterprise at all. Earnings are reported on the income statement.","explanations":{"B":"Judgments and estimates are used in determining many of the items reported in the balance sheet. For example, estimates of the amount of receivables the company will collect are used to value the accounts receivable; the expected useful life of fixed assets is used to determine the amount of depreciation; and the company’s liability for future warranty claims is estimated by projecting the number and the cost of the future claims. Because these are estimates, they are by nature not precise.","C":"Many assets are not reported on the balance sheet, even though they do have value and will generate future cash flows. Examples of these include the company’s employees, or its human resources, its processes and procedures, and its competitive advantages.","D":"Values of certain assets are measured at historical cost, not fair (or market) value, replacement cost, or their value to the firm, for the balance sheet. For example, property, plant and equipment are reported on the balance sheet at their historical cost minus accumulated depreciation, although the assets’ value in use may be significantly greater."},"studyUnit":"Study Unit 1: A.1. The Financial Statements, The Balance Sheet","pctCorrect":62},{"num":3,"id":"HOCK MP2 AF15","topic":"The Financial Statements and the Balance Sheet","question":"The accounting concept or convention which, in times of rising prices, tends to understate asset values and overstate profits, is the","intro":"","table":[],"tail":"","options":{"A":"conservatism concept.","B":"going concern concept.","C":"historical cost convention.","D":"prudence concept."},"correct":"C","correctExplanation":"In a period of rising prices, the value of assets will be understated since the current value of the assets is more than was paid for them. Similarly, the selling prices of inventory items will go up but their inventory cost will remain the same while they are in inventory. Thus, cost of goods sold is unadjusted and so profits will be overstated.","explanations":{"A":"The conservatism concept means that when in doubt, choose the solution that will be least likely to overstate assets and income. The conservatism concept would not lead to understated asset values, though, and it certainly would not lead to overstated profits.","B":"The going concern concept says that a company's balance sheet must reflect the value of that company assuming it will remain in existence for, and beyond, the foreseeable future. That concept does not lead to understated asset values or overstated profits.","D":"The prudence concept in accounting is also known as the conservatism doctrine. It means that when in doubt, choose the solution that will be least likely to overstate assets and income. The prudence concept would not lead to understated asset values, though, and it certainly would not lead to overstated profits."},"studyUnit":"Study Unit 1: A.1. The Financial Statements, The Balance Sheet","pctCorrect":75},{"num":4,"id":"ICMA 1603.P1.046","topic":"The Financial Statements and the Balance Sheet","question":"Blue Fox Industries had the following account balances at year end. What is the amount of total current assets reported on the balance sheet?","intro":"Blue Fox Industries had the following account balances at year end.","table":[["Sales","$452,000"],["Cash","23,400"],["Accounts payable","14,300"],["Rent expense","3,700"],["Accounts receivable","9,400"],["Cost of goods sold","214,000"],["Land","104,000"],["Contract liability","6,800"],["Gain on sale","17,500"],["Equipment","28,800"],["Inventories","2,200"],["Notes payable","67,000"]],"tail":"What is the amount of total current assets reported on the balance sheet?","options":{"A":"$63,800.","B":"$39,900.","C":"$35,000.","D":"$59,300."},"correct":"C","correctExplanation":"Current assets include cash of $23,400, accounts receivable of $9,400, and inventories of $2,200, for total current assets of $35,000.","explanations":{"A":"This answer includes equipment in the calculation of current assets. Equipment is a long-term asset.","B":"This answer results from including accounts payable in current assets instead of accounts receivable. Accounts payable is a current liability.","D":"This answer results from including the gain on sale and the contract liability as current assets. The gain on sale is an income statement item. The contract liability is a liability."},"studyUnit":"Study Unit 1: A.1. The Financial Statements, The Balance Sheet","pctCorrect":87},{"num":5,"id":"ICMA 0807.P2.049","topic":"The Financial Statements and the Balance Sheet","question":"Each of the following are elements of financial statements, as defined in Statement of Financial Accounting Concepts No. 8, Conceptual Framework for Financial Reporting, Chapter 4, Elements of Financial Statements except","intro":"","table":[],"tail":"","options":{"A":"comprehensive income and its components.","B":"historical cost.","C":"assets and liabilities.","D":"investments by owners and distributions to owners."},"correct":"B","correctExplanation":"Historical cost is not an element of financial statements. Historical cost is one of the methods by which items reported in the financial statements are measured and valued. Elements of financial statements are the building blocks of the financial statements. Elements of financial statements are assets, liabilities, equity, comprehensive income and its components, investments by owners, and distributions to owners.","explanations":{"A":"Comprehensive income and its components, including revenues, expenses, gains, and losses, are elements of financial statements. Elements of financial statements are the building blocks of the financial statements. Elements of financial statements are assets, liabilities, equity, comprehensive income and its components, investments by owners, and distributions to owners.","C":"Assets and liabilities are elements of financial statements. Elements of financial statements are the building blocks of the financial statements. Elements of financial statements are assets, liabilities, equity, comprehensive income and its components, investments by owners, and distributions to owners.","D":"Investments by owners and distributions to owners are elements of financial statements. Elements of financial statements are the building blocks of the financial statements. Elements of financial statements are assets, liabilities, equity, comprehensive income and its components, investments by owners, and distributions to owners."},"studyUnit":"Study Unit 1: A.1. The Financial Statements, The Balance Sheet","pctCorrect":70},{"num":6,"id":"CMA 0689 P4 Q16","topic":"The Financial Statements and the Balance Sheet","question":"Trade accounts payable are valued on the statement of financial position at the","intro":"","table":[],"tail":"","options":{"A":"Historical cost.","B":"Current market value.","C":"Net settlement value.","D":"Current cost."},"correct":"C","correctExplanation":"Accounts payable are recorded on the balance sheet at the amount that will be needed to settle the liability. This is called the net settlement value.","explanations":{"A":"Historical cost is used to measure and value certain assets. Accounts payable are liabilities and so cannot be valued at historical cost on the balance sheet. Please see the correct answer explanation for more information.","B":"Accounts payable are not recorded at their current market value on the balance sheet. Please see the correct answer explanation for more information.","D":"Accounts payable are not recorded at their current cost on the balance sheet. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 1: A.1. The Financial Statements, The Balance Sheet","pctCorrect":43},{"num":7,"id":"ICMA 1603.P1.053","topic":"The Financial Statements and the Balance Sheet","question":"All of the following are limitations of the balance sheet except that","intro":"","table":[],"tail":"","options":{"A":"the balance sheet omits many items that cannot be recorded objectively but which have financial value to the company.","B":"assets and liabilities are usually recorded at historical cost, which might differ significantly from current fair value.","C":"the balance sheet provides information on the liquidity and solvency of the company.","D":"the balance sheet is prepared using management judgments and estimates."},"correct":"C","correctExplanation":"Providing information on the liquidity and solvency of the company is not a limitation of the balance sheet. It is a characteristic of the balance sheet. The balance sheet helps to assess the company’s liquidity, financial flexibility, solvency, and risk.","explanations":{"A":"This is a limitation of the balance sheet. Examples of items that cannot be recorded objectively on the balance sheet but which have financial value to the company include its human assets, that is, its employees; money it has spent on research and development efforts that must be expensed according to GAAP; and its customers.","B":"This is a limitation of the balance sheet.","D":"This is a limitation of the balance sheet. Examples of management judgments and estimates include the planned life of assets over which their cost is depreciated, estimated warranty expenses that are charged to expense as the sales are made, and estimated credit losses that are charged to expense as the sales are made."},"studyUnit":"Study Unit 1: A.1. The Financial Statements, The Balance Sheet","pctCorrect":70},{"num":8,"id":"HTB 1.1.003","topic":"The Financial Statements and the Balance Sheet","question":"A statement of financial position provides a basis for all of the following except","intro":"","table":[],"tail":"","options":{"A":"computing rates of return.","B":"determining profitability and assessing past performance for a specific period.","C":"assessing liquidity and financial flexibility.","D":"evaluating capital structure."},"correct":"B","correctExplanation":"A statement of financial position (balance sheet) cannot provide a basis for determining profitability and assessing past performance for a specific period. An income statement is required for that.","explanations":{"A":"A statement of financial position provides a basis for computing rates of return.","C":"A statement of financial position provides a basis for assessing liquidity and financial flexibility.","D":"A statement of financial position provides a basis for evaluating capital structure."},"studyUnit":"Study Unit 1: A.1. The Financial Statements, The Balance Sheet","pctCorrect":63},{"num":9,"id":"I22 1.01","topic":"The Financial Statements and the Balance Sheet","question":"The primary objective of financial statement reporting is to meet the needs of","intro":"","table":[],"tail":"","options":{"A":"supervisors and managers.","B":"staff and customers.","C":"investors and creditors.","D":"officers and auditors."},"correct":"C","correctExplanation":"The objective of financial reporting is to provide useful financial information about the entity for decision-making. Those using the financial information to make decisions include present and potential equity investors, lenders, and other creditors who need to make decisions about providing resources to the entity. The decisions relate to buying, selling, or holding debt or equity instruments and providing credit. The investors, lenders, and other creditors need information that will help them assess the amount of, timing of, and prospects for future net cash inflows to the entity to make their decisions. Other users who may or may not be providing capital to the firm—such as management, employees, financial analysts, and regulators—may find financial statements useful as well.","explanations":{"A":"The objective of financial reporting is to provide useful financial information about the entity for decision-making by present and potential equity investors, lenders, and other creditors who need to make decisions about providing resources to the entity. Supervisors and manageers may find the financial statements useful as well, but they are not the primary users for whom financial statements are prepared.","B":"The objective of financial reporting is to provide useful financial information about the entity for decision-making. Those using the financial information to make decisions include present and potential equity investors, lenders, and other creditors who need to make decisions about providing resources to the entity. Staff and customers may find the financial statements useful as well, but they are not the primary users for whom financial statements are prepared.","D":"The objective of financial reporting is to provide useful financial information about the entity for decision-making. Those using the financial information to make decisions include present and potential equity investors, lenders, and other creditors who need to make decisions about providing resources to the entity. Officers may find the financial statements useful as well, but they are not the primary users for whom financial statements are prepared. Auditors audit the financial statements prepared by manaagement, but the financial statements are not prepared to meet the needs of auditors."},"studyUnit":"Study Unit 1: A.1. The Financial Statements, The Balance Sheet","pctCorrect":91},{"num":10,"id":"HOCK MP2 AF16","topic":"The Financial Statements and the Balance Sheet","question":"In times of rising prices, what effect does the use of the historical cost concept have on a company's asset values and profit?","intro":"","table":[],"tail":"","options":{"A":"Asset values and profit will both be understated in the financial statements.","B":"Asset values will be understated and profit overstated in the financial statements.","C":"Asset values and profit will both be overstated in the financial statements.","D":"Asset values will be overstated and profit understated in the financial statements."},"correct":"B","correctExplanation":"In a period of rising prices, use of the historical cost concept will cause the value of fixed assets on the financial statements to be understated, since the current replacement cost of the assets will be greater than the amount that was paid for them in the past. The amount expensed currently for depreciation will be lower than it would be if those assets had been purchased currently at higher prices. The lower depreciation expense will cause operating income to be higher than it would be if the assets had been purchased at current prices, so operating income will be overstated when compared with what it would be if the assets had been purchased currently. Inventory will experience a similar effect. As long as items purchased earlier remain in inventory, when replacement prices increase, the value of the inventory will be understated. At the same time, cost of goods sold for each sale made will be the lower cost that was in effect when the inventory that was sold was purchased. How much difference that will make will depend on what cost flow assumption is being used and how rapidly the inventory is turning over. But the cost will be lower than the current replacement cost for the inventory, so cost of goods sold for each sale will be lower, gross profit will be higher, and operating income will be higher than they would be if replacement cost were used as the cost of goods sold for each sale. Thus, asset values will be understated and profit overstated in the financial statements.","explanations":{"A":"In a time of rising prices, asset values and profit will not both be understated in the financial statements. Please see the correct answer explanation for more information.","C":"In a time of rising prices, asset values and profit will not both be overstated in the financial statements. Please see the correct answer explanation for more information.","D":"In a time of rising prices, asset values will not be overstated and profit will not be understated in the financial statements. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 1: A.1. The Financial Statements, The Balance Sheet","pctCorrect":62},{"num":11,"id":"ICMA 10Q.2.007","topic":"The Financial Statements and the Balance Sheet","question":"An analyst uses the Statement of Financial Position as the primary source for all of the following except:","intro":"","table":[],"tail":"","options":{"A":"analyzing the potential cost of new financing.","B":"determining measures for controlling solvency.","C":"estimating the firm’s value as a going concern.","D":"identifying the firm’s capital structure."},"correct":"C","correctExplanation":"The statement of financial position is not appropriate for use in valuing a business as a going concern because assets and liabilities are not reported at their true values to the firm. For example: • Assets are reported at their historical costs, not the assets' market value, replacement cost, or value to the firm. • Many assets are not even reported in the statement of financial position. • Most liabilities are valued at the present value of cash flows discounted at the rate that was current when the liability was incurred, not at their present values discounted at the current market interest rate. So gains and losses in value from changes in market rates are not recognized in the statement of financial position.","explanations":{"A":"An analyst may use the statement of financial position as a primary source for analyzing the potential cost of new financing because the statement of financial position (balance sheet) can help to determine the company's financial strength and ability to repay a loan. If a company is financially strong, a lender will perceive less risk in lending to that company than to another, financially weaker, company, and the lender will charge a lower interest rate to the company that is stronger. For example: • An analyst would use the statement of financial position to compare the level of the company's liabilities to its level of equity, and the higher the equity in relation to the liabilities, the stronger the company and the greater loan repayment ability it has. • The ratio of the company's current assets to its current liabilities gives an indication of the company's liquidity. A higher ratio indicates a more liquid company and a greater ability to repay a loan.","B":"The statement of financial position can help to assess a company's solvency, so an analyst may use the statement of financial position as a primary source for determining measures for controlling solvency.","D":"An analyst may use the statement of financial position as a primary source for identifying the firm’s capital structure. \"Capital structure\" refers to the funding structure or the composition of a company’s long-term debt, common equity, and preferred stock, all of which are reported in the statement of financial position."},"studyUnit":"Study Unit 1: A.1. The Financial Statements, The Balance Sheet","pctCorrect":36},{"num":12,"id":"HOCK LR P2E 1","topic":"The Financial Statements and the Balance Sheet","question":"The balance sheet (or statement of financial position) helps users to assess the liquidity, financial flexibility, solvency and risk of a company. A company with financial flexibility has the ability to","intro":"","table":[],"tail":"","options":{"A":"meet its financial obligations as they come due.","B":"decide whether to settle a liability or write it off.","C":"choose the valuation methods it will use to report its assets.","D":"respond to unexpected needs and opportunities."},"correct":"D","correctExplanation":"Financial flexibility refers to the ability of a company to take actions that will alter the amounts and timing of its cash flows so that it is able to respond to unexpected needs and opportunities. For example, a company with a lot of debt is not financially flexible, because its available cash is committed to servicing its debt and it may have loan covenants that it must comply with. It will not have much spare cash available to finance an expansion or to meet an unexpected need, nor will it have the ability to borrow much more. A firm with a high degree of financial flexibility can better survive an economic downturn or other difficult setback, and it is in a better position to take advantage of profitable and unexpected investment opportunities. Moreover, a company with greater financial flexibility has a lower risk of failure.","explanations":{"A":"While it is important for a company to be able to meet its financial obligations as they come due, this is not what financial flexibility means.","B":"When a company has a liability, it does not have the ability to decide whether or not to settle that liability. It has a legal obligation to settle the liability by paying it or by satisfying the performance obligation represented by the liability, unless the company is relieved of that obligation by a bankruptcy judge.","C":"To a degree, all companies can choose the valuation methods they will use to report certain assets. For example, a company has a choice of inventory cost flow assumptions (FIFO, average cost, etc.), and its choice will affect the value of the inventory on its balance sheet. However, this flexibility applies to only certain assets and only as permitted under generally accepted accounting principles; and this is not what financial flexibility means."},"studyUnit":"Study Unit 1: A.1. The Financial Statements, The Balance Sheet","pctCorrect":64},{"num":13,"id":"HOCK MP2 AF14","topic":"The Financial Statements and the Balance Sheet","question":"The historical cost convention","intro":"","table":[],"tail":"","options":{"A":"has been replaced in accounting records by a system of current cost accounting.","B":"records only past transactions.","C":"fails to take into account changing price levels over time.","D":"values all assets at their cost to the business, without any adjustment for depreciation."},"correct":"C","correctExplanation":"\"Historical cost\" is the amount of cash, or its equivalent, that is paid to acquire an asset. It is generally used for property, plant and equipment, as well as most inventories. Historical cost may be adjusted after the acquisition for amortization or other allocations without changing the fact that historical cost is being used, because depreciation and amortization are methods of allocating the initial cost to the periods that will benefit from it. However, changes in fair value such as in market prices over time are not reflected in the carrying amount of an asset accounted for using historical cost.","explanations":{"A":"US GAAP is fundamentally a historical cost system of accounting, meaning that items are recorded in the books initially at their cost and then written down only over time. Items reported in financial statements are based on historical cost, fair value, current (replacement) cost, net realizable value, and present value of expected cash flows.","B":"\"Historical cost\" is the amount of cash, or its equivalent, that is paid to acquire an asset. It is generally used for property, plant and equipment, as well as most inventories. Historical cost may be adjusted after the acquisition for amortization or other allocations without changing the fact that historical cost is being used, because depreciation and amortization are methods of allocating the initial cost to the periods that will benefit from it. Therefore, historical cost can involve current transactions as well as past transactions.","D":"\"Historical cost\" is the amount of cash, or its equivalent, that is paid to acquire an asset. It is generally used for property, plant and equipment, as well as most inventories. Historical cost may be adjusted after the acquisition for amortization or other allocations without changing the fact that historical cost is being used, because depreciation and amortization are methods of allocating the initial cost to the periods that will benefit from it."},"studyUnit":"Study Unit 1: A.1. The Financial Statements, The Balance Sheet","pctCorrect":54},{"num":14,"id":"CMA 1284 P4 Q7","topic":"The Financial Statements and the Balance Sheet","question":"Sanns, Inc. always charges prepaid insurance when it purchases or renews insurance policies. It adjusts the accounts for insurance used once per year, as of December 31. Thus, the 3-year renewal premium for a policy that expired on July 31 of the current year was charged to prepaid insurance. The 3-year renewal policy cost $63,000, up $27,000 from the $36,000 it had cost 3 years earlier. The adjusting entry necessary to reflect the insurance accounts at December 31 of the current year, Sanns' fiscal year-end, would be to","intro":"","table":[],"tail":"","options":{"A":"Debit insurance expense for $54,250 and credit prepaid insurance for $54,250.","B":"Debit prepaid insurance for $8,750 and credit insurance expense for $8,750.","C":"Debit prepaid insurance for $15,750 and credit insurance expense for $15,750.","D":"Debit insurance expense for $15,750 and credit prepaid insurance for $15,750."},"correct":"D","correctExplanation":"There are two ways of arriving at the correct adjusting amounts. One is to calculate the total expense for insurance \"used\" during the year. The other way is to calculate what the balance in the Prepaid Insurance account actually is before the December 31 adjusting entries, determine what the balance should be at year end, and then calculate the adjustment needed to bring the balance to what it should be. The total expense for the year consists of 7 months at ($36,000 ÷ 36) plus 5 months at ($63,000 ÷ 36), or (7 × $1,000) + (5 × $1,750), which equals $15,750. That amount is debited to Insurance Expense and credited to Prepaid Insurance. To calculate the amount the second way, first calculate what the balance in the Prepaid Insurance account was before the December 31 adjusting entries. The year-end balance in the Prepaid Insurance account before adjustments would be the previous year's year-end balance of $1,000 per month × 7 months remaining on the policy at year-end, plus the $63,000 that would have been debited to the account when the new policy was purchased, or $70,000. The year-end balance should be $1,750 per month expense under the new policy × 31 months remaining at year end, or $54,250. To adjust the balance in the Prepaid Insurance account from $70,000 to $54,250, a credit of $15,750 is necessary. The balancing entry is a debit to Insurance Expense.","explanations":{"A":"The year-end balance in the Prepaid Insurance account should be $54,250 ($1,750 monthly expense under the new insurance policy × 31 months remaining on the new insurance policy at year end). However, the entry to bring the balance in the Prepaid Insurance account to $54,250 is not a $54,250 credit.","B":"The monthly expense under the new insurance policy is $1,750 ($63,000 ÷ 36 months), so expense for the 5 months from August 1 to December 31 would be $8,750. However, Prepaid Insurance should be credited, not debited; and Insurance Expense should be debited, not credited. Furthermore, that is not the only item to be included in the year- end adjusting entry.","C":"Prepaid Insurance should be credited, not debited; and Insurance Expense should be debited, not credited."},"studyUnit":"Study Unit 1: A.1. The Financial Statements, The Balance Sheet","pctCorrect":40},{"num":15,"id":"ICMA 11.P1.001","topic":"The Financial Statements and the Balance Sheet","question":"The financial statements included in the annual report to the shareholders are least useful to which one of the following?","intro":"","table":[],"tail":"","options":{"A":"Stock analysts.","B":"Suppliers deciding whether to approve credit.","C":"Bankers considering loan requests.","D":"Managers in charge of operating activities."},"correct":"D","correctExplanation":"The annual report to shareholders is prepared in accordance with generally accepted accounting principles and is designed to provide information that is pertinent to investors and other external users. The annual report may be used by managers internally as well, but managers typically need more detail about internal operations that can only be accessed in internal reports designed to provide information about various aspects of internal functions that measure the effectiveness and efficiency of operations.","explanations":{"A":"Users of financial information include those who need to make decisions about buying, selling, or holding debt or equity instruments and providing credit and those who advise them. Stock analysts advise those who make those decisions, so they need information to assist in assessing expectations about returns—such as dividends, principal payments, interest payments, or market price increases—and the amount, timing, and prospects for future net cash inflows to the company.","B":"Users of financial information include those who need to make decisions about buying, selling, or holding debt or equity instruments and providing credit. Suppliers deciding whether to extend credit to a customer need information to assist in assessing expectations about the amount, timing, and prospects for future net cash inflows to the company, because those will be needed to pay the amounts due for purchases.","C":"Users of financial information include those who need to make decisions about buying, selling, or holding debt or equity instruments and providing credit. Bankers considering loan requests need information to assist in assessing expectations about the amount, timing, and prospects for future net cash inflows to the company, because those will be needed to repay the loan."},"studyUnit":"Study Unit 1: A.1. The Financial Statements, The Balance Sheet","pctCorrect":66},{"num":16,"id":"ICMA 14.P2.040","topic":"The Financial Statements and the Balance Sheet","question":"Brown Systems began operating January 1 and spent $900,000 in the first month of operations on the following items. The total cash expenditures that should be capitalized as property, plant, and equipment is","intro":"Brown Systems began operating January 1 and spent $900,000 in the first month of operations on the following items. The total cash expenditures that should be capitalized as property, plant, and equipment is","table":[["January advertising campaign","$40,000"],["Computer equipment","280,000"],["12-month insurance policy","120,000"],["January building rent","60,000"],["January salaries","340,000"],["Office supplies","10,000"],["Automobile","30,000"],["January utilities","20,000"],["Total","$900,000"]],"tail":"","options":{"A":"$80,000.","B":"$310,000.","C":"$440,000.","D":"$370,000."},"correct":"B","correctExplanation":"The computer equipment ($280,000) and the automobile ($30,000) are expenditures that should be capitalized as property, plant, and equipment, for a total of $310,000.","explanations":{"A":"This answer results from including in the expenditures to be capitalized as property, plant, and equipment the advertising campaign ($40,000), the office supplies ($10,000) and the automobile ($30,000). The automobile should be capitalized as property, plant, and equipment, but not the advertising campaign nor the office supplies; and the automobile is not the only expenditure that should be capitalized as property, plant, and equipment. Please see the correct answer explanation for more information.","C":"This answer results from including in the expenditures to be capitalized as property, plant, and equipment the advertising campaign ($40,000), the computer equipment ($280,000), the January building rent ($60,000), the office supplies ($10,000), the automobile ($30,000), and the January utilities. The advertising campaign, the January building rent, the office supplies, and the January utilities are not capitalizable as property, plant, and equipment. Please see the correct answer explanation for more information.","D":"This answer results from including in the expenditures to be capitalized as property, plant, and equipment the computer equipment ($280,000), the automobile ($30,000), and the January building rent ($60,000). The January building rent is not capitalizable as property, plant, and equipment, although it would properly be debited to a prepaid expenses account on the balance sheet and expensed at the end of the month. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 1: A.1. The Financial Statements, The Balance Sheet","pctCorrect":67},{"num":17,"id":"ICMA 18.P1.012","topic":"The Financial Statements and the Balance Sheet","question":"Which one of the following would not be classified as a current liability?","intro":"","table":[],"tail":"","options":{"A":"Ten-year bonds sold 110 months ago.","B":"Undistributed stock dividends.","C":"A security deposit received from a renter for a one-year lease.","D":"Rent for the current year received on January 2 of the current year."},"correct":"B","correctExplanation":"Undistributed stock dividends do not create any liability, current or non-current. A stock dividend by a corporation is a distribution of additional shares of stock to qualifying existing stockholders, and all the transactions to record it take place in the equity section of the balance sheet. If the stock dividend is a large stock dividend (usually more than 20-25% of the total shares outstanding), on the declaration date a debit transaction for the par value of the new shares is recorded to Retained Earnings and the opposing credit transaction is to Common Shares Issuable as a Dividend, another equity account. If the stock dividend is a small stock dividend (usually less than 20-25% of the total shares outstanding), the stock dividend is valued at the fair value of the shares on their date of declaration. The fair value of the new shares is debited to Retained Earnings, the par value of the new shares is credited to Common Shares Issuable as a Dividend, and the difference is credited to Additional Paid-in Capital, all equity accounts.","explanations":{"A":"Ten-year bonds sold 110 months ago will have less than one year to maturity (110 months is equal to 9.17 years), so the bonds are a current liability for the issuer.","C":"A security deposit received from a renter for a one-year lease is a current liability.","D":"Rent for the current year received on January 2 of the current year is a current liability."},"studyUnit":"Study Unit 1: A.1. The Financial Statements, The Balance Sheet","pctCorrect":40},{"num":18,"id":"CIA 0595 P4 Q8","topic":"The Financial Statements and the Balance Sheet","question":"Suppose that a company pays one of its liabilities twice during the year, in error. What are the effects of this mistake?","intro":"","table":[],"tail":"","options":{"A":"Assets and liabilities will be understated.","B":"Assets, net income, and owners' equity will be unaffected.","C":"Assets and net income and owners' equity will be understated, and liabilities are overstated.","D":"Assets, liabilities, and owners' equity will be understated."},"correct":"A","correctExplanation":"The journal entry to record this event is a debit to a liability and a credit to cash. If this entry is made a second time the liabilities and cash will be understated, but there will be no impact on income or owners' equity.","explanations":{"B":"Net income and owners' equity will be unaffected by this error, but assets will be affected. Please see the correct answer explanation for more information.","C":"Liabilities will be understated and net income and owners' equity will not be affected by this error. Please see the correct answer explanation for more information.","D":"Assets and liabilities will be understated, but owners' equity will not be affected by this error. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 1: A.1. The Financial Statements, The Balance Sheet","pctCorrect":42},{"num":19,"id":"CMA1 M2 Q1001","topic":"The Financial Statements and the Balance Sheet","question":"Another way to write the accounting equation for changes in equity from one period to the next is:","intro":"","table":[],"tail":"","options":{"A":"Closing Assets – Closing Liabilities – Dividends = Opening Equity + Profit","B":"Closing Assets – Closing Liabilities – Opening Equity + Dividends = Profit","C":"Closing Assets – Profit – Dividends = Closing Equity – Closing Liabilities","D":"Closing Assets + Profit – Dividends – Closing Liabilities = Closing Equity"},"correct":"B","correctExplanation":"The basic accounting equation is: Closing Assets – Closing Liabilities = Closing Equity. Equity is increased by profit and decreased by dividends declared, so Closing Equity consists of Opening Equity + Profit – Dividends. Therefore, Closing Assets – Closing Liabilities = Opening Equity + Profit – Dividends. To solve for Profit: Subtract Opening Equity from both sides of the equation: Closing Assets – Closing Liabilities − Opening Equity = Profit – Dividends Add Dividends to both sides of the equation: Closing Assets – Closing Liabilities – Opening Equity + Dividends = Profit Example: End of End of Year 1 Year 2 Total assets $100,000 $117,000 Total liabilities 25,000 25,000 Total equity 75,000 92,000 Dividends declared during Year 2 were $3,000. What was the company's profit during Year 2? Using the formula above: Closing Assets $117,000 − Closing Liabilities $25,000 − Opening Equity $75,000 + Dividends $3,000 = Profit $20,000 Proof: Opening Equity $75,000 − Dividends $3,000 + Profit $20,000 = Closing Equity $92,000","explanations":{"A":"This is not another way to write the accounting equation for changes in equity from one period to the next. Please see the correct answer explanation for more information.","C":"This is not another way to write the accounting equation for changes in equity from one period to the next. Please see the correct answer explanation for more information.","D":"This is not another way to write the accounting equation for changes in equity from one period to the next. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 1: A.1. The Financial Statements, The Balance Sheet","pctCorrect":33},{"num":20,"id":"ICMA 0807.P2.048","topic":"The Financial Statements and the Balance Sheet","question":"Financial accounting provides information that can be used for all of the following except","intro":"","table":[],"tail":"","options":{"A":"assessing expectations about returns.","B":"predicting future stock performance.","C":"assessing future cash flows.","D":"making decisions on providing credit."},"correct":"B","correctExplanation":"The objective of external financial reporting is not to provide information that can be used for predicting future stock performance. Users of financial information include existing and potential investors, lenders, and other creditors; and the decisions they are making relate to buying, selling, or holding debt or equity instruments and providing credit. Users need information to help them assess their expectations about returns— such as dividends, principal payments, interest payments, or market price increases— and the amount, timing, and uncertainty of (that is, prospects for) future net cash inflows to the company.","explanations":{"A":"Financial accounting provides information that can be used for assessing expectations about returns. Users of financial information include existing and potential investors, lenders, and other creditors; and the decisions they are making relate to buying, selling, or holding debt or equity instruments and providing credit. Users need information to help them assess their expectations about returns—such as dividends, principal payments, interest payments, or market price increases—and the amount, timing, and uncertainty of (that is, prospects for) future net cash inflows to the company.","C":"Financial accounting provides information that can be used for assessing future cash flows. Users of financial information include existing and potential investors, lenders, and other creditors; and the decisions they are making relate to buying, selling, or holding debt or equity instruments and providing credit. Users need information to help them assess their expectations about returns—such as dividends, principal payments, interest payments, or market price increases—and the amount, timing, and uncertainty of (that is, prospects for) future net cash inflows to the company.","D":"Financial accounting provides information that can be used for making decisions on providing credit. Users of financial information include existing and potential investors, lenders, and other creditors; and the decisions they are making relate to buying, selling, or holding debt or equity instruments and providing credit. Users need information to help them assess their expectations about returns—such as dividends, principal payments, interest payments, or market price increases—and the amount, timing, and uncertainty of (that is, prospects for) future net cash inflows to the company."},"studyUnit":"Study Unit 1: A.1. The Financial Statements, The Balance Sheet","pctCorrect":64},{"num":21,"id":"HCH CMA P1.A.1.02001","topic":"Income Statement","question":"Which of the following statements about reporting discontinued operations in financial statements is correct?","intro":"","table":[],"tail":"","options":{"A":"A company should reclassify prior period income from continuing operations to reflect the impact of discontinued operations only in the year the disposal occurs.","B":"Discontinued operations must be reported separately on the income statement, but their related tax effects should be combined with taxes on continuing operations.","C":"A discontinued operation’s results should be reported on the income statement net of tax. Gain or loss from operations and gain or loss from the disposal should be combined on one line.","D":"Only the gain or loss from the disposal of a discontinued operation needs to be reported separately on the income statement; operational results from the discontinued component do not require separate reporting."},"correct":"C","correctExplanation":"Discontinued operations are required to be reported on the income statement net of tax. The gain or loss from operations of the discontinued component and the gain or loss from the disposal of the component are combined and reported gross on a single line in the period in which the gains or losses occurred. The related income tax effect is reported on the next line, followed by the net income or loss on discontinued operations. This ensures clear and distinct reporting of discontinued operations, separate from continuing operations, as stipulated in ASC 205-20.","explanations":{"A":"Net income or loss on operations subsequently classified as discontinued that was reported as income from continuing operations in prior periods must be reclassified as discontinued operations in all periods presented for comparison, not just in the year the operation is first reported as discontinued, to ensure that the financial statements are comparable across periods.","B":"Although it is true that discontinued operations must be reported separately, their related tax effects should not be combined with taxes on continuing operations. Instead, income taxes must be allocated on the income statement between income from continuing operations and income from discontinued operations so that the income from discontinued operations can be reported net of related tax.","D":"Both the operational results and the gain or loss from the disposal of a discontinued operation must be reported on the income statement separately from income from continuing operations. Reporting only the disposal gain or loss would not provide a complete picture of the impact of the discontinued operation on the company's financial performance."},"studyUnit":"Study Unit 2: A.1. Comprehensive Income and the Income Statement covers the","pctCorrect":44},{"num":22,"id":"CMA 1293 P2 Q9","topic":"Income Statement","question":"Nichols Corporation renewed an insurance policy for three years beginning September 1, Year 1, and recorded the $81,000 premium in the Prepaid Insurance account. The $81,000 premium represents an increase of $23,400 from the $57,600 premium charged three years ago. Assuming Nichols only records its insurance adjustments at the end of the calendar year, the adjusting entry required to reflect the proper balances in the insurance accounts at December 31, Year 1, Nichols' year end, would be to","intro":"","table":[],"tail":"","options":{"A":"Debit Prepaid Insurance for $9,000 and credit Insurance Expense for $9,000.","B":"Debit Insurance Expense for $21,800 and credit Prepaid Insurance for $21,800.","C":"Debit Insurance Expense for $72,000 and credit Prepaid Insurance for $72,000.","D":"Debit Insurance Expense for $9,000 and credit Prepaid Insurance for $9,000."},"correct":"B","correctExplanation":"There are two ways of arriving at the correct adjusting amounts. One is to calculate the total expense for the year. The other is to calculate what the balance in the Prepaid Insurance account actually is before adjusting entries, determine what the balance should be at year end, and then calculate the adjustment needed to bring the balance to what it should be. The total expense for the year consists of 8 months at ($57,600 ÷ 36) plus 4 months at ($81,000 ÷ 36), or (8 × $1,600) + (4 × $2,250), which equals $21,800. That amount is debited to Insurance Expense and credited to Prepaid Insurance. To calculate the amount the second way, first calculate what the balance in the Prepaid Insurance account was before the adjusting entries. Since adjustments are done only once a year, the year-end balance in the Prepaid Insurance account before adjustments would be the Year 0 year-end balance of $1,600 per month × 8 months remaining on the policy at year-end Year 0, plus the $81,000 that would have been debited to the account when the new policy was purchased, or $93,800. The year-end balance should be $2,250 per month expense under the new policy × 32 months remaining at year end, or $72,000. To adjust the balance in the Prepaid Insurance account from $93,800 to $72,000, a credit of $21,800 is necessary. The balancing entry is a debit to Insurance Expense.","explanations":{"A":"The monthly expense under the new insurance policy is $2,250 ($81,000 ÷ 36 months), so expense for the 4 months from September 1 to December 31 would be $9,000. However, that is not the only item to be included in the year-end adjusting entry. Furthermore, debiting Prepaid Insurance and crediting Insurance Expense would not be appropriate. Prepaid expense should be debited to an expense account as it is used up, not credited.","C":"The year-end balance in the Prepaid Insurance account should be $72,000 ($2,250 monthly expense under the new insurance policy × 32 months remaining on the new insurance policy at year end). However, the entry to bring the balance in the Prepaid Insurance account to $72,000 is not a $72,000 credit.","D":"The monthly expense under the new insurance policy is $2,250 ($81,000 ÷ 36 months), so expense for the 4 months from September 1 to December 31 would be $9,000. However, that is not the only item to be included in the year-end adjusting entry."},"studyUnit":"Study Unit 2: A.1. Comprehensive Income and the Income Statement covers the","pctCorrect":50},{"num":23,"id":"ICMA 18.P1.029","topic":"Income Statement","question":"A company received an invoice in January for the electricity used by its warehouse in December, and it recorded the expense in January. The company uses the accrual basis of accounting. What is the impact to the company’s December financial statements?","intro":"","table":[],"tail":"","options":{"A":"Current liabilities were understated and retained earnings were overstated.","B":"Accrued expenses were overstated and retained earnings were understated.","C":"Cash and cash equivalents were overstated and retained earnings were understated.","D":"Operating expenses were overstated and retained earnings were overstated."},"correct":"A","correctExplanation":"The expense for the electricity used by the warehouse in December, a period cost, should have been recognized and accrued as a December expense because that is when it was incurred. Because it was not, current liabilities (accounts payable) were understated as of December 31. Because the expense was not recognized in December, net income was overstated and retained earnings were thus also overstated.","explanations":{"B":"The expense for the electricity used by the warehouse in December, a period cost, should have been recognized and accrued as a December expense when it was incurred. Failing to recognize the expense in December would not have caused accrued expenses to be overstated (rather, they were understated), nor would it have caused retained earnings to be understated (rather, they were overstated). Please see the correct answer explanation for more information.","C":"The expense for the electricity used by the warehouse in December, a period cost, should have been recognized and accrued as a December expense when it was incurred. The payment for the electricity was not made in December, so cash and cash equivalents as of the end of December were stated correctly and were not overstated. Failing to recognize the expense in December would not have caused retained earnings to be understated (rather, they were overstated). Please see the correct answer explanation for more information.","D":"The expense for the electricity used by the warehouse in December, a period cost, should have been recognized and accrued as a December expense when it was incurred. Failing to recognize the expense in December would not have caused operating expenses to be overstated (rather, they were understated). Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 2: A.1. Comprehensive Income and the Income Statement covers the","pctCorrect":55},{"num":24,"id":"ICMA 1603.P1.067","topic":"Income Statement","question":"A company uses the calendar year as its financial results reporting time period. On May 31 of the prior year, the company committed to a plan to sell a line of business. The sale represents a strategic shift that will have a major effect on the company's operations and financial results. For the period January 1 through May 31 of the prior year, the line of business had revenues of $1,000,000 and expenses of $1,600,000. The assets of the line of business were sold on November 30, at a loss for which no tax benefit is available. In its income statement for the year ended December 31 of the prior year, how should the company report the line of business operations from January 1 through May 31?","intro":"","table":[],"tail":"","options":{"A":"$600,000 should be reported as part of the loss on disposal of a component.","B":"$1,000,000 and $1,600,000 should be included with revenues and expenses, respectively, as part of continuing operations.","C":"$600,000 should be reported as an unusual or infrequent loss.","D":"$600,000 should be included in the determination of income or loss from operations of a discontinued component."},"correct":"D","correctExplanation":"The sale of the line of business represents a strategic shift that will have a major effect on the company's operations and financial results. Therefore, it qualifies for financial reporting as a discontinued operation. Operating results of a discontinued component or group of components must be reported on the income statement as discontinued operations in the period when management commits to a plan to sell the entity; the entity to be sold is available for immediate sale; an active program to locate a buyer or buyers and other actions required to complete the plan to sell the entity have been initiated; the sale is probable within one year, unless events beyond the entity’s control occur; the entity is being actively marketed at a reasonable price in relation to its fair value; or actions required to complete the plan to sell the entity make it unlikely that the plan will be withdrawn or significantly changed. The period from January 1 through May 31 is in the period in which the criteria were met. Therefore, the operating results of the discontinued component must be reported net of tax in the discontinued operations section of the income statement. The gain or loss from the actual disposal of the entity, which did not take place until November 30, should be reported on the December 31 income statement along with the related results of operations of the discontinued component in the discontinued operations section of the income statement. Therefore, for the period January 1 through May 31, a $600,000 loss (revenues of $1,000,000 less expenses of $1,600,000) should be included in the determination of income or loss from operations of a discontinued component.","explanations":{"A":"The gain or loss from the actual disposal of the entity did not take place until November 30, and it should be reported along with the related results of operations of the discontinued component in the discontinued operations section of the income statement for the year ended December 31. However, for the period January 1 through May 31, a $600,000 loss should not be reported as part of the loss on disposal of a component, since the disposal did not take place until November 30 of that year.","B":"Operating results of a discontinued component or group of components must be reported net of associated taxes as discontinued operations on the income statement. ASC 205-20-45-1E requires the held-for-sale classification in the period in which all of the following criteria are met: • Management commits to a plan to sell the entity. • The entity to be sold is available for immediate sale. • An active program to locate a buyers or buyers and other actions required to complete the plan to sell the entity have been initiated. • The sale is probable within one year, unless events beyond the entity’s control occur. • The entity is being actively marketed at a reasonable price in relation to its fair value. • Actions required to complete the plan to sell the entity make it unlikely that the plan will be withdrawn or significantly changed. Since the period from January 1 through May 31 is in the period in which the criteria were met, the operating results of the discontinued component must be reported net of tax in the discontinued operations section of the income statement.","C":"Operating results of a discontinued component or group of components must be reported net of associated taxes on the income statement as discontinued operations, not as an unusual or infrequent loss. An unusual or infrequent loss is reported as part of income from continuing operations."},"studyUnit":"Study Unit 2: A.1. Comprehensive Income and the Income Statement covers the","pctCorrect":55},{"num":25,"id":"ICMA 10.P2.019","topic":"Income Statement","question":"When a fixed asset is sold for less than book value, which one of the following will decrease?","intro":"","table":[],"tail":"","options":{"A":"Total current assets.","B":"Net profit.","C":"Current ratio.","D":"Net working capital."},"correct":"B","correctExplanation":"When a fixed asset is sold for less than book value, the company will have a loss. The loss will be reported on the income statement and will decrease net profit for the period.","explanations":{"A":"The sale of a fixed asset for cash will cause current assets to increase, not decrease.","C":"The current ratio is total current assets divided by total current liabilities. The sale of a fixed asset for cash will cause current assets to increase and thus the current ratio to increase, not decrease.","D":"Net working capital is total current assets minus total current liabilities. The sale of a fixed asset for cash will cause current assets to increase and thus net working capital to increase, not decrease."},"studyUnit":"Study Unit 2: A.1. Comprehensive Income and the Income Statement covers the","pctCorrect":74},{"num":26,"id":"CIA 1192 P4 Q37","topic":"Income Statement","question":"Because of inexact estimates of the service life and the residual value of a plant asset, a fully depreciated asset was sold in the current year at a material gain. This gain should be reported:","intro":"","table":[],"tail":"","options":{"A":"As part of sales revenue on the current year income statement.","B":"In the income from continuing operations section of the current year income statement.","C":"As an adjustment to prior periods' depreciation on the statement of retained earnings.","D":"As an unusual or infrequent event in the unusual and infrequent events section of the current year income statement."},"correct":"B","correctExplanation":"The gain on the sale of an asset is reported in the income statement in the section of continuing operations in the year in which it is sold.","explanations":{"A":"The sale of a fixed asset is not recorded as revenue in the financial statements.","C":"The sale of a fixed asset is not recorded as an adjustment to prior periods' depreciation in the financial statements.","D":"The sale of a fixed asset is not recorded as an unusual or infrequent event in the financial statements, and unusual or infrequent events are not reported in a separate section of the income statement. Unusual or infrequent events are reported as separate line items within the income from continuing operations section of the income statement or, alternatively, included in some other line of the income from continuing operations section and disclosed in the notes to financial statements."},"studyUnit":"Study Unit 2: A.1. Comprehensive Income and the Income Statement covers the","pctCorrect":48},{"num":27,"id":"ICMA 10.P2.009","topic":"Income Statement","question":"All of the following are components of comprehensive income except","intro":"","table":[],"tail":"","options":{"A":"revenue.","B":"expenses.","C":"shareholders' equity.","D":"gains and losses."},"correct":"C","correctExplanation":"This question is asking for the answer choice that is not a component of comprehensive income. Shareholders' equity is not a component of comprehensive income. Components of comprehensive income are revenues, expenses, gains, and losses. Shareholders’ equity is presented on the statement of financial position (balance sheet).","explanations":{"A":"This question is asking for the answer choice that is not a component of comprehensive income. Revenue is a component of comprehensive income. Components of comprehensive income are revenues, expenses, gains, and losses.","B":"This question is asking for the answer choice that is not a component of comprehensive income. Expenses are a component of comprehensive income. Components of comprehensive income are revenues, expenses, gains, and losses.","D":"This question is asking for the answer choice that is not a component of comprehensive income. Gains and losses are components of comprehensive income. Components of comprehensive income are revenues, expenses, gains, and losses."},"studyUnit":"Study Unit 2: A.1. Comprehensive Income and the Income Statement covers the","pctCorrect":93},{"num":28,"id":"HOCK MP2 AF11","topic":"Income Statement","question":"According to the FASB conceptual framework, revenue may result from","intro":"","table":[],"tail":"","options":{"A":"An increase in an asset from an incidental transaction.","B":"An increase in a liability from an incidental transaction.","C":"A decrease in a liability from delivering to a customer an item sold.","D":"A decrease in an asset resulting from delivering to a customer an item sold."},"correct":"C","correctExplanation":"According to the FASB’s Statement of Financial Accounting Concepts No. 8, Conceptual Framework for Financial Reporting, Chapter 4, Elements of Financial Statements, revenues are inflows or other enhancements of assets or settlements of liabilities (or a combination of both) that result from delivering or producing goods, rendering services, or other activities. “Other activities” are things like permitting others to use the company’s resources, resulting in interest, rent, royalties, and fees. For a charitable organization, “other activities” includes contributions received. If a customer pays a deposit in advance of receiving the goods or services contracted for, the amount received is debited to cash and credited to a current liability account such as deposits or contract liabilities, because the company has an obligation to provide the goods or services represented by that deposit. The company cannot recognize the revenue until that obligation has been fulfilled and the customer has received the goods or services paid for. When the goods or services are provided to the customer and the customer obtains control of them, the company can recognize the revenue. At that time, the company will debit the liability account for the amount of the deposit and credit revenue. Thus, the decrease in the liability will result in recognizing revenue.","explanations":{"A":"According to the FASB’s Statement of Financial Accounting Concepts No. 8, Conceptual Framework for Financial Reporting, Chapter 4, Elements of Financial Statements, revenues are inflows or other enhancements of assets or settlements of liabilities (or a combination of both) that result from delivering or producing goods, rendering services, or other activities. “Other activities” are things like permitting others to use the company’s resources, resulting in interest, rent, royalties, and fees. For a charitable organization, “other activities” includes contributions received. Therefore, an increase in an asset that results from incidental transactions is not revenue according to the definition of revenue in Statement of Financial Accounting Concepts No. 8. An example of an increase in an asset from an incidental transaction is the sale of some land sold at a gain, if the seller is not in the business of selling land. The receipt of cash for the sale would increase the asset \"cash\" by the amount received. Removing the land from the accounting records would involve decreasing the fixed asset, \"land,\" by the book value of the land, which would be less than the cash received for it because the land was sold at a gain. The difference would be the gain. The result of recording the transaction would be a net increase in assets. Since according to Concepts Statement No. 8, revenue results from delivering or producing goods, rendering services, or other activities, and the company is not in the business of selling land, the gain from the sale of the land would be recognized as a gain but it would not be considered revenue.","B":"According to the FASB’s Statement of Financial Accounting Concepts No. 8, Conceptual Framework for Financial Reporting, Chapter 4, Elements of Financial Statements, revenues are inflows or other enhancements of assets or settlements of liabilities (or a combination of both) that result from delivering or producing goods, rendering services, or other activities. “Other activities” are things like permitting others to use the company’s resources, resulting in interest, rent, royalties, and fees. For a charitable organization, “other activities” includes contributions received. An example of an increase in a liability from an incidental transaction is a cash deposit received in advance of the sale of a vehicle that was used in the business, to \"hold\" the vehicle and not sell it to someone else. The deposit is recorded by debiting cash and crediting a liability account. The deposit received does represents a liability to the seller until the transfer of title to the vehicle takes place; but when the sale is finalized and the title is transferred, the deposit along with the rest of the payment from the buyer, minus the book value of the vehicle, is recorded as a gain or a loss. Even if the seller has a gain on the sale, it would not be considered revenue even then, because it
