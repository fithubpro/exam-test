700 − $22,400 − $18,400 + X = $304,000 X = $49,100","explanations":{"B":"The beginning balance of net fixed assets minus the current year's depreciation recorded minus the net book value of the equipment sold plus the cost of the equipment purchased equals the ending balance of net fixed assets. The cost of the equipment purchased is the unknown. This answer results from adding the current year depreciation instead of subtracting it. Please see the correct answer explanation for more information.","C":"The beginning balance of net fixed assets minus the current year's depreciation recorded minus the net book value of the equipment sold plus the cost of the equipment purchased equals the ending balance of net fixed assets. The cost of the equipment purchased is the unknown. This answer results from subtracting the sale price of the equipment sold instead of subtracting the net book value of the equipment sold. Please see the correct answer explanation for more information.","D":"The beginning balance of net fixed assets minus the current year's depreciation recorded minus the net book value of the equipment sold plus the cost of the equipment purchased equals the ending balance of net fixed assets. The cost of the equipment purchased is the unknown. This answer results from subtracting the gain on the sale of equipment instead of subtracting the net book value of the equipment sold. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 7: A.1. Investing and Financing Activities, SCF Disclosures covers the","pctCorrect":48},{"num":119,"id":"ICMA 10.P2.097","topic":"Investing and Financing Activities, SCF Disclosures","question":"Selected financial information for Kristina Company for the year just ended is shown below. Kristina's cash flow from financing activities for the year is","intro":"Selected financial information for Kristina Company for the year just ended is shown below. Kristina's cash flow from financing activities for the year is","table":[["Net income","$2,000,000"],["Increase in accounts receivable","300,000"],["Decrease in inventory","100,000"],["Increase in accounts payable","200,000"],["Depreciation expense","400,000"],["Gain on the sale of available-for-sale debt securities","700,000"],["Cash received from the issue of common stock","800,000"],["Cash paid for dividends","80,000"],["Cash paid for the acquisition of land","1,500,000"],["Cash received from the sale of available-for-sale debt securities","2,800,000"]],"tail":"","options":{"A":"$3,520,000.","B":"$720,000.","C":"$800,000.","D":"$(80,000)."},"correct":"B","correctExplanation":"Cash flow from financing activities included $800,000 cash inflow from issuance and sale of stock and $80,000 cash outflow for dividends. Net cash flow from financing activities was therefore $800,000 − $80,000 = $720,000.","explanations":{"A":"This includes the cash received from the sale of available-for-sale debt securities. The sale of debt securities is an investing activity, not a financing activity.","C":"This is the cash received from the sale of stock. The sale of stock was not the only financing activity that took place.","D":"This is the cash paid for dividends. Cash paid for dividends was not the only financing activity that took place."},"studyUnit":"Study Unit 7: A.1. Investing and Financing Activities, SCF Disclosures covers the","pctCorrect":76},{"num":120,"id":"ICMA 10.P2.098","topic":"Investing and Financing Activities, SCF Disclosures","question":"Selected financial information for Kristina Company for the year just ended is shown below. Kristina's cash flow from investing activities for the year is","intro":"Selected financial information for Kristina Company for the year just ended is shown below. Kristina's cash flow from investing activities for the year is","table":[["Net income","$2,000,000"],["Increase in accounts receivable","300,000"],["Decrease in inventory","100,000"],["Increase in accounts payable","200,000"],["Depreciation expense","400,000"],["Gain on the sale of available-for-sale debt securities","700,000"],["Cash received from the issue of common stock","800,000"],["Cash paid for dividends","80,000"],["Cash paid for the acquisition of land","1,500,000"],["Cash received from the sale of available-for-sale debt securities","2,800,000"]],"tail":"","options":{"A":"$1,220,000.","B":"$2,800,000.","C":"$(1,500,000).","D":"$1,300,000."},"correct":"D","correctExplanation":"$2,800,000 cash received from the sale of available-for-sale debt securities is a cash inflow and cash paid for the acquisition of land is a cash outflow ($1,500,000). Both are investing activities. The net cash flow from investing activities is $2,800,000 − $1,500,000 = $1,300,000.","explanations":{"A":"This includes the $80,000 paid for dividends to shareholders. Dividends paid is a financing activity, not an investing activity.","B":"This is the cash received from the sale of available-for-sale debt securities. The sale of the debt securities was not the only investing activity that took place.","C":"This is the cash paid for the acquisition of land. The acquisition of land was not the only investing activity that took place."},"studyUnit":"Study Unit 7: A.1. Investing and Financing Activities, SCF Disclosures covers the","pctCorrect":73},{"num":121,"id":"ICMA 10.P2.094","topic":"Investing and Financing Activities, SCF Disclosures","question":"Atwater Company has recorded the following payments for the current period. The amount to be shown in the Investing Activities Section of Atwater’s Cash Flow Statement should be","intro":"Atwater Company has recorded the following payments for the current period. The amount to be shown in the Investing Activities Section of Atwater’s Cash Flow Statement should be","table":[["Purchase Trillium stock","$300,000"],["Dividends paid to Atwater shareholders","200,000"],["Repurchase of Atwater Company stock","400,000"]],"tail":"","options":{"A":"$500,000.","B":"$700,000.","C":"$900,000.","D":"$300,000."},"correct":"D","correctExplanation":"The purchase of Trillium stock for $300,000 is the only investing activity noted. Payment of dividends and treasury stock transactions are both financing activities.","explanations":{"A":"The purchase of Trillium stock is the only investing activity noted. Payment of dividends and treasury stock transactions are both financing activities.","B":"The purchase of Trillium stock is the only investing activity noted. Payment of dividends and treasury stock transactions are both financing activities.","C":"The purchase of Trillium stock is the only investing activity noted. Payment of dividends and treasury stock transactions are both financing activities."},"studyUnit":"Study Unit 7: A.1. Investing and Financing Activities, SCF Disclosures covers the","pctCorrect":77},{"num":122,"id":"IMAF.A009","topic":"Investing and Financing Activities, SCF Disclosures","question":"The purchase of fixed assets should be accounted for on the statement of cash flows as a(n)","intro":"","table":[],"tail":"","options":{"A":"financing activity.","B":"investing activity.","C":"operating activity.","D":"noncash investing and financing activity."},"correct":"B","correctExplanation":"The purchase of fixed assets is accounted for as an investing activity on the statement of cash flows.","explanations":{"A":"The purchase of fixed assets is not accounted for as a financing activity on the statement of cash flows.","C":"The purchase of fixed assets is not accounted for as an operating activity on the statement of cash flows.","D":"The purchase of fixed assets is not accounted for as a noncash investing and financing activity on the statement of cash flows."},"studyUnit":"Study Unit 7: A.1. Investing and Financing Activities, SCF Disclosures covers the","pctCorrect":92},{"num":123,"id":"HTB 1.1.010","topic":"Investing and Financing Activities, SCF Disclosures","question":"Three years ago, James Company purchased stock in Zebra Inc. at a cost of $100,000. The stock was sold for $150,000 during the current fiscal year. The result of this transaction should be shown in the investing activities section of James’s statement of cash flows as:","intro":"","table":[],"tail":"","options":{"A":"Zero","B":"$50,000","C":"$100,000","D":"$150,000"},"correct":"D","correctExplanation":"The cash received from the sale of the stock was $150,000, and that is the amount that should be shown for the transaction in the cash flows from investing activities section of James’ statement of cash flows.","explanations":{"A":"The amount that the stock is sold for should be shown in the investing activities section of the statement of cash flows.","B":"$50,000 is the amount of the gain on the sale of the stock. While this is the adjustment that is needed in the operating activities section, it is not the amount that is shown in the investing activities section.","C":"The amount received from the sale of the stock is what should be shown in the investing section of the statement of cash flows. The cost of $100,000 is not relevant to what should be shown in the investing section when the stock is sold. The cost is relevant to calculate the gain on the sale that needs to be adjusted for in the operating activities section, but this question is about the investing activities section."},"studyUnit":"Study Unit 7: A.1. Investing and Financing Activities, SCF Disclosures covers the","pctCorrect":56},{"num":124,"id":"ICMA 10.P2.093","topic":"Investing and Financing Activities, SCF Disclosures","question":"During the year, Deltech Inc. acquired a long-term productive asset for $5,000 and also borrowed $10,000 from a local bank. These transactions should be reported on Deltech’s Statement of Cash Flows as","intro":"","table":[],"tail":"","options":{"A":"Outflows for Investing Activities, $5,000; Inflows from Financing Activities, $10,000.","B":"Outflows for Operating Activities, $5,000; Inflows from Financing Activities, $10,000.","C":"Inflows from Investing Activities, $10,000; Outflows for Financing Activities, $5,000.","D":"Outflows for Financing Activities, $5,000; Inflows from Investing Activities, $10,000."},"correct":"A","correctExplanation":"Acquisition of the long-term productive asset is a $5,000 cash outflow for an investing activity, and obtaining the loan is a $10,000 cash inflow from a financing activity.","explanations":{"B":"Acquisition of the long-term productive asset is a cash outflow for an investing activity, and obtaining the loan is a cash inflow from a financing activity.","C":"Acquisition of the long-term productive asset is a cash outflow for an investing activity, and obtaining the loan is a cash inflow from a financing activity.","D":"Acquisition of the long-term productive asset is a cash outflow for an investing activity, and obtaining the loan is a cash inflow from a financing activity."},"studyUnit":"Study Unit 7: A.1. Investing and Financing Activities, SCF Disclosures covers the","pctCorrect":86},{"num":125,"id":"ICMA 10.P2.096","topic":"Investing and Financing Activities, SCF Disclosures","question":"Barber Company has recorded the following payments for the current period. The amount to be shown in the Financing Activities section of Barber's Cash Flow Statement should be","intro":"Barber Company has recorded the following payments for the current period. The amount to be shown in the Financing Activities section of Barber's Cash Flow Statement should be","table":[["Interest paid on bank loan","$300,000"],["Dividends paid to Barber shareholders","200,000"],["Repurchase of Barber Company stock","400,000"]],"tail":"","options":{"A":"$900,000","B":"$300,000","C":"$500,000","D":"$600,000"},"correct":"D","correctExplanation":"Dividends paid ($200,000) and repurchase of the company's stock as treasury stock ($400,000) are transactions that should be classified as cash flows from financing activities on the company's cash flow statement. Interest on debt is classified as a cash flow from operating activities, not financing activities.","explanations":{"A":"This answer results from including all of the cash flows given in the calculation of cash flows from financing activities. However, interest on debt is classified as a cash flow from operating activities, not as a cash flow from financing activities.","B":"This answer results from classifying interest paid on debt as the only cash flow from financing activities. However, interest on debt is classified as a cash flow from operating activities, not as a cash flow from financing activities.","C":"This answer results from including interest paid on debt and dividends paid to shareholders in the calculation of cash flows from financing activities. However, interest on debt is classified as a cash flow from operating activities, not as a cash flow from financing activities. And although it is correct to classify dividends paid to shareholders as a financing activity, that is not the only financing activity among those given."},"studyUnit":"Study Unit 7: A.1. Investing and Financing Activities, SCF Disclosures covers the","pctCorrect":80},{"num":126,"id":"ICMA 0807.P2.052","topic":"Investing and Financing Activities, SCF Disclosures","question":"Zip Company entered into the following transactions during the year. • Purchased stock for $200,000 • Purchased electronic equipment for use on the manufacturing floor for $300,000 • Paid dividends to shareholders of Zip Company in the amount of $800,000 The amount to be reported in the investing activities section of the Statement of Cash Flows would be","intro":"","table":[],"tail":"","options":{"A":"$1,300,000.","B":"$800,000.","C":"$200,000.","D":"$500,000."},"correct":"D","correctExplanation":"The purchase of stock for $200,000 and the purchase of electronic equipment for $300,000 are both reported in the investing activities section of the Statement of Cash Flows, for a total of $500,000.","explanations":{"A":"$1,300,000 includes all of the items listed. Not all of the items listed are reported in the investing activities section of the Statement of Cash Flows.","B":"The $800,000 paid in dividends to shareholders is a cash outflow from financing activities, not a cash outflow from investing activities.","C":"$200,000 includes the stock purchased only. The purchase of stock is not the only item that would be reported in the investing activities section of the Statement of Cash Flows."},"studyUnit":"Study Unit 7: A.1. Investing and Financing Activities, SCF Disclosures covers the","pctCorrect":89},{"num":127,"id":"CMA 1295 P2 Q4","topic":"Investing and Financing Activities, SCF Disclosures","question":"Royce Company had the following transactions during the fiscal year ended December 31, 20X1: • Accounts receivable decreased from $115,000 on December 31, 20X0 to $100,000 on December 31, 20X1. • Royce's board of directors declared dividends on December 31, 20X1 of $0.05 per share on the 2.8 million shares outstanding, payable to shareholders of record on January 31, 20X2. The company did not declare or pay dividends for fiscal 20X0. • Sold a truck with a net book value of $7,000 for $5,000 cash, reporting a loss of $2,000. • Paid interest to bondholders of $780,000. • The cash balance was $106,000 on December 31, 20X0 and $284,000 on December 31, 20X1. The total of cash provided/used by operating activities plus cash provided/used by investing activities plus cash provided/used by financing activities is","intro":"","table":[],"tail":"","options":{"A":"cash provided of $284,000.","B":"equal to net income reported for fiscal year ended December 31, 20X1.","C":"cash used of $582,000.","D":"cash provided of $178,000."},"correct":"D","correctExplanation":"This question is made simple by the fact that the beginning and ending cash balances are given. Since the beginning cash was $106,000 and the ending balance was $284,000, we know that the cash increased by $178,000 during the year. All transactions that involved cash will be classified as either operating, investing or financing activities, so this question is actually just asking what the change in the cash balance was during the year, which is the ending cash balance minus the beginning cash balance. The correct answer cannot be calculated using the other amounts given, because not all of the transactions that affected cash have been given. The amounts given net to a cash outflow of $760,000. Since that does not reconcile to the amount of change in the cash balance (a net cash inflow of $178,000), we know that not all the transactions that affected cash are given.","explanations":{"A":"This is the ending cash balance.","B":"Net income must be adjusted for noncash items in order to determine the net change in the cash position for the period.","C":"This is the decrease in accounts receivable (+$15,000) plus the proceeds from the truck sale (+$5,000) minus the interest paid to bondholders (−$780,000) plus the increase in the cash balance (+$178,000). This is incorrect because: 1. The question asks for the total of cash provided/used by operating activities plus cash provided/used by investing activities plus cash provided/used by financing activities. All transactions that involved cash will be classified as either operating, investing or financing activities, so this question is actually just asking what the change in the cash balance was during the year. In the calculation above, the amount of change in the cash balance (ending cash balance of $284,000 − beginning cash balance of $106,000) is included as one component of the change in the cash balance, which makes no sense. The beginning and ending cash balances can be used only to calculate the net cash used or provided during the period. The amount of change in the cash balance is the number that any statement of cash flows must reconcile to. 2. The correct answer cannot be calculated using the amounts given, because not all of the transactions that affected cash have been given. The amounts given net to a cash outflow of $760,000. Since that does not reconcile to the amount of change in the cash balance (a net cash inflow of $178,000), we know that not all the transactions that affected cash are given."},"studyUnit":"Study Unit 7: A.1. Investing and Financing Activities, SCF Disclosures covers the","pctCorrect":54},{"num":128,"id":"CMA 1295 P2 Q3","topic":"Investing and Financing Activities, SCF Disclosures","question":"Royce Company had the following transactions during the fiscal year ended December 31, 20X1: • Accounts receivable decreased from $115,000 on December 31, 20X0 to $100,000 on December 31, 20x1. • Royce's board of directors declared dividends on December 31, 20X1 of $0.05 per share on the 2.8 million shares outstanding, payable to shareholders of record on January 31, 20X2. The company did not declare or pay dividends for fiscal 20X0. • Sold a truck with a net book value of $7,000 for $5,000 cash, reporting a loss of $2,000. • Paid interest to bondholders of $780,000. • The cash balance was $106,000 on December 31, 20X0 and $284,000 on December 31, 20X1. Royce Company uses the indirect method to prepare its 20X1 statement of cash flows. It reports a(n)","intro":"","table":[],"tail":"","options":{"A":"addition of $2,000 in the operating section for the $2,000 loss on the sale of the truck.","B":"source or inflow of funds of $5,000 from the sale of the truck in the financing section.","C":"deduction of $15,000 in the operating section, representing the decrease in year-end accounts receivable.","D":"use or outflow of funds of $140,000 in the financing section, representing dividends."},"correct":"A","correctExplanation":"The loss on the sale of the truck requires an adjustment to net income to calculate net cash flow from operating activities under the indirect method for the statement of cash flows. Because it was a loss that reduced net income but does not relate to an operating activity, it needs to be added back to net income.","explanations":{"B":"The sale of the truck should be reported in the investing activities section of the statement of cash flows.","C":"The decrease in net receivables should be added to net income under the indirect method of preparing the cash flow from operating activities section of the statement of cash flows.","D":"Because this cash flow did not occur in 20X1, it should not be reported in the 20X1 statement of cash flows. The dividends were paid in 20X2."},"studyUnit":"Study Unit 7: A.1. Investing and Financing Activities, SCF Disclosures covers the","pctCorrect":60},{"num":129,"id":"HTB 1.1.011","topic":"Investing and Financing Activities, SCF Disclosures","question":"Kelli Company acquired land by assuming a mortgage for the full acquisition cost. This transaction should be disclosed on Kelli’s statement of cash flows as a(n)","intro":"","table":[],"tail":"","options":{"A":"Noncash financing and investing activity.","B":"Financing activity.","C":"Operating activity.","D":"Investing activity."},"correct":"A","correctExplanation":"The transaction should be disclosed in the statement of cash flows as a noncash financing activity and a noncash investing activity. When real estate is purchased with borrowed funds, the borrower/buyer signs the mortgage documents and the payment for the real estate is sent by the lender directly to the seller of the real estate. The cash is never recorded in the borrower’s accounts. Thus, the company acquired land, an investing activity, without any cash payment; and it became liable for a mortgage, a financing activity, without receiving any cash. Since the company did not pay or receive any cash, the two activities will not be included in the line items on the statement of cash flows. However, they must be disclosed in the statement of cash flows as noncash financing and investing activities.","explanations":{"B":"While taking on a mortgage is a financing activity, the transaction is a noncash transaction and should be reported as a noncash financing and investing activity.","C":"This is not an operating activity.","D":"While acquiring land is an investing activity, the transaction is a noncash transaction and should be reported as a noncash financing and investing activity."},"studyUnit":"Study Unit 7: A.1. Investing and Financing Activities, SCF Disclosures covers the","pctCorrect":59}];

<script>
/* ================= State ================= */
const S = {
  screen:'home',
  topic:null,          // practice topic filter
  practiceList:[],     // current practice question set (indices into QUESTIONS)
  pIdx:0,              // practice pointer
  pSelected:{},        // {questionIndex: 'A'} chosen answers in practice
  pRevealed:{},        // {questionIndex: true}
  exam:null,           // {list:[idx...], answers:{}, revealed:false, pos:0}
};
const app = document.getElementById('app');
const byTopic = () => {
  const m={}; QUESTIONS.forEach((q,i)=>{(m[q.topic]=m[q.topic]||[]).push(i)}); return m;
};
const TOPICS = byTopic();
const $ = (h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild;};
const esc = (s)=> (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = (a)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a;};
const scrollTop = ()=>window.scrollTo({top:0,behavior:'smooth'});

/* ================= Icons ================= */
const IC = {
  book:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  timer:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>',
  arrow:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  back:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
  check:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  x:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  chev:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
};

/* ================= Top bar ================= */
function topbar(back){
  const bar = $(`<div class="topbar"></div>`);
  if(back){
    const b=$(`<button class="backbtn">${IC.back}<span>Back</span></button>`);
    b.onclick=back; bar.appendChild(b);
    bar.appendChild($(`<div class="spacer"></div>`));
  } else {
    bar.appendChild($(`<div class="brand"><div class="mark">Σ</div><div>CMA Practice<small>Financial Statements · Section A</small></div></div>`));
    bar.appendChild($(`<div class="spacer"></div>`));
  }
  return bar;
}

/* ================= Render root ================= */
function render(){
  app.innerHTML='';
  if(S.screen==='home') return renderHome();
  if(S.screen==='practice') return renderPractice();
  if(S.screen==='exam') return renderExam();
  if(S.screen==='results') return renderResults();
}

/* ================= HOME ================= */
function renderHome(){
  app.appendChild(topbar(null));
  const topicCount = Object.keys(TOPICS).length;
  const wrap=$(`<div class="fadein"></div>`);
  wrap.appendChild($(`
    <div class="hero">
      <div class="eyebrow">CMA US · Part 1</div>
      <h1>Practice until it's<br><em>second nature.</em></h1>
      <p>Work through real exam-style questions with full answer explanations, or sit a timed-style 20-question mock exam.</p>
      <div class="stats">
        <div class="stat"><div class="n">${QUESTIONS.length}</div><div class="l">Questions</div></div>
        <div class="stat"><div class="n">${topicCount}</div><div class="l">Topics</div></div>
        <div class="stat"><div class="n">20</div><div class="l">Mock exam</div></div>
      </div>
    </div>`));

  const modes=$(`<div></div>`);
  const practiceBtn=$(`
    <button class="mode primary">
      <h3>${IC.book} Practice questions</h3>
      <p>Answer one at a time and reveal the correct answer with a full explanation.</p>
      <span class="go">${IC.arrow}</span>
    </button>`);
  practiceBtn.onclick=()=>startPractice(null);
  const examBtn=$(`
    <button class="mode">
      <h3>${IC.timer} Mock exam · 20 questions</h3>
      <p>A random 20-question set. Answer them all, then get your score and review every answer.</p>
      <span class="go">${IC.arrow}</span>
    </button>`);
  examBtn.onclick=startExam;
  modes.appendChild($(`<div class="section-label">Choose a mode</div>`));
  modes.appendChild(practiceBtn);
  modes.appendChild(examBtn);
  wrap.appendChild(modes);

  // Topic filter for practice
  const topics=$(`<div></div>`);
  topics.appendChild($(`<div class="section-label">Or practice by topic</div>`));
  const chips=$(`<div class="chips"></div>`);
  Object.keys(TOPICS).forEach(t=>{
    const c=$(`<button class="chip">${esc(t)}<span class="c">${TOPICS[t].length}</span></button>`);
    c.onclick=()=>startPractice(t);
    chips.appendChild(c);
  });
  topics.appendChild(chips);
  wrap.appendChild(topics);
  wrap.appendChild($(`<div class="footer-note">Section A · The Financial Statements</div>`));
  app.appendChild(wrap);
}

/* ================= PRACTICE ================= */
function startPractice(topic){
  S.topic=topic;
  S.practiceList = topic ? TOPICS[topic].slice() : QUESTIONS.map((_,i)=>i);
  S.pIdx=0; S.pSelected={}; S.pRevealed={};
  S.screen='practice'; render(); scrollTop();
}

function renderPractice(){
  app.appendChild(topbar(()=>{S.screen='home';render();scrollTop();}));
  const list=S.practiceList, qi=list[S.pIdx], q=QUESTIONS[qi];
  const bar=$(`<div></div>`);
  // progress
  bar.appendChild(progressRail(S.pIdx+1, list.length, false, S.topic||'All questions'));
  bar.appendChild(questionCard(q, qi, {
    selected:S.pSelected[qi], revealed:!!S.pRevealed[qi],
    onSelect:(letter)=>{ if(S.pRevealed[qi])return; S.pSelected[qi]=letter; render(); },
  }));
  app.appendChild(bar);

  // actions
  const act=$(`<div class="actions"></div>`);
  const prev=$(`<button class="btn ghost icon">${IC.back}</button>`);
  prev.disabled=S.pIdx===0;
  prev.onclick=()=>{S.pIdx--;render();scrollTop();};
  act.appendChild(prev);

  if(!S.pRevealed[qi]){
    const check=$(`<button class="btn gold wide">Check answer</button>`);
    check.disabled=!S.pSelected[qi];
    check.onclick=()=>{S.pRevealed[qi]=true;render();};
    act.appendChild(check);
  } else {
    const last=S.pIdx===list.length-1;
    const next=$(`<button class="btn gold wide">${last?'Finish':'Next question'} ${last?'':IC.arrow}</button>`);
    next.onclick=()=>{ if(last){S.screen='home';render();scrollTop();} else {S.pIdx++;render();scrollTop();} };
    act.appendChild(next);
  }
  app.appendChild(act);
}

/* ================= EXAM ================= */
function startExam(){
  const n=Math.min(20, QUESTIONS.length);
  const list=shuffle(QUESTIONS.map((_,i)=>i)).slice(0,n);
  S.exam={list, answers:{}, submitted:false, pos:0};
  S.screen='exam'; render(); scrollTop();
}

function renderExam(){
  const ex=S.exam;
  app.appendChild(topbar(()=>{ if(confirm('Leave the exam? Your progress will be lost.')){S.exam=null;S.screen='home';render();scrollTop();}}));
  const qi=ex.list[ex.pos], q=QUESTIONS[qi];
  const answered=Object.keys(ex.answers).length;

  const wrap=$(`<div></div>`);
  wrap.appendChild(progressRail(ex.pos+1, ex.list.length, true, `${answered}/${ex.list.length} answered`));
  wrap.appendChild(questionCard(q, qi, {
    selected:ex.answers[qi], revealed:false, examMode:true,
    onSelect:(letter)=>{ ex.answers[qi]=letter; render(); },
  }));

  // dot navigator
  const nav=$(`<div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:16px;justify-content:center"></div>`);
  ex.list.forEach((idx,p)=>{
    const done=ex.answers[idx]!=null;
    const cur=p===ex.pos;
    const d=$(`<button class="mono" style="width:30px;height:30px;border-radius:8px;font-size:12px;font-weight:700;
      border:1px solid ${cur?'var(--gold)':'var(--border)'};
      background:${cur?'var(--gold)':done?'var(--gold-soft)':'var(--surface)'};
      color:${cur?'var(--bg)':done?'var(--gold)':'var(--text-faint)'};">${p+1}</button>`);
    d.onclick=()=>{ex.pos=p;render();scrollTop();};
    nav.appendChild(d);
  });
  wrap.appendChild(nav);
  app.appendChild(wrap);

  const act=$(`<div class="actions"></div>`);
  const prev=$(`<button class="btn ghost icon">${IC.back}</button>`);
  prev.disabled=ex.pos===0;
  prev.onclick=()=>{ex.pos--;render();scrollTop();};
  act.appendChild(prev);

  if(ex.pos < ex.list.length-1){
    const next=$(`<button class="btn ghost wide">Next ${IC.arrow}</button>`);
    next.onclick=()=>{ex.pos++;render();scrollTop();};
    act.appendChild(next);
  }
  const submit=$(`<button class="btn gold wide">Submit exam${answered<ex.list.length?` · ${answered}/${ex.list.length}`:''}</button>`);
  submit.onclick=()=>{
    const miss=ex.list.length-answered;
    if(miss>0 && !confirm(`${miss} question${miss>1?'s':''} still unanswered — submit anyway?`)) return;
    S.screen='results'; render(); scrollTop();
  };
  act.appendChild(submit);
  app.appendChild(act);
}

/* ================= RESULTS ================= */
function renderResults(){
  const ex=S.exam;
  app.appendChild(topbar(()=>{S.exam=null;S.screen='home';render();scrollTop();}));
  let correct=0;
  ex.list.forEach(idx=>{ if(ex.answers[idx]===QUESTIONS[idx].correct) correct++; });
  const total=ex.list.length;
  const pct=Math.round(correct/total*100);
  const pass=pct>=72; // ICMA scaled pass ~ 72%
  const wrap=$(`<div class="fadein"></div>`);

  // score ring
  const circ=2*Math.PI*66;
  const off=circ*(1-pct/100);
  const ringColor = pct>=72?'var(--emerald)': pct>=50?'var(--gold)':'var(--rose)';
  wrap.appendChild($(`
    <div class="score-card">
      <div class="ring">
        <svg width="150" height="150" viewBox="0 0 150 150">
          <circle cx="75" cy="75" r="66" fill="none" stroke="var(--surface-3)" stroke-width="10"/>
          <circle cx="75" cy="75" r="66" fill="none" stroke="${ringColor}" stroke-width="10"
            stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ}"
            style="transition:stroke-dashoffset 1s ease .15s" id="ringfg"/>
        </svg>
        <div class="pct"><b style="color:${ringColor}">${pct}%</b><span>${correct}/${total}</span></div>
      </div>
      <div class="verdict-line" style="color:${ringColor}">${pass?'Strong pass':pct>=50?'Getting there':'Keep practicing'}</div>
      <div class="verdict-sub">${pass?'You cleared the ~72% benchmark on this set.':`Aim for 72%+. That's ${Math.max(0,Math.ceil(total*0.72)-correct)} more correct.`}</div>
      <div class="score-split">
        <div class="s correct"><div class="n">${correct}</div><div class="l">Correct</div></div>
        <div class="s wrong"><div class="n">${total-correct}</div><div class="l">Incorrect</div></div>
        <div class="s"><div class="n">${total}</div><div class="l">Total</div></div>
      </div>
    </div>`));

  wrap.appendChild($(`<div class="section-label">Review your answers</div>`));
  const rev=$(`<div></div>`);
  ex.list.forEach((idx,p)=>{
    const q=QUESTIONS[idx];
    const your=ex.answers[idx];
    const ok=your===q.correct;
    const item=$(`
      <button class="review-item ${ok?'ok':'no'}">
        <div class="idx">${p+1}</div>
        <div class="rtext">${esc(q.tail||q.question).slice(0,110)}${(q.tail||q.question).length>110?'…':''}
          <div class="rmeta">Your answer: <b class="${ok?'ok':'no'}">${your||'—'}</b> · Correct: <b class="ok">${q.correct}</b></div>
        </div>
        <span class="chev">${IC.chev}</span>
      </button>`);
    item.onclick=()=>openReview(idx);
    rev.appendChild(item);
  });
  wrap.appendChild(rev);

  const act=$(`<div class="actions"></div>`);
  const again=$(`<button class="btn gold wide">${IC.timer} New mock exam</button>`);
  again.onclick=startExam;
  const home=$(`<button class="btn ghost wide">Home</button>`);
  home.onclick=()=>{S.exam=null;S.screen='home';render();scrollTop();};
  act.appendChild(home); act.appendChild(again);
  wrap.appendChild(act);
  app.appendChild(wrap);

  requestAnimationFrame(()=>{const r=document.getElementById('ringfg'); if(r) r.style.strokeDashoffset=off;});
}

// review a single exam question in full (reuse question card, revealed)
function openReview(idx){
  app.innerHTML='';
  app.appendChild(topbar(()=>{S.screen='results';render();scrollTop();}));
  const q=QUESTIONS[idx];
  const pos=S.exam.list.indexOf(idx);
  const wrap=$(`<div class="fadein"></div>`);
  wrap.appendChild($(`<div class="progress-rail"><span class="count"><b>Review</b> · question ${pos+1}</span><div class="bar"><i style="width:100%"></i></div></div>`));
  wrap.appendChild(questionCard(q, idx, {selected:S.exam.answers[idx], revealed:true}));
  const act=$(`<div class="actions"></div>`);
  const back=$(`<button class="btn gold wide">Back to results</button>`);
  back.onclick=()=>{S.screen='results';render();scrollTop();};
  act.appendChild(back);
  wrap.appendChild(act);
  app.appendChild(wrap);
  scrollTop();
}

/* ================= Shared components ================= */
function progressRail(cur,total,exam,label){
  const pct=Math.round(cur/total*100);
  const rail=$(`<div class="progress-rail"></div>`);
  rail.appendChild($(`<span class="count"><b>${cur}</b>/${total}</span>`));
  rail.appendChild($(`<div class="bar ${exam?'exam':''}"><i style="width:${pct}%"></i></div>`));
  rail.appendChild($(`<span class="count" style="color:var(--text-faint);font-size:11px;max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(label)}</span>`));
  return rail;
}

function questionCard(q, qi, opt){
  const {selected, revealed, onSelect, examMode} = opt;
  const card=$(`<div class="qcard ${revealed?'locked':''}"></div>`);

  // head
  const head=$(`<div class="qhead"></div>`);
  head.appendChild($(`<span class="qnum">Q${q.num}</span>`));
  head.appendChild($(`<span class="qtopic">${esc(q.topic)}</span>`));
  head.appendChild($(`<span class="qid">${esc(q.id)}</span>`));
  card.appendChild(head);

  // body
  if(q.table && q.table.length){
    if(q.intro) card.appendChild($(`<div class="qtext"><span class="intro">${esc(q.intro)}</span></div>`));
    const t=$(`<table class="data"></table>`);
    q.table.forEach(([k,v])=>t.appendChild($(`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`)));
    card.appendChild(t);
    if(q.tail) card.appendChild($(`<div class="qtail">${esc(q.tail)}</div>`));
  } else {
    card.appendChild($(`<div class="qtext">${esc(q.question)}</div>`));
  }

  // options
  const opts=$(`<div class="options"></div>`);
  ['A','B','C','D'].forEach(L=>{
    if(!q.options[L]) return;
    let cls='opt';
    if(revealed){
      if(L===q.correct) cls+=' correct';
      else if(L===selected) cls+=' wrong';
      else cls+=' dim';
    } else if(selected===L){ cls+=' sel'; }
    const o=$(`<button class="${cls}"><span class="key">${L}</span><span class="txt">${esc(q.options[L])}</span></button>`);
    if(revealed){
      if(L===q.correct) o.appendChild($(`<span class="tick" style="color:var(--emerald)">${IC.check}</span>`));
      else if(L===selected) o.appendChild($(`<span class="tick" style="color:var(--rose)">${IC.x}</span>`));
    }
    if(onSelect) o.onclick=()=>onSelect(L);
    opts.appendChild(o);
  });
  card.appendChild(opts);

  // explanation (practice reveal / review only)
  if(revealed){
    const ok=selected===q.correct;
    const ex=$(`<div class="explain"></div>`);
    ex.appendChild($(`
      <div class="verdict ${ok?'ok':'no'}">
        ${ok?IC.check:IC.x} ${ok?'Correct':(selected?'Not quite':'Unanswered')}
        <span class="ans">Answer: ${q.correct}</span>
      </div>`));
    if(q.correctExplanation){
      ex.appendChild($(`<div class="exp-block main"><div class="lbl">Why ${q.correct} is correct</div><p>${esc(q.correctExplanation)}</p></div>`));
    }
    // show explanation for the user's wrong pick, if any
    if(!ok && selected && q.explanations[selected]){
      ex.appendChild($(`<div class="exp-block"><div class="lbl">Why ${selected} is wrong</div><p>${esc(q.explanations[selected])}</p></div>`));
    }
    // remaining distractors (collapsed disclosure)
    const others=['A','B','C','D'].filter(L=>L!==q.correct && L!==selected && q.explanations[L]);
    if(others.length){
      const det=$(`<details style="margin-top:4px"><summary style="cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--gold);list-style:none">Show other options ▾</summary></details>`);
      others.forEach(L=>det.appendChild($(`<div class="exp-block" style="margin-top:10px"><div class="lbl">Option ${L}</div><p>${esc(q.explanations[L])}</p></div>`)));
      ex.appendChild(det);
    }
    const meta=[];
    if(q.studyUnit) meta.push(esc(q.studyUnit));
    if(q.pctCorrect!=null) meta.push(`${q.pctCorrect}% answer this correctly first try`);
    if(meta.length) ex.appendChild($(`<div class="meta">${meta.join(' · ')}</div>`));
    card.appendChild(ex);
  }
  return card;
}

/* ================= boot ================= */
render();
</script>
