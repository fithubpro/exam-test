 is not classified on the statement of cash flows as an operating activity.","D":"Noncash investing and financing activities is not a classification on the statement of cash flows but rather an item to be disclosed as a note to the statement. The sale of available-for-sale debt securities generates cash, so it would not be disclosed as a noncash transaction but instead must be classified in the body of the statement of cash flows."},"studyUnit":"Study Unit 5: A.1. Statement of Cash Flows Introduction  for this","pctCorrect":64},{"num":63,"id":"CMA 1296 P2 Q23","topic":"Statement of Cash Flows Overview","question":"All of the following should be classified as investing activities in the statement of cash flows except","intro":"","table":[],"tail":"","options":{"A":"cash inflows from the sale of bonds of other entities.","B":"cash outflows to purchase manufacturing equipment.","C":"cash inflows from the sale of a manufacturing plant.","D":"cash outflows to creditors for interest."},"correct":"D","correctExplanation":"Cash outflows for interest are classified as cash outflows from operating activities on the statement of cash flows.","explanations":{"A":"Cash inflows from the sale of bonds of other entities are classified as cash inflows from investing activities on the statement of cash flows.","B":"Cash outflows for the purchase of equipment are classified as cash outflows from investing activities on the statement of cash flows.","C":"Cash inflows from the sale of a manufacturing plant are classified as cash inflows from investing activities on the statement of cash flows."},"studyUnit":"Study Unit 5: A.1. Statement of Cash Flows Introduction  for this","pctCorrect":85},{"num":64,"id":"CMA 0693 P2 Q13","topic":"Statement of Cash Flows Overview","question":"With respect to the content and form of the statement of cash flows,","intro":"","table":[],"tail":"","options":{"A":"accounting standards covering the statement of cash flows encourage the use of the indirect method.","B":"the indirect method adjusts ending retained earnings to reconcile it to net cash flows from operations.","C":"the direct method of reporting cash flows from operating activities includes disclosing the major classes of gross cash receipts and gross cash payments.","D":"the reconciliation of the net income to net operating cash flow need not be presented when using the direct method."},"correct":"C","correctExplanation":"Under the direct method, the statement of cash flows discloses each type of transaction separately. There are individual lines for cash received from customers, cash paid to suppliers, cash paid for rent, cash paid for salaries, and so forth. Under the indirect method, this breakdown by activity is not provided.","explanations":{"A":"The FASB does not encourage the use of the indirect method.","B":"The indirect method adjusts net income to calculate the cash flows from operations which reconciles net income to net cash flows from operating activities.","D":"This reconciliation is required no matter which method is used. When the indirect method of reporting cash flows from operating activities is used, the reconciliation is part of the statement of cash flows. When the direct method is used, the reconciliation must be done separately from the statement."},"studyUnit":"Study Unit 5: A.1. Statement of Cash Flows Introduction  for this","pctCorrect":55},{"num":65,"id":"HTB 1.1.008","topic":"Statement of Cash Flows Overview","question":"The presentation of the major classes of operating cash receipts (such as receipts from customers) less the major classes of operating cash disbursements (such as cash paid for merchandise) is best described as the:","intro":"","table":[],"tail":"","options":{"A":"Format of the statement of cash flows.","B":"Cash method of determining income in conformity with generally accepted accounting principles.","C":"Direct method of calculating net cash provided or used by operating activities.","D":"Indirect method of calculating net cash provided or used by operating activities."},"correct":"C","correctExplanation":"The direct method of calculating net cash provided by operating activities presents the major classes of operating cash receipts such as receipts from customers less the major classes of operating cash disbursements such as cash paid for merchandise. This presentation is different from the indirect method of presentation because the indirect method begins with net income and adjusts net income to (1) include net changes in operating cash that do not appear on the income statement and (2) to remove noncash items that are included in the income statement.","explanations":{"A":"The format of the statement of cash flows does not present the major classes of operating cash receipts less the major classes of operating cash disbursements.","B":"The cash method of determining income does not present the major classes of operating cash receipts less the major classes of operating cash disbursements.","D":"The indirect method of calculating net cash provided or used by operating activities does not present the major classes of operating cash receipts less the major classes of operating cash disbursements."},"studyUnit":"Study Unit 5: A.1. Statement of Cash Flows Introduction  for this","pctCorrect":73},{"num":66,"id":"CIA 1195 P4 Q34","topic":"Statement of Cash Flows Overview","question":"In the statement of cash flows, the payment of common share dividends appears in the _____ activities section as a _____ of cash.","intro":"","table":[],"tail":"","options":{"A":"Financing, Use","B":"Operating, Source","C":"Investing, Use","D":"Investing, Source"},"correct":"A","correctExplanation":"The payment of dividends is classified as a financing activity and because it a cash outflow, it is a use of cash.","explanations":{"B":"The payment of dividends is not an operating activity and is not a source of cash.","C":"The payment of dividends is not classified as an investing activity.","D":"The payment of dividends is not an investing activity and is not a source of cash."},"studyUnit":"Study Unit 5: A.1. Statement of Cash Flows Introduction  for this","pctCorrect":84},{"num":67,"id":"ICMA 11.P1.011","topic":"Statement of Cash Flows Overview","question":"The sale of available-for-sale debt securities held in a portfolio should be accounted for on the statement of cash flows as a(n)","intro":"","table":[],"tail":"","options":{"A":"investing activity.","B":"operating activity.","C":"financing activity.","D":"noncash investing and financing activity."},"correct":"A","correctExplanation":"Available-for-sale debt securities held in a portfolio are investments, and therefore cash received for their sale would be presented as a cash inflow from investing activities on the statement of cash flows.","explanations":{"B":"Cash flows from operating activities are cash inflows and cash outflows that generally involve producing and delivering goods and providing services. The sale of available-for- sale debt securities held in a portfolio does not involve producing and delivering goods and providing services, so it is not accounted for on the statement of cash flows as a cash flow from operating activities. Please see the correct answer explanation for more information.","C":"“Available-for-sale” is a classification for debt securities held as investments. The sale of available-for-sale debt securities held in a portfolio is not accounted for on the statement of cash flows as a financing activity. Please see the correct answer explanation for more information.","D":"The sale of available-for-sale debt securities held in a portfolio is not reported on the statement of cash flows as a noncash investing and financing activity. Since cash is received for the sale, it is not a noncash activity. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 5: A.1. Statement of Cash Flows Introduction  for this","pctCorrect":68},{"num":68,"id":"ICMA 10.P2.015","topic":"Statement of Cash Flows Overview","question":"Which one of the following should be classified as an operating activity on the statement of cash flows?","intro":"","table":[],"tail":"","options":{"A":"The payment of a cash dividend from money arising from current operations.","B":"The purchase of additional equipment needed for current production.","C":"A decrease in accounts payable during the year.","D":"An increase in cash resulting from the issuance of previously authorized common stock."},"correct":"C","correctExplanation":"Operating activities are generally part of the company's main business activities and central operations. These are essentially items that generate revenues and expenses. When accounts payable decreases, it means cash has been disbursed for operating activities. Thus a decrease in accounts payable during the year should be classified as an operating activity on the statement of cash flows.","explanations":{"A":"The payment of a cash dividend is classified on the statement of cash flows as a financing activity, regardless of where the money to pay the dividend came from. Financing activities are the activities that a company undertakes to raise capital to finance the business, and paying a cash dividend is a financing activity.","B":"The purchase of additional equipment needed for current production is classified on the statement of cash flows as an investing activity. Investing activities are those activities that the company undertakes to generate a future profit, or return, such as purchasing fixed assets.","D":"An increase in cash resulting from the issuance of previously authorized common stock is classified on the statement of cash flows as a financing activity. Financing activities are the activities that a company undertakes to raise capital to finance the business, and issuing stock raises capital to finance the business."},"studyUnit":"Study Unit 5: A.1. Statement of Cash Flows Introduction  for this","pctCorrect":80},{"num":69,"id":"CMA 1295 P2 Q5","topic":"Statement of Cash Flows Overview","question":"A statement of cash flows is intended to help users of financial statements","intro":"","table":[],"tail":"","options":{"A":"evaluate a firm's economic resources and obligations.","B":"determine whether insiders have sold or purchased the firm's stock.","C":"determine a firm's components of income from operations.","D":"assess a company's ability to generate positive future net cash flows, meet its obligations, and pay dividends, as well as its needs for external financing."},"correct":"D","correctExplanation":"The statement of cash flows provides information about the sources and uses of cash. When used with other financial statements, the statement of cash flows will assist users in assessing the company's ability to generate positive future net cash flows, meet its obligations, pay dividends. It also helps users to assess the company's needs for external financing, reasons for differences between net income and cash flows, and the effects of the company's investing and financing activities on its financial position.","explanations":{"A":"The balance sheet, not the statement of cash flows, provides information about a firm's economic resources and obligations.","B":"The notes to financial statements will provide information as to whether or not insiders have sold or purchased the firm's stock.","C":"The income statement, not the statement of cash flows, helps users determine a firm's components of income from operations."},"studyUnit":"Study Unit 5: A.1. Statement of Cash Flows Introduction  for this","pctCorrect":90},{"num":70,"id":"CIA 1192 P4 Q32","topic":"Statement of Cash Flows Overview","question":"A reader of a statement of cash flows wishes to analyze the major classes of cash receipts and cash payments from operating activities. Which methods of reporting cash flows from operating activities will supply that information?","intro":"","table":[],"tail":"","options":{"A":"Neither method.","B":"Only the indirect method.","C":"Only the direct method.","D":"Both the direct and indirect methods."},"correct":"C","correctExplanation":"Only the direct method provides specific information about the cash inflows or outflows from different operating activities (such as cash received from customers and cash paid to suppliers).","explanations":{"A":"One of the methods of reporting cash flows from operating activities does provide specific information about cash inflows and outflows from specific operating activities.","B":"The indirect method does not provide specific information about cash inflows and outflows from specific operating activities.","D":"The indirect method does not provide specific information about cash inflows and outflows from specific operating activities."},"studyUnit":"Study Unit 5: A.1. Statement of Cash Flows Introduction  for this","pctCorrect":53},{"num":71,"id":"CMA 1293 P2 Q29","topic":"Statement of Cash Flows Overview","question":"With respect to the statement of cash flows, the FASB Accounting Standards Codification® classifies cash receipts and cash payments as arising from operating, investing, and financing activities. All of the following should be classified as investing activities except","intro":"","table":[],"tail":"","options":{"A":"cash inflows from the sale of bonds of other entities.","B":"cash outflows to lenders for interest.","C":"cash outflows to purchase manufacturing equipment.","D":"cash inflows from the sale of a manufacturing plant."},"correct":"B","correctExplanation":"Cash paid to lenders for interest is classified as cash flows from operating activities on the statement of cash flows.","explanations":{"A":"Inflows from the sale of bonds of other entities are classified as cash flows from investing activities on the statement of cash flows because they are investments held by the company.","C":"Outflows to purchase manufacturing equipment are classified as cash flows from investing activities on the statement of cash flows.","D":"Inflows from the sale of a manufacturing plant are classified as cash flows from investing activities on the statement of cash flows."},"studyUnit":"Study Unit 5: A.1. Statement of Cash Flows Introduction  for this","pctCorrect":82},{"num":72,"id":"HTB 1.1.006","topic":"Statement of Cash Flows Overview","question":"A statement of cash flows would have cash activities listed in which of the following orders?","intro":"","table":[],"tail":"","options":{"A":"Financing, investing, operating.","B":"Operating, financing, investing.","C":"Investing, financing, operating.","D":"Operating, investing, financing."},"correct":"D","correctExplanation":"The correct order of presentation in the statement of cash flows is: (1) cash flows from operating activities, (2) cash flows from investing activities, and (3) cash flows from financing activities. That is the order of presentation whether the direct or the indirect method is being used to report net cash flow from operating activities.","explanations":{"A":"This is not the correct order of activities on the statement of cash flows.","B":"This is not the correct order of activities on the statement of cash flows.","C":"This is not the correct order of activities on the statement of cash flows."},"studyUnit":"Study Unit 5: A.1. Statement of Cash Flows Introduction  for this","pctCorrect":89},{"num":73,"id":"IMAF.A014","topic":"Statement of Cash Flows Overview","question":"Which one of the following is not provided by the statement of cash flows?","intro":"","table":[],"tail":"","options":{"A":"The company’s ability to generate future cash flows.","B":"The company’s management with respect to the efficient and profitable use of the company’s resources.","C":"The company’s cash and noncash investing and financing transactions during the period.","D":"The company’s ability to pay dividends and meet obligations."},"correct":"B","correctExplanation":"The statement of cash flows does not provide information about the company’s management with respect to the efficient and profitable use of the company’s resources.","explanations":{"A":"The statement of cash flows provides information about the company’s ability to generate future cash flows.","C":"The statement of cash flows provides information about the company’s cash and noncash investing and financing transactions during the period.","D":"The statement of cash flows provides information about the company’s ability to pay dividends and meet obligations."},"studyUnit":"Study Unit 5: A.1. Statement of Cash Flows Introduction  for this","pctCorrect":62},{"num":74,"id":"HTB 1.1.005","topic":"Statement of Cash Flows Overview","question":"Dividends paid to company shareholders would be shown on the statement of cash flows as:","intro":"","table":[],"tail":"","options":{"A":"Operating cash outflows.","B":"Cash flows from investing activities.","C":"Cash flows from financing activities.","D":"Operating cash inflows."},"correct":"C","correctExplanation":"Dividends paid to company shareholders are shown on the statement of cash flows as cash flows from financing activities.","explanations":{"A":"Dividends paid to company shareholders are not shown on the statement of cash flows as operating cash outflows.","B":"Dividends paid to company shareholders are not shown on the statement of cash flows as cash flows from investing activities.","D":"Dividends paid to company shareholders are not shown on the statement of cash flows as operating cash inflows."},"studyUnit":"Study Unit 5: A.1. Statement of Cash Flows Introduction  for this","pctCorrect":84},{"num":75,"id":"CMA 1288 P4 Q19","topic":"Statement of Cash Flows Overview","question":"Which of the following items is specifically included in the statement of cash flows?","intro":"","table":[],"tail":"","options":{"A":"Conversion of debt to equity.","B":"Operating and nonoperating cash flow information.","C":"Acquiring an asset by means of a loan where the lender sends the loan proceeds directly to the seller of the asset.","D":"Purchasing a building by giving a mortgage to the seller."},"correct":"B","correctExplanation":"The statement of cash flows reports both operating and nonoperating cash flow information. It reports cash flows from operating activities, investing activities, and financing activities. Cash flows from operating activities are operating cash flows. Investing and financing activities are nonoperating activities, so those cash flows are cash flows from nonoperating activities.","explanations":{"A":"This is a noncash transaction and noncash transactions are reported in a supplemental schedule at the bottom of the statement of cash flows; they are not reported in the body of the statement of cash flows.","C":"This is a noncash transaction and noncash transactions are reported in a supplemental schedule at the bottom of the statement of cash flows; they are not reported in the body of the statement of cash flows.","D":"This is a noncash transaction and noncash transactions are reported in a supplemental schedule at the bottom of the statement of cash flows; they are not reported in the body of the statement of cash flows."},"studyUnit":"Study Unit 5: A.1. Statement of Cash Flows Introduction  for this","pctCorrect":70},{"num":76,"id":"ICMA 10.P2.011","topic":"Statement of Cash Flows Overview","question":"All of the following are classifications on the Statement of Cash Flows except","intro":"","table":[],"tail":"","options":{"A":"financing activities.","B":"operating activities.","C":"investing activities.","D":"equity activities."},"correct":"D","correctExplanation":"The Statement of Cash Flows contains three main classifications: operating activities, investing activities, and financing activities. This question is asking for what is not a classification on the Statement of Cash Flows. Equity activities is not a classification on the Statement of Cash Flows. Equity transactions are presented as financing activities.","explanations":{"A":"The Statement of Cash Flows contains three main classifications. Cash flows from financing activities is one of those classifications. This question is asking for what is not a classification on the Statement of Cash Flows.","B":"The Statement of Cash Flows contains three main classifications. Cash flows from operating activities is one of those classifications. This question is asking for what is not a classification on the Statement of Cash Flows.","C":"The Statement of Cash Flows contains three main classifications. Cash flows from investing activities is one of those classifications. This question is asking for what is not a classification on the Statement of Cash Flows."},"studyUnit":"Study Unit 5: A.1. Statement of Cash Flows Introduction  for this","pctCorrect":97},{"num":77,"id":"ICMA 10.P2.005","topic":"Statement of Cash Flows Overview","question":"When using the statement of cash flows to evaluate a company’s continuing solvency, the most important factor to consider is the cash","intro":"","table":[],"tail":"","options":{"A":"flows from (used for) operating activities.","B":"flows from (used for) investing activities.","C":"balance at the end of the period.","D":"flows from (used for) financing activities."},"correct":"A","correctExplanation":"Solvency refers to a firm's ability to cover its liabilities with its assets. If a firm is not able to generate a positive cash flow from its operating activities, it is or soon will be insolvent. Therefore, cash flows from and used for operating activities is the most important factor to consider when using the statement of cash flows to evaluate a company's continuing solvency.","explanations":{"B":"Solvency refers to a firm's ability to cover its liabilities with its assets. Cash flows from and used for investing activities does not help a user evaluate the company's continuing solvency.","C":"Solvency refers to a firm's ability to cover its liabilities with its assets. The cash balance at the end of the period does not help a user evaluate the company's continuing solvency.","D":"Solvency refers to a firm's ability to cover its liabilities with its assets. Cash flows from and used for financing activities does not help a user evaluate the company's continuing solvency."},"studyUnit":"Study Unit 5: A.1. Statement of Cash Flows Introduction  for this","pctCorrect":50},{"num":78,"id":"CMA 0695 P2 Q20","topic":"The Indirect Method","question":"With respect to the statement of cash flows, the FASB Accounting Standards Codification® classifies business transactions into operating, investing, and financing activities. All of the following should be included in the reconciliation of net income to net cash provided by operating activities except a(n)","intro":"","table":[],"tail":"","options":{"A":"increase in income tax payable.","B":"purchase of land and building in exchange for a long-term note.","C":"decrease in prepaid insurance.","D":"decrease in inventory."},"correct":"B","correctExplanation":"The purchase of land and a building in exchange for a long-term note is a noncash investing and financing activity. Because it is a noncash activity, it is not included in the body of the statement of cash flows at all. It should be disclosed in a supplemental schedule following the statement of cash flows.","explanations":{"A":"An increase in income taxes payable is included in the reconciliation of net income to net cash provided by operating activities.","C":"A decrease in prepaid insurance is included in the reconciliation of net income to net cash provided by operating activities.","D":"A decrease in inventory is included in the reconciliation of net income to net cash provided by operating activities."},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":89},{"num":79,"id":"ICMA 10.P2.101","topic":"The Indirect Method","question":"Madden Corporation's controller has gathered the following information as a basis for preparing the Statement of Cash Flows. Net income for the current year was $82,000. During the year, old equipment with a cost of $60,000 and a net carrying value of $53,000 was sold for cash at a gain of $10,000. New equipment was purchased for $100,000. Shown below are selected closing balances for last year and the current year. Last Year Current Year Cash $ 39,000 $ 85,000 Madden's cash inflow from operating activities for the current year is","intro":"Madden Corporation's controller has gathered the following information as a basis for preparing the Statement of Cash Flows. Net income for the current year was $82,000. During the year, old equipment with a cost of $60,000 and a net carrying value of $53,000 was sold for cash at a gain of $10,000. New equipment was purchased for $100,000. Shown below are selected closing balances for last year and the current year. Last Year Current Year Cash $ 39,000 $ 85,000 Madden's cash inflow from operating activities for the current year is","table":[["Accounts receivable, net                    43,000","37,000"],["Inventories                                 93,000","105,000"],["Equipment                                 360,000","400,000"],["Accumulated depreciation-equipment        70,000","83,000"],["Accounts payable                          22,000","19,000"],["Notes payable                             100,000","100,000"],["Common stock                              250,000","250,000"],["Retained earnings                         93,000","175,000"]],"tail":"","options":{"A":"$93,000.","B":"$83,000.","C":"$63,000.","D":"$73,000."},"correct":"B","correctExplanation":"The net cash flow from operating activities, calculated using the indirect method, is: Net income $ 82,000 Adjustments to reconcile net income to net cash provided by operating activities: Depreciation expense* 20,000 Gain on sale of equipment (10,000) Decrease in accounts receivable 6,000 Increase in inventory (12,000) Decrease in accounts payable (3,000) Net cash provided by operating activities $83,000 *Depreciation expense is calculated as follows: The Accumulated Depreciation account had a balance of $70,000 CR at the end of the previous year. When the old equipment was sold, it had a cost of $60,000 and a net carrying value of $53,000. Therefore, the accumulated depreciation assigned to that asset was $7,000 at the time of sale. When the old equipment was sold, the accumulated depreciation assigned to it was reversed, resulting in a debit of $7,000 to the Accumulated Depreciation account. The new balance in the Accumulated Depreciation account after the sale of the equipment was recorded was $63,000 CR. Since the credit balance in the Accumulated Depreciation account was $83,000 at the end of the current year, depreciation expense recorded for the year must have been $20,000 ($83,000 − $63,000).","explanations":{"A":"This answer results from not subtracting the gain on the sale of equipment from net income. The gain on the sale of the equipment is given in the problem. Since it is included in net income but it is a part of investing activities, it needs to be subtracted from net income when calculating net cash flow from operating activities using the indirect method. Please see the correct answer explanation for more information.","C":"This answer results from not adding back depreciation expense for the year to net income. Net income has been reduced by depreciation expense, a noncash transaction, so that needs to be added when calculating net cash flow from operating activities using the indirect method. Please see the correct answer explanation for more information.","D":"This answer results from not adding back depreciation expense for the year to net income and not subtracting the gain on the sale of equipment from net income. The gain on the sale of the equipment is given in the problem. Since it is included in net income but it is a part of investing activities, it needs to be subtracted from net income when calculating net cash flow from operating activities using the indirect method. Net income has also been reduced by depreciation expense, a noncash transaction, so that needs to be added. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":38},{"num":80,"id":"HOCK CMA P1.A.1.06010","topic":"The Indirect Method","question":"A condensed balance sheet for Memorable Events Rentals, Inc. is below: 20X5 20X4 Accounts payable $ 79,000 $ 89,000 Common stock $ 15,000 $ 15,000 Total equity $140,000 $ 95,000 The company did not pay any dividends during 20X5, did not sell any equipment during the year, and purchased equipment for $30,000. Depreciation expensed was $28,000. What was the company's net cash provided by operating activities for 20X5?","intro":"A condensed balance sheet for Memorable Events Rentals, Inc.","table":[["Cash and cash equivalents             $210,000","$188,000"],["Accounts receivable                   98,000","95,000"],["Property, plant, and equipment        250,000","220,000"],["Accumulated depreciation-PP&E         (125,000)","(97,000)"],["Total assets                          $433,000","$406,000"],["Other liabilities                     35,000","42,000"],["Bonds payable (par value)              175,000","175,000"],["Premium on bonds payable                4,000","5,000"],["Total liabilities                     $293,000","$311,000"],["Additional paid-in capital            65,000","65,000"],["Retained earnings                      60,000","15,000"]],"tail":"is below: 20X5 20X4 Accounts payable $ 79,000 $ 89,000 Common stock $ 15,000 $ 15,000 Total equity $140,000 $ 95,000 The company did not pay any dividends during 20X5, did not sell any equipment during the year, and purchased equipment for $30,000. Depreciation expensed was $28,000. What was the company's net cash provided by operating activities for 20X5?","options":{"A":"$22,000.","B":"$54,000.","C":"$52,000.","D":"$24,000."},"correct":"C","correctExplanation":"Net cash provided by operating activities was as follows: Net income $45,000 * Adjustments to reconcile net income to net cash provided by operating activities: Depreciation expense 28,000 Amortization of premium-bonds payable (1,000) ** Increase in accounts receivable (3,000) Decrease in accounts payable (10,000) Decrease in other liabilities (7,000) Net cash provided by operating activities $52,000 * Since no dividends were paid during 20X5, net income for 20X5 is the difference between retained earnings at the end of 20X5 and retained earnings at the end of 20X4. ** The amortization of the premium on bonds payable for 20X5 is calculated as the amount of the decrease in the credit balance in the account Premium on Bonds Payable between 20X4 and 20X5.","explanations":{"A":"This answer results from including the increase in property, plant, and equipment as part of (a decrease in) net cash provided by operating activities. Cash outflows for purchases and inflows for sales of equipment or any fixed asset are cash flows from investing activities, not cash flows from operating activities. Please see the correct answer explanation for more information.","B":"This answer results from adding the amortization of the premium on bonds payable to net income instead of deducting it from net income. When a bond is sold at a premium, the issuer receives more than the face (par) value of the bond when it is originally issued. The premium increases the initial valuation of the bond liability on the issuer’s balance sheet. The issuer amortizes the premium over the life of the bond as an adjustment to interest expense, and the amortization is a non-cash transaction. As the premium is amortized, the amortization decreases reported interest expense and decreases the net carrying value of the liability. A decrease in reported interest expense increases reported net income. Therefore, to reverse the effect of the increase to net income, the amortization of the premium should be deducted from net income when calculating net cash provided by operating activities. Please see the correct answer explanation for more information.","D":"This answer results from two errors: 1. Including the increase in property, plant, and equipment as part of (a decrease in) net cash provided by operating activities. Cash outflows for purchases and inflows for sales of equipment or any fixed asset are cash flows from investing activities, not cash flows from operating activities. 2. Adding the amortization of the premium on bonds payable to net income instead of deducting it from net income. When a bond is sold at a premium, the issuer receives more than the face (par) value of the bond when it is originally issued. The premium increases the initial valuation of the bond liability on the issuer’s balance sheet. The issuer amortizes the premium over the life of the bond as an adjustment to interest expense, and the amortization is a non-cash transaction. As the premium is amortized, the amortization decreases reported interest expense and decreases the net carrying value of the liability. A decrease in reported interest expense increases reported net income. Therefore, to reverse the effect of the increase to net income, the amortization of the premium should be deducted from net income when calculating net cash provided by operating activities. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":57},{"num":81,"id":"CIA 1194 P4 Q70","topic":"The Indirect Method","question":"A company has purchased an asset with a 10-year useful life. It will use an accelerated depreciation method for tax purposes. For reporting purposes, it will use straight-line depreciation because this method is believed to reflect better the usage of the asset over its economic life. When applying the indirect method of calculating an entity's net operating cash flows, using financial statements prepared for tax purposes rather than accrual accounting purposes will result in","intro":"","table":[],"tail":"","options":{"A":"An overstatement of cash flows throughout the economic life of depreciable assets.","B":"No effect on cash flow amounts.","C":"An understatement of cash flows throughout the economic life of depreciable assets.","D":"An overstatement of cash flows in the early years and then an understatement of cash flows in the later years of the economic life of depreciable assets."},"correct":"B","correctExplanation":"The amount of cash paid and received does not change because of anything reported in financial statements, whether for financial reporting purposes or on the income tax return. Cash flow is cash flow. If the net cash flow from operating activities is calculated using the financial statements, though, the numbers used to arrive at the net operating cash flow will be different from the numbers that would be used if the income tax return were used to calculate the cash flow, especially if a different method of depreciation is used for financial reporting purposes than for tax purposes. The two net incomes will be different, and the two depreciation amounts will be different. However, when the depreciation is added back to net income for each to calculate net cash from operating activities, net cash from operating activities will be exactly the same. If, for example, net income is $800,000 when $150,000 of straight-line depreciation is taken, net income will be $750,000 if $200,000 of accelerated depreciation is taken. Net cash provided by operating activities under both scenarios will be as follows (if no other adjustments to net income are needed): Straight-line Accelerated Net income 800,000 750,000 Plus: depreciation 150,000 200,000 Net cash provided by operating activities 950,000 950,000","explanations":{"A":"The amount of cash paid and received does not change because of anything reported in financial statements, whether for financial reporting purposes or on the income tax return. Cash flow is cash flow. Please see the correct answer explanation for more information.","C":"The amount of cash paid and received does not change because of anything reported in financial statements, whether for financial reporting purposes or on the income tax return. Cash flow is cash flow. Please see the correct answer explanation for more information.","D":"The amount of cash paid and received does not change because of anything reported in financial statements, whether for financial reporting purposes or on the income tax return. Cash flow is cash flow. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":29},{"num":82,"id":"CMA 1294 P2 Q20","topic":"The Indirect Method","question":"The net income for Cypress Inc. was $3,000,000 for the year ended December 31. Additional information is as follows: The net cash provided by operating activities in the statement of cash flows for the year ended December 31 should be","intro":"The net income for Cypress Inc. was $3,000,000 for the year ended December 31. Additional information is as follows: The net cash provided by operating activities in the statement of cash flows for the year ended December 31 should be","table":[["Depreciation on fixed assets","$1,500,000"],["Gain from cash sale of land","200,000"],["Increase in accounts payable","300,000"],["Dividends paid on preferred stock","400,000"]],"tail":"","options":{"A":"$4,600,000","B":"$4,800,000","C":"$4,500,000","D":"$4,200,000"},"correct":"A","correctExplanation":"In order to calculate the cash flows from operating activities under the indirect method, we must adjust net income for noncash and non-operating items. In this question, net income is $3,000,000. The adjustments that we need to make are: 1) add back $1,500,000 of depreciation expense (noncash), 2) subtract the $200,000 gain from sale of land (investing activity), and 3) add the $300,000 increase in accounts payable. The dividends paid are not included in this calculation because (1) the payment of dividends is not an operating activity but is instead a financing activity; and (2) dividends paid are not included in net income, so there is no reason to reverse their effect on net income.","explanations":{"B":"This answer does not include the adjustment for the gain on the sale of land. The gain is included in the calculation of net income, but cash received from the sale of land is classified on a statement of cash flows as an investing activity, not an operating activity. So the gain needs to be backed out from net income when calculating net cash provided by operating activities using the indirect method. Please see the correct answer explanation for more information.","C":"This answer does not include the adjustments for the gain on the sale of land or the increase in accounts payable. The gain is included in the calculation of net income, but cash received from the sale of land is classified on a statement of cash flows as an investing activity, not an operating activity. So the gain needs to be backed out from net income when calculating net cash provided by operating activities using the indirect method. The increase in accounts payable represents a cash inflow, so it needs to be added to net income when calculating net cash provided by operating activities using the indirect method. Please see the correct answer explanation for more information.","D":"This answer incorrectly includes a deduction from net income for the dividends paid. Payment of dividends is a financing activity. Furthermore, dividends paid are not included in net income, so there is no reason to reverse their effect on net income when calculating net cash provided by operating activities using the indirect method. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":80},{"num":83,"id":"ICMA 1310.P2.055","topic":"The Indirect Method","question":"Garnett Company's year-end income statement shows the following. Selling and general expenses (including Income tax expense (including Net income $ 870,000 During the year, Garnett's noncash current assets rose by $100,000, and current liabilities increased by $150,000. On its statement of cash flows, Garnett would report Cash Provided by Operating Activities of","intro":"Garnett Company's year-end income statement shows the following. Selling and general expenses (including Income tax expense (including Net income $ 870,000 During the year, Garnett's noncash current assets rose by $100,000, and current liabilities increased by $150,000. On its statement of cash flows, Garnett would report Cash Provided by Operating Activities of","table":[["Revenues","$5,000,000"],["depreciation expense of $200,000)","3,800,000"],["Interest expense","50,000"],["Gain on sale of equipment","40,000"],["deferred tax expense of $30,000)","320,000"]],"tail":"","options":{"A":"$1,160,000.","B":"$1,190,000.","C":"$1,110,000.","D":"$1,080,000."},"correct":"C","correctExplanation":"Cash provided by operating activities is calculated as follows: Net income $ 870,000 Adjustments to reconcile net income to net cash provided by operating activities: Depreciation expense 200,000 Increase in current liabilities 150,000 Increase in deferred tax liability 30,000 Gain on sale of equipment ( 40,000) Increase in current assets (100,000) Net cash provided by operating activities $1,110,000","explanations":{"A":"This answer results from two errors: 1. Omitting the increase in long-term deferred tax liability from the calculation of cash provided by operating activities. The deferred tax expense was a debit to the deferred tax expense account and a credit to the deferred long-term taxes liability account, increasing the balance in the liability account. For purposes of calculating cash provided by operating activities, the amount of the increase in the liability account should be treated the same way as an increase in accounts payable would be treated: as an increase to cash provided by operating activities. 2. Adding the gain on the sale of equipment to net income to calculate operating cash flow instead of subtracting the gain from net income. The gain is included in net income, but the gain is an investing cash flow, not an operating cash flow. Therefore, the gain should be subtracted from net income in calculating cash provided by operating activities. Please see the correct answer explanation for more information.","B":"This answer results from adding the gain on the sale of equipment to net income to calculate operating cash flow instead of subtracting the gain from net income. The gain is included in net income, but the gain is an investing cash flow, not an operating cash flow. Therefore, the gain should be subtracted from net income in calculating cash provided by operating activities. Please see the correct answer explanation for more information.","D":"This answer results from omitting the increase in long-term deferred tax liability from the calculation of cash provided by operating activities. The deferred tax expense was a debit to the deferred tax expense account and a credit to the deferred long-term taxes liability account, increasing the balance in the liability account. For purposes of calculating cash provided by operating activities, the amount of the increase in the liability account should be treated the same way as an increase in accounts payable would be treated: as an increase to cash provided by operating activities. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":37},{"num":84,"id":"HOCK CMA P1.A.1.06007","topic":"The Indirect Method","question":"McClain Sales Company’s income statement for 20X4 and year-end balance sheets for 20X3 and 20X4 are below. What amount of net cash provided by operating activities, calculated using the indirect method, will McClain report in its statement of cash flows for 20X4? INCOME STATEMENT: Operating expenses (including $10,500 of credit Operating income $ 998,000 Loss on sale of equipment (7,000) Income before taxes $ 986,000 Provision for income taxes 296,000 Net income $ 690,000 BALANCE SHEETS: 20X3 20X4 Assets Cash and cash $400,000 $ 809,000 equivalents Accounts receivable (gross) Allowance for credit losses Accounts $308,000 $ 321,500 receivable (net) Inventory 195,000 207,000 Prepaid expenses 12,000 14,000 Fixed assets-gross 120,000 450,000 Accumulated depreciation Liabilities Equity Common stock $ 10,000 $ 10,000 Additional paid-in capital Total liabilities & equity Other information: McClain declared and paid a dividend of $71,500 in 20X4. Equipment with a cost of $25,000 and a net book value of $10,000 was sold at a $7,000 loss for $3,000 during the year. Equipment costing $355,000 was purchased during the year. Write-offs of receivables during 20X4 totaled $9,000. Included in operating expenses is depreciation expense of $28,000 and credit loss expense of $10,500.","intro":"McClain Sales Company’s income statement for 20X4 and year-end balance sheets for 20X3 and 20X4 are below. What amount of net cash provided by operating activities, calculated using the indirect method, will McClain report in its statement of cash flows for 20X4? INCOME STATEMENT: Operating expenses (including $10,500 of credit Operating income $ 998,000 Loss on sale of equipment (7,000) Income before taxes $ 986,000 Provision for income taxes 296,000 Net income $ 690,000 BALANCE SHEETS: 20X3 20X4 Assets Cash and cash $400,000 $ 809,000 equivalents Accounts receivable (gross) Allowance for credit losses Accounts $308,000 $ 321,500 receivable (net) Inventory 195,000 207,000 Prepaid expenses 12,000 14,000 Fixed assets-gross 120,000 450,000 Accumulated depreciation Liabilities Equity Common stock $ 10,000 $ 10,000 Additional paid-in capital Total liabilities & equity Other information: McClain declared and paid a dividend of $71,500 in 20X4. Equipment with a cost of $25,000 and a net book value of $10,000 was sold at a $7,000 loss for $3,000 during the year. Equipment costing $355,000 was purchased during the year. Write-offs of receivables during 20X4 totaled $9,000. Included in operating expenses is depreciation expense of $28,000 and credit loss expense of $10,500.","table":[["Sales revenue","$4,000,000"],["Cost of goods sold","1,600,000"],["Gross profit","$2,400,000"],["loss expense and $28,000 of depreciation)","1,402,000"],["Interest and dividend income","16,000"],["Interest expense","(21,000)"],["$320,000","$335,000"],["(12,000)","(13,500)"],["(62,000)","(75,000)"],["Net fixed assets                        58,000","375,000"],["Total assets                           $973,000","$1,726,500"],["Accounts payable                          $215,000","$225,000"],["Long-term debt                             300,000","425,000"],["Total liabilities                        $515,000","$650,000"],["200,000","200,000"],["Retained earnings                          248,000","866,500"],["Total equity                             $458,000","$1,076,500"],["$973,000","$1,726,500"]],"tail":"","options":{"A":"$715,000.","B":"$707,500.","C":"$779,000.","D":"$706,000."},"correct":"B","correctExplanation":"Net cash provided by operating activities calculated according to the direct method is as follows. Net income $690,000 Adjustments to reconcile net income to net cash provided by operating activities: Depreciation 28,000 Loss on sale of equipment 7,000 Increase in accounts payable 10,000 Decrease in net accounts receivable (13,500) Increase in inventory (12,000) Increase in prepaid expenses (2,000) Net cash provided by operating activities $707,500","explanations":{"A":"This answer results from two errors: • Using the increase in gross accounts receivable instead of the increase in net accounts receivable to calculate net cash provided by operating activities. • Adding the receivables written off during the year to net income. When the operating activities section is being prepared according to the indirect method, the amount of change in net accounts receivable is used to calculate net cash provided by operating activities, not the amount of change in gross accounts receivable. Using net accounts receivable incorporates any adjustments needed for credit loss expense or account write-offs, both of which are noncash transactions, and no further adjustment is needed. Please see the correct answer explanation for more information.","C":"This answer results from adding the dividend to net income as part of the calculations for net cash provided by operating activities. Dividends paid, a cash outflow from financing activities, do not reduce net income, and so they do not need to be added back to net income to calculate net cash provided by operating activities. Please see the correct answer explanation for more information.","D":"This answer results from using the increase in gross accounts receivable instead of the increase in net accounts receivable to calculate net cash provided by operating activities. When the operating activities section is being prepared according to the indirect method, the amount of change in net accounts receivable is used to calculate net cash provided by operating activities, not the amount of change in gross accounts receivable. Using net accounts receivable incorporates any adjustments needed for credit loss expense or account write-offs, both of which are noncash transactions, and no further adjustment is needed. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":43},{"num":85,"id":"ICMA 10Q.2.003","topic":"The Indirect Method","question":"In calculating net cash flow from operating activities using the indirect method, all of the following items would be either added or subtracted from net income except:","intro":"","table":[],"tail":"","options":{"A":"gain on sale of equipment.","B":"amortization of an intangible asset.","C":"dividends paid.","D":"depreciation."},"correct":"C","correctExplanation":"Dividends are not reported on the income statement, and so net income is not adjusted for them when using the indirect method to calculate net cash provided by operating activities. Dividends paid are classified as a financing activity on the statement of cash flows.","explanations":{"A":"The gain on the sale of equipment is subtracted from net income under the indirect method of preparing the statement of cash flows. The gain is part of the cash received from the sale of the equipment, and cash received from the sale of equipment is a cash inflow from investing activities. Thus, the gain is not part of operating cash flow and should be deducted from net income when calculating net cash provided by operating activities.","B":"Amortization of an intangible asset is added back to net income under the indirect method of preparing the statement of cash flows. The amortization is a noncash expense that reduces net income, so it needs to be added back to net income when calculating net cash provided by operating activities under the indirect method.","D":"Depreciation is added back to net income under the indirect method of preparing the statement of cash flows. Depreciation is a noncash expense that reduces net income, so it needs to be added back to net income when calculating net cash provided by operating activities under the indirect method."},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":87},{"num":86,"id":"HTB 1.1.012","topic":"The Indirect Method","question":"An accountant with Nasbo Enterprises Inc. has gathered the following information in order to prepare the statement of cash flows for the current year. Net income of $456,900 includes a deduction of $45,600 for depreciation expense. The company issued $300,000 of dividends this year and purchased one new building for $275,000. The balance sheets from the current period and prior period included the following balances. Prior Year Current Year Accounts receivable, net $ 56,860 $ 45,300 Using the indirect method, what is the amount of cash provided by operating activities?","intro":"An accountant with Nasbo Enterprises Inc.","table":[["Accounts payable                12,900","10,745"],["Inventory                       186,700","194,320"]],"tail":"has gathered the following information in order to prepare the statement of cash flows for the current year. Net income of $456,900 includes a deduction of $45,600 for depreciation expense. The company issued $300,000 of dividends this year and purchased one new building for $275,000. The balance sheets from the current period and prior period included the following balances. Prior Year Current Year Accounts receivable, net $ 56,860 $ 45,300 Using the indirect method, what is the amount of cash provided by operating activities?","options":{"A":"$202,500","B":"$504,285","C":"$521,405","D":"$405,205"},"correct":"B","correctExplanation":"Cash provided by operating activities is: Net income $ 456,900 Adjustments to reconcile net income to net cash provided by operating activities: Depreciation 45,600 Decrease in accounts receivable 11,560 Decrease in accounts payable (2,155) Increase in inventory (7,620) Net cash provided by operating activities $504,285","explanations":{"A":"This is net income minus dividends paid plus depreciation. Dividends paid are not part of the calculation of net cash provided by operating activities because dividends paid are classified as a financing activity. Furthermore, depreciation is not the only adjustment needed to reconcile net income to net cash provided by operating activities. Please see the correct answer explanation for more information.","C":"This answer results from several errors: • The decrease in accounts payable is omitted from the adjustments needed to reconcile net income to net cash provided by operating activities • The increase in inventory is added to net income instead of deducted from it. • The purchase of the new building deducted from net income, although it is included as $275 instead of $275,000. The purchase of the new building should not be included in the calculation of net cash provided by operating activities at all, because it is classified as an investment activity on the statement of cash flows. Please see the correct answer explanation for more information.","D":"This answer results from incorrectly making three of the adjustments to net income needed to reconcile it to net cash provided by operating activities: • The depreciation expense is deducted from net income instead of added to it. • The decrease in accounts receivable is deducted from net income instead of added to it. • The increase in inventory is added to net income instead of deducted from it. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":85},{"num":87,"id":"HTB 1.1.013","topic":"The Indirect Method","question":"Selected financial information for Kristina Company for the year just ended is shown below. Assuming the indirect method is used, Kristina’s cash flow from operating activities for the year is","intro":"Selected financial information for Kristina Company for the year just ended is shown below. Assuming the indirect method is used, Kristina’s cash flow from operating activities for the year is","table":[["Net income","$2,000,000"],["Increase in accounts receivable","300,000"],["Decrease in inventory","100,000"],["Increase in accounts payable","200,000"],["Depreciation expense","400,000"],["Gain on the sale of available-for-sale debt securities","700,000"],["Cash received from the issue of common stock","800,000"],["Cash paid for dividends","80,000"],["Cash paid for the acquisition of land","1,500,000"],["Cash received from the sale of available-for-sale debt securities","2,800,000"]],"tail":"","options":{"A":"$2,000,000","B":"$3,100,000","C":"$1,700,000","D":"$2,400,000"},"correct":"C","correctExplanation":"Net cash flow from operating activities is: Net income $ 2,000,000 Adjustments to reconcile net income to net cash provided by operating activities: Depreciation expense 400,000 Gain on sale of AFS debt securities (700,000) Decrease in inventory 100,000 Increase in accounts payable 200,000 Increase in accounts receivable (300,000) Net cash provided by operating activities $1,700,000","explanations":{"A":"This answer results from not deducting the increase in accounts receivable from net income. Please see the correct answer explanation for more information.","B":"This answer results from adding the gain on the sale of available-for-sale debt securities to net income instead of deducting it from net income. The gain is part of the cash received from the sale of the securities, and cash received from the sale of securities is a cash inflow from investing activities. Thus, the gain is not part of operating cash flow and should be deducted from net income when calculating net cash provided by operating activities. Please see the correct answer explanation for more information.","D":"This answer results from not deducting the gain on the sale of available-for-sale debt securities from net income. The gain is part of the cash received from the sale of the securities, and cash received from the sale of securities is a cash inflow from investing activities. Thus, the gain is not part of operating cash flow and should be deducted from net income when calculating net cash provided by operating activities. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":64},{"num":88,"id":"HOCK CMA P1.A.1.06008","topic":"The Indirect Method","question":"A condensed balance sheet for Click Manufacturing is below: 20X5 20X4 Accounts payable $ 79,000 $ 89,000 Common stock $ 15,000 $ 15,000 The company did not pay any dividends during 20X5, did not sell any equipment during the year, and purchased equipment for $30,000. Depreciation expensed was $28,000. What was the company's net cash provided by operating activities for 20X5?","intro":"A condensed balance sheet for Click Manufacturing is below:","table":[["Cash and cash equivalents                $210,000","$188,000"],["Accounts receivable                      98,000","95,000"],["Held-to-maturity debt securities         75,000","75,000"],["Premium-HTM debt securities              8,000","9,000"],["Property, plant, and equipment           250,000","220,000"],["Accumulated depreciation-PP&E            (125,000)","(97,000)"],["Total assets                             $516,000","$490,000"],["Other liabilities                        35,000","42,000"],["Long-term debt                            175,000","160,000"],["Total liabilities                        $289,000","$291,000"],["Additional paid-in capital              65,000","65,000"],["Retained earnings                        147,000","119,000"],["Total equity                            $227,000","$199,000"]],"tail":"20X5 20X4 Accounts payable $ 79,000 $ 89,000 Common stock $ 15,000 $ 15,000 The company did not pay any dividends during 20X5, did not sell any equipment during the year, and purchased equipment for $30,000. Depreciation expensed was $28,000. What was the company's net cash provided by operating activities for 20X5?","options":{"A":"$5,000.","B":"$7,000.","C":"$35,000.","D":"$37,000."},"correct":"D","correctExplanation":"Net cash provided by operating activities was as follows: Net income $28,000 * Adjustments to reconcile net income to net cash provided by operating activities: Depreciation expense 28,000 Amortization of premium-HTM debt securities 1,000 ** Increase in accounts receivable (3,000) Decrease in accounts payable (10,000) Decrease in other liabilities (7,000) Net cash provided by operating activities $37,000 * Since no dividends were paid during 20X5, net income for 20X5 is the difference between retained earnings at the end of 20X5 and retained earnings at the end of 20X4. ** Since the company did not sell or purchase any HTM securities during the year, amortization of premium on HTM debt securities for 20X5 is calculated as the amount of the decrease in the debit balance in the account Premium-HTM Debt Securities between 20X4 and 20X5.","explanations":{"A":"This answer results from two errors: 1. Including the increase in property, plant, and equipment as part of (a decrease in) net cash provided by operating activities. Cash outflows for purchases and inflows for sales of equipment or any fixed asset are cash flows from investing activities, not cash flows from operating activities. 2. Deducting the amortization of the premium on HTM debt securities from net income instead of adding it to net income. When a bond is purchased at a premium as an investment, the investor pays more than the face (par) value of the bond. The premium increases the initial valuation of the investment on the investor’s balance sheet. The investor amortizes the premium over the life of the bond as an adjustment to interest income, and the amortization is a non-cash transaction. As the premium is amortized, the amortization decreases reported interest income and decreases the net carrying value of the asset. A decrease in reported interest income also decreases reported net income. Therefore, to reverse the effect of the decrease to net income, the amortization of the premium paid for the investment should be added to net income when calculating net cash provided by operating activities. Please see the correct answer explanation for more information.","B":"This answer results from including the increase in property, plant, and equipment as part of (a decrease in) net cash provided by operating activities. Cash outflows for purchases and inflows for sales of equipment or any fixed asset are cash flows from investing activities, not cash flows from operating activities. Please see the correct answer explanation for more information.","C":"This answer results from deducting the amortization of the premium on HTM debt securities from net income instead of adding it to net income. When a bond is purchased at a premium as an investment, the investor pays more than the face (par) value of the bond. The premium increases the initial valuation of the investment on the investor’s balance sheet. The investor amortizes the premium over the life of the bond as an adjustment to interest income, and the amortization is a non- cash transaction. As the premium is amortized, the amortization decreases reported interest income and decreases the net carrying value of the asset. A decrease in reported interest income also decreases reported net income. Therefore, to reverse the effect of the decrease to net income, the amortization of the premium paid for the investment should be added to net income when calculating net cash provided by operating activities. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":50},{"num":89,"id":"ICMA 13.P2.014","topic":"The Indirect Method","question":"To calculate cash flows using the indirect method, which one of the following items must be added back to net income?","intro":"","table":[],"tail":"","options":{"A":"Interest income.","B":"Depreciation expense.","C":"Revenue.","D":"Marketing expense."},"correct":"B","correctExplanation":"Under the indirect method, depreciation expense is added back to net income because it is a non-cash expense item that reduces net income.","explanations":{"A":"Under the indirect method, interest income is not added back to net income. Interest income is included in net income and it is appropriately included in net cash provided by operating activities as well, so no adjustment is necessary.","C":"Under the indirect method, revenue is not added back to net income. Revenue is included in net income and it is appropriately included in net cash provided by operating activities as well, so no adjustment is necessary.","D":"Under the indirect method, marketing expense is not added back to net income. Marketing expense is a deduction to net income, and it is appropriately included as a deduction also in net cash provided by operating activities."},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":96},{"num":90,"id":"CMA 1295 P2 Q1","topic":"The Indirect Method","question":"Depreciation expense is added to net income under the indirect method of preparing a statement of cash flows in order to","intro":"","table":[],"tail":"","options":{"A":"calculate net book value.","B":"report all assets at gross book value.","C":"ensure depreciation has been properly reported.","D":"reverse noncash charges deducted from net income."},"correct":"D","correctExplanation":"Because depreciation is a noncash expense, it should not be included in the statement of cash flows. However, it is included in net income as a reduction to net income and therefore needs to be reversed by adding it back to net income to calculate net cash provided by operating activities under the indirect method.","explanations":{"A":"The adding back of depreciation expense to net income is not done to calculate net book value. Please see the correct answer explanation for more information.","B":"The reporting of assets at gross book value is not relevant to the statement of cash flows. Please see the correct answer explanation for more information.","C":"The adding back of depreciation expense to net income is not done to ensure that depreciation has been properly recorded. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":89},{"num":91,"id":"HOCK CMA P1.A.1.06001","topic":"The Indirect Method","question":"The income statement for Hometown Sales Company for 20X4 is below: Nonoperating gains/(losses): Operating expenses include depreciation expense of $35,000. Selected items from Hometown Sales Company's balance sheets for 20X4 and 20X3 and the amounts of change for each item from 20X3 to 20X4 are as follows: Amount 20X4 20X3 of Change Accounts receivable (net) $58,700 $65,000 $(6,300) Hometown Sales Company's net cash provided by operating activities during 20X4 using the indirect method was","intro":"The income statement for Hometown Sales Company for 20X4 is below: Nonoperating gains/(losses): Operating expenses include depreciation expense of $35,000. Selected items from Hometown Sales Company's balance sheets for 20X4 and 20X3 and the amounts of change for each item from 20X3 to 20X4 are as follows: Amount 20X4 20X3 of Change Accounts receivable (net) $58,700 $65,000 $(6,300) Hometown Sales Company's net cash provided by operating activities during 20X4 using the indirect method was","table":[["Sales","$950,000"],["Cost of goods sold","560,000"],["Gross profit","$390,000"],["Operating expenses","215,000"],["Operating income","$175,000"],["Interest expense","(4,000)"],["Gain on sale of equipment","20,000"],["Loss on sale of building         (35,000)","(15,000)"],["Income before taxes","$156,000"],["Income tax provision","47,000"],["Net income","$109,000"],["Prepaid expenses               19,000        17,500","1,500"],["Inventory                         28,800      23,000","5,800"],["Accounts payable                  25,500      21,800","3,700"],["Accrued interest expense          500         300","200"],["Accrued other liabilities         7,000       8,700","(1,700)"]],"tail":"","options":{"A":"$164,000.","B":"$157,800.","C":"$160,200.","D":"$245,200."},"correct":"C","correctExplanation":"Net cash provided by operating activities is calculated as follows: Net income $109,000 Adjustments to reconcile net income to cash provided by operating activities: Depreciation expense $35,000 Net (gain)/loss on asset sales 15,000 Decrease in net accounts receivable 6,300 Increase in prepaid expenses (1,500) Increase in inventory (5,800) Increase in accounts payable 3,700 Increase in accrued interest expense 200 Decrease in accrued liabilities (1,700) Net cash provided by operating activities $160,200","explanations":{"A":"This answer results from not including the cash paid for interest as a cash flow from operating activities. The interest expense is incorrectly added back to net income, and the adjustment for the amount of change in accrued interest expense is incorrectly omitted from the calculation. Cash paid for interest is reported as a cash flow from operating activities on the statement of cash flows. Therefore, the interest expense should not be added back to net income, and an adjustment should be made for the increase in accrued interest expense in order to include the interest as cash paid for interest instead of as interest expensed. Please see the correct answer explanation for more information.","B":"This answer results from making the adjustments to net income for changes in operating asset and liability balances in reverse: • Subtracting decreases in assets from net income instead of adding them to net income • Adding increases in assets to net income instead of subtracting them from net income • Subtracting increases in liabilities from net income instead of adding them to net income • Adding decreases in liabilities to net income instead of subtracting them from net income. Please see the correct answer explanation for more information.","D":"This answer results from omitting the gain on the sale of the equipment and the loss on the sale of the building from the adjustments. The gain and loss need to be backed out of net income because they are part of cash flows from investing activities instead of cash flows from operating activities. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":69},{"num":92,"id":"ICMA 10Q.2.009","topic":"The Indirect Method","question":"Appalachian Outfitters Inc., a mail order supplier of camping gear, is putting together its current year Statement of Cash Flows. A comparison of the company’s year-end balance sheet to the prior year’s balance sheet shows the following changes from a year ago. Assets Cash and cash equivalents $ (600) Liabilities and Equity Accounts payable $ 250 The firm’s dividend payout ratio, that is, the percentage of earnings available to common stockholders that are paid out to them as dividends, is 20%. During the current year, net cash provided by operations is","intro":"Appalachian Outfitters Inc., a mail order supplier of camping gear, is putting together its current year Statement of Cash Flows. A comparison of the company’s year-end balance sheet to the prior year’s balance sheet shows the following changes from a year ago. Assets Cash and cash equivalents $ (600) Liabilities and Equity Accounts payable $ 250 The firm’s dividend payout ratio, that is, the percentage of earnings available to common stockholders that are paid out to them as dividends, is 20%. During the current year, net cash provided by operations is","table":[["Accounts receivable","200"],["Inventories","(100)"],["Gross fixed assets","4,600"],["Accumulated depreciation","(500)"],["Total","$3,600"],["Accruals","50"],["Long-term note","(300)"],["Long-term debt","1,400"],["Common stock","0"],["Retained earnings","2,200"],["Total","$3,600"]],"tail":"","options":{"A":"$2,900.","B":"$3,450.","C":"$4,050.","D":"$3,050."},"correct":"B","correctExplanation":"The first thing to do is to calculate what net income was for the period. This can be done using the dividend payout ratio of 20%, which means that 80%, of the earnings (100% − 20%) were retained by the company. If retained earnings increased by $2,200, that means that the after tax and pre-dividend income for the company is calculated as $2,200 ÷ (1 − Payout Ratio). This is $2,200 ÷ 0.8, which is equal to $2,750. Now that the company's net income is known, the net cash provided by operating activities can be calculated as follows: Net income $ 2,750 Adjustments to reconcile net income to net cash provided by operating activities: Depreciation expense 500 * Decrease in inventories 100 Increase in accounts payable 250 Increase in accruals 50 Increase in accounts receivable (200) Net cash provided by operating activities $3,450 *Accumulated depreciation is a contra-asset account that carries a negative (credit) balance in the asset section of the balance sheet. The parentheses around the amount of change in accumulated depreciation in the problem indicates that the credit balance in that account increased during the year due to 500 of depreciation expense, a noncash expense, that was recorded.","explanations":{"A":"This answer results from using the net increase in retained earnings during the year as the net income for the period. Net income increases retained earnings, but dividends paid decrease retained earnings. Dividends paid were 20% of net income, so the net increase in retained earnings ($2,200) divided by 100% − 20%, or 0.80, is the net income for the period. Please see the correct answer explanation for more information.","C":"This answer results from adding the decrease in cash and cash equivalents to net income in the adjustments needed to reconcile net income to net cash provided by operating activities. The amount of change in cash and cash equivalents is not a part of the calculation of net cash provided by operating activities. Instead, it is the amount to which the sum of net cash provided by operating, investing, and financing activities needs to reconcile. Please see the correct answer explanation for more information.","D":"This answer results from omitting three of the adjustments needed to reconcile net income to net cash provided by operating activities: • The decrease in inventories, which should be added to net income • The increase in accounts payable, which should be added to net income • The increase in accruals, which should be added to net income. Please see the correct answer explanation for more information."},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":33},{"num":93,"id":"CIA 0593 P4 Q44","topic":"The Indirect Method","question":"In preparing a statement of cash flows using the indirect method of determining cash flows from operating activities, what adjustment is needed to net income because of (1) an increase during the period in prepaid expenses and (2) the periodic amortization of premium on bonds payable?","intro":"","table":[],"tail":"","options":{"A":"(1) Deduct (2) Add","B":"(1) Add (2) Deduct","C":"(1) Add (2) Add","D":"(1) Deduct (2) Deduct"},"correct":"D","correctExplanation":"In calculating cash flows from operating activities under the indirect method, an increase in an asset account must be subtracted from net income because it represents cash paid out that is not on the income statement. Therefore, the increase in prepaid expenses will be a deduction from net income. The amortization of premium on bonds payable reduces interest expense and thus it increases net income without increasing cash. Therefore, it will also need to be deducted from net income.","explanations":{"A":"The amortization of premium on bonds payable reduces interest expense and thus it increases net income without increasing cash. Therefore, it will need to be deducted from net income in calculating cash flows from operating activities under the indirect method.","B":"An increase in an asset account must be subtracted from net income because it represents cash paid out that is not on the income statement. Therefore, the increase in prepaid expenses will be a deduction from net income in calculating cash flows from operating activities under the indirect method.","C":"An increase in an asset account must be deducted from net income in calculating cash flows from operating activities under the indirect method because it represents cash paid out that is not on the income statement. Therefore, the increase in prepaid expenses will be a deduction from net income. The amortization of premium on bonds payable reduces interest expense and thus it increases net income without increasing cash. Therefore, it will also need to be deducted from net income."},"studyUnit":"Study Unit 6: A.1. Operating Activities, the Indirect Method  for","pctCorrect":48},{"num":94,"id":"ICMA 18.P1.032","topic":"The Indirect Method","question":"Below are the balances for the following accounts on the balance sheet of a company as of the end of Year 20X2 and Year 20X1. Year 20X2 Year 20X1 Cash $1,000 $ 800 The marketable securities consist of money market funds, commercial paper, and U.S. Treasury Bills that all had a maturity of 3 months or less from the date they were acquired. The company has net income for Year 20X2 of $1,900, has no fixed assets, and has no investing or financing activities. Using the indirect method for preparing the cash flow statement, what is the balance in the marketable securities account as of the end of Year 20X2?","intro":"Below are the balances for the following accounts on the balance sheet of a company as of the end of Year 20X2 and Year 20X1.","table":[["Marketable securities              ?","7,200"],["Inventory                          500","500"],["Wages and salaries payable         2,000","2,500"],["Accounts payable                   1,300","1,000"],["Accounts receivable                5,000","6,000"],["Prepaids                           1,200","500"]],"tail":"Year 20X2 Year 20X1 Cash $1,000 $ 800 The marketable securities consist of money market funds, commercial paper, and U.S. Treasury Bills that all had a maturity of 3 months or less from the date they were acquired. The company has net income for Year 20X2 of $1,900, has no fixed assets, and has no investing or financing activities. Using the indirect method for preparing the cash flow statement, what is the balance in the marketable securities account as of the end of Year 20X2?","options":{"A":"$7,000.","B":"$9,000.","C":"$9,900.","D":"$8,800."},"correct":"B","correctExplanation":"In order to answer this question, it is necessary to understand three things: 1. \"Cash\" on the SCF is the total of cash and cash equivalents (also restricted forms of both, though that is not needed for this question). 2. Cash equivalents are marketable securities that had a maturity date of 3 months or less when they were acquired, and thus the marketable securities in this question are all classified as cash equivalents. 3. The net increase (decrease) in cash and cash equivalents on the SCF during the period from all sources—operating, investing, and financing activities—must reconcile to the amount of change in the sum of cash and cash equivalents from the end of the previous period to the end of the current period. Since there were no investing or financing activities, the net cash provided by operating activities is the same as the net increase (decrease) in cash and cash equivalents from all sources. Net cash provided by operating activities is calculated as follows: Net income $ 1,900 Adjustments to reconcile net income to net cash provided by operating activities: Decrease in accounts receivable 1,000 Increase in accounts payable 300 Increase in prepaids (700) Decrease in wages and salaries payable (500) Net cash provided by operating activities $2,000 Cash and cash equivalents at the end of 20X1 were $8,000
