<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0C0F14" />
<meta name="description" content="CMA US exam practice — questions, explanations, and 20-question mock exams." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="CMA Practice" />
<meta name="mobile-web-app-capable" content="yes" />
<title>CMA Practice · Part 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0C0F14; --surface:#141A22; --surface-2:#1B222C; --surface-3:#212B37;
    --border:#263040; --border-soft:#1E2732;
    --text:#E7EBF1; --text-dim:#8A94A6; --text-faint:#5C6675;
    --gold:#E5B567; --gold-soft:rgba(229,181,103,.13); --gold-line:rgba(229,181,103,.35);
    --emerald:#46D19E; --emerald-soft:rgba(70,209,158,.12); --emerald-line:rgba(70,209,158,.4);
    --rose:#F0778A; --rose-soft:rgba(240,119,138,.12); --rose-line:rgba(240,119,138,.4);
    --sans:'Inter',system-ui,-apple-system,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --r:14px; --r-sm:10px;
    --shadow:0 8px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--text);font-family:var(--sans);
    font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  .app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
    padding:0 18px calc(28px + env(safe-area-inset-bottom));position:relative}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .mono{font-family:var(--mono)}

  /* ---------- Top bar ---------- */
  .topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 72%,rgba(12,15,20,0));
    padding:calc(14px + env(safe-area-inset-top)) 0 10px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em}
  .brand .mark{width:30px;height:30px;border-radius:8px;background:var(--gold-soft);
    border:1px solid var(--gold-line);display:grid;place-items:center;color:var(--gold);
    font-family:var(--mono);font-weight:700;font-size:14px}
  .brand small{display:block;font-size:11px;font-weight:500;color:var(--text-dim);letter-spacing:.04em}
  .backbtn{margin-left:0;display:inline-flex;align-items:center;gap:7px;color:var(--text-dim);
    font-weight:600;font-size:14px;padding:8px 12px 8px 8px;border-radius:10px}
  .backbtn:active{background:var(--surface)}
  .spacer{flex:1}
  .pill{font-family:var(--mono);font-size:12px;color:var(--text-dim);
    border:1px solid var(--border);border-radius:999px;padding:5px 11px;background:var(--surface)}

  /* ---------- Home ---------- */
  .hero{padding:16px 2px 8px}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--gold);
    text-transform:uppercase;margin-bottom:14px}
  .hero h1{font-size:34px;line-height:1.05;letter-spacing:-.03em;font-weight:800}
  .hero h1 em{font-style:normal;color:var(--gold)}
  .hero p{color:var(--text-dim);margin-top:12px;font-size:15px;max-width:44ch}
  .stats{display:flex;gap:10px;margin:22px 0 8px}
  .stat{flex:1;background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--r);
    padding:14px 14px 12px}
  .stat .n{font-family:var(--mono);font-size:23px;font-weight:700;letter-spacing:-.02em}
  .stat .l{font-size:12px;color:var(--text-dim);margin-top:2px}

  .section-label{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--text-faint);margin:26px 2px 12px}

  .mode{display:block;width:100%;text-align:left;background:var(--surface);
    border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:12px;
    transition:transform .12s ease,border-color .18s ease,background .18s ease;position:relative;overflow:hidden}
  .mode:active{transform:scale(.985)}
  .mode.primary{border-color:var(--gold-line);background:
    linear-gradient(180deg,var(--gold-soft),transparent 60%),var(--surface)}
  .mode h3{font-size:18px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
  .mode h3 .ico{width:22px;height:22px;color:var(--gold);flex:0 0 auto}
  .mode p{color:var(--text-dim);font-size:14px;margin-top:6px;padding-right:30px}
  .mode .go{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--text-faint)}
  .mode.primary .go{color:var(--gold)}

  /* topic chips */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .chip{font-size:13px;color:var(--text-dim);background:var(--surface);border:1px solid var(--border-soft);
    border-radius:999px;padding:9px 13px;font-weight:500;transition:.15s;line-height:1.2}
  .chip .c{font-family:var(--mono);color:var(--text-faint);margin-left:6px;font-size:11px}
  .chip.on{color:var(--bg);background:var(--gold);border-color:var(--gold)}
  .chip.on .c{color:rgba(12,15,20,.6)}
  .chip:active{transform:scale(.96)}

  /* ---------- Question card ---------- */
  .progress-rail{display:flex;align-items:center;gap:12px;margin:6px 2px 16px}
  .bar{flex:1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .3s ease}
  .bar.exam > i{background:linear-gradient(90deg,var(--gold),#F0C77E)}
  .count{font-family:var(--mono);font-size:13px;color:var(--text-dim);white-space:nowrap}
  .count b{color:var(--text);font-weight:700}

  .qcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
    padding:20px 18px;box-shadow:var(--shadow)}
  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .qnum{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--gold);
    background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:8px;padding:4px 9px}
  .qtopic{font-size:12px;color:var(--text-dim);line-height:1.3}
  .src{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.03em;padding:3px 6px;border-radius:6px;flex:0 0 auto;text-transform:uppercase}
  .src-hock{color:var(--gold);background:var(--gold-soft);border:1px solid var(--gold-line)}
  .src-gleim{color:#7FB0E8;background:rgba(127,176,232,.12);border:1px solid rgba(127,176,232,.35)}
  .src-wiley{color:#C6A0F0;background:rgba(198,160,240,.12);border:1px solid rgba(198,160,240,.35)}
  .qid{font-family:var(--mono);font-size:11px;color:var(--text-faint);margin-left:auto;flex:0 0 auto}

  .qtext{font-size:17px;line-height:1.5;font-weight:500;letter-spacing:-.005em}
  .qtext .intro{color:var(--text)}
  .qtail{font-size:17px;line-height:1.5;font-weight:600;margin-top:14px;letter-spacing:-.005em}

  table.data{width:100%;border-collapse:collapse;margin:14px 0 2px;
    background:var(--surface-2);border:1px solid var(--border-soft);border-radius:10px;overflow:hidden}
  table.data td{padding:8px 12px;font-size:14px;border-bottom:1px solid var(--border-soft)}
  table.data tr:last-child td{border-bottom:none}
  table.data td:first-child{color:var(--text-dim)}
  table.data td.v{text-align:right;font-family:var(--mono);font-weight:500;white-space:nowrap}

  .options{margin-top:18px;display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;
    background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);
    padding:14px 14px;font-size:15px;line-height:1.45;transition:border-color .15s,background .15s,transform .1s}
  .opt:active{transform:scale(.99)}
  .opt .key{font-family:var(--mono);font-weight:700;font-size:13px;width:26px;height:26px;flex:0 0 auto;
    border-radius:7px;display:grid;place-items:center;background:var(--surface-3);color:var(--text-dim);
    border:1px solid var(--border);transition:.15s}
  .opt .txt{flex:1;padding-top:2px}
  .opt.sel{border-color:var(--gold-line);background:linear-gradient(180deg,var(--gold-soft),transparent),var(--surface-2)}
  .opt.sel .key{background:var(--gold);color:var(--bg);border-color:var(--gold)}
  /* revealed states */
  .opt.correct{border-color:var(--emerald-line);background:var(--emerald-soft)}
  .opt.correct .key{background:var(--emerald);color:#062319;border-color:var(--emerald)}
  .opt.wrong{border-color:var(--rose-line);background:var(--rose-soft)}
  .opt.wrong .key{background:var(--rose);color:#2a0810;border-color:var(--rose)}
  .opt.dim{opacity:.55}
  .opt .tick{margin-left:auto;flex:0 0 auto;align-self:center}
  .locked .opt{cursor:default}

  /* explanation */
  .explain{margin-top:16px;border-top:1px dashed var(--border);padding-top:16px;
    animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .verdict{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;margin-bottom:12px}
  .verdict.ok{color:var(--emerald)} .verdict.no{color:var(--rose)}
  .verdict .ans{font-family:var(--mono);margin-left:auto;font-size:13px;color:var(--text-dim);font-weight:500}
  .exp-block{margin-bottom:12px}
  .exp-block .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--text-faint);margin-bottom:4px}
  .exp-block.main .lbl{color:var(--emerald)}
  .exp-block p{font-size:14px;line-height:1.6;color:var(--text-dim)}
  .exp-block.main p{color:var(--text)}
  .meta{font-family:var(--mono);font-size:11px;color:var(--text-faint);margin-top:6px;line-height:1.5}

  /* ---------- Bottom action bar ---------- */
  .actions{position:sticky;bottom:0;z-index:15;margin-top:18px;padding:14px 0 calc(6px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,var(--bg) 70%,rgba(12,15,20,0));display:flex;gap:8px;flex-wrap:wrap}
  .btn{flex:1;border-radius:12px;padding:15px;font-weight:700;font-size:15px;letter-spacing:-.01em;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,opacity .15s;
    border:1px solid var(--border)}
  .btn:active{transform:scale(.98)}
  .btn.gold{background:var(--gold);color:#1a1206;border-color:var(--gold)}
  .btn.ghost{background:var(--surface);color:var(--text)}
  .btn.ghost.icon{flex:0 0 auto;width:54px}
  .btn.auto{flex:0 0 auto;padding:15px 16px}
  .btn[disabled]{opacity:.4;pointer-events:none}
  .btn.wide{flex:1;min-width:120px}

  /* ---------- Session: number rail + question ---------- */
  .qsession{display:flex;gap:12px;align-items:flex-start;margin-top:4px}
  .qrail{flex:0 0 46px;position:sticky;top:58px;max-height:calc(100vh - 150px);overflow-y:auto;
    display:flex;flex-direction:column;gap:6px;padding:2px 3px 10px;
    scrollbar-width:thin;scrollbar-color:var(--border) transparent}
  .qrail::-webkit-scrollbar{width:5px}
  .qrail::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
  .qn{position:relative;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
    color:var(--text-faint);font-family:var(--mono);font-weight:700;font-size:12px;display:grid;place-items:center;
    transition:background .12s,color .12s,border-color .12s;flex:0 0 auto}
  .qn:hover{border-color:var(--gold-line);color:var(--text-dim)}
  .qn.cur{background:var(--gold);color:#1a1206;border-color:var(--gold)}
  .qn.answered{background:var(--gold-soft);color:var(--gold);border-color:var(--gold-line)}
  .qn.correct{background:var(--emerald-soft);color:var(--emerald);border-color:var(--emerald-line)}
  .qn.wrong{background:var(--rose-soft);color:var(--rose);border-color:var(--rose-line)}
  .qn .fg{position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:2px;
    background:var(--gold);border:1.5px solid var(--bg)}
  .qmain{flex:1;min-width:0}
  .qbanner{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--text-dim);
    padding:0 2px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* new question header / stem panel / boxed options */
  .qhead2{display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap;font-size:14px}
  .qhead2 .no{font-weight:800;font-size:16px;color:var(--text)}
  .qhead2 .qmeta{color:var(--text-dim);line-height:1.35}
  .qhead2 .qmeta b{color:var(--text);font-weight:700}
  .qhead2 .qmeta .qidm{font-family:var(--mono);color:var(--gold);font-size:12.5px}
  .flagbtn{flex:0 0 auto;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;
    color:var(--text-faint);border:1px solid var(--border);background:var(--surface-2);transition:.14s}
  .flagbtn.on{color:var(--gold);border-color:var(--gold-line);background:var(--gold-soft)}
  .qpanel{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:12px;padding:16px}
  .qpanel .qtext{font-weight:500}
  .qopts{margin-top:16px;display:flex;flex-direction:column;gap:9px}
  .qopt{display:flex;gap:9px;align-items:stretch}
  .qopt .k{flex:0 0 20px;text-align:right;font-family:var(--mono);font-weight:700;font-size:14px;
    color:var(--text-dim);padding-top:13px}
  .qopt .box{flex:1;display:flex;gap:10px;align-items:center;text-align:left;background:var(--surface-2);
    border:1.5px solid var(--border);border-radius:10px;padding:13px 14px;font-size:15px;line-height:1.45;
    color:var(--text);transition:border-color .14s,background .14s,transform .1s}
  .qopt .box:active{transform:scale(.995)}
  .qopt .box .t{flex:1}
  .qopt.sel .box{border-color:var(--gold);background:var(--gold-soft)}
  .qopt.correct .box{border-color:var(--emerald);background:var(--emerald-soft)}
  .qopt.wrong .box{border-color:var(--rose);background:var(--rose-soft)}
  .qopt.dim{opacity:.5}
  .locked .qopt .box{cursor:default}
  .qfoot{font-style:italic;color:var(--text-dim);font-size:13px;margin-top:16px}

  /* ---------- Results ---------- */
  .score-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;
    padding:26px 20px;text-align:center;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .ring{width:150px;height:150px;margin:6px auto 4px;position:relative}
  .ring svg{transform:rotate(-90deg)}
  .ring .pct{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
  .ring .pct b{font-family:var(--mono);font-size:38px;font-weight:700;letter-spacing:-.03em;display:block}
  .ring .pct span{font-size:12px;color:var(--text-dim);font-family:var(--mono)}
  .verdict-line{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
  .verdict-sub{color:var(--text-dim);font-size:14px;margin-top:4px}
  .score-split{display:flex;gap:10px;margin-top:18px}
  .score-split .s{flex:1;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:12px;padding:12px}
  .score-split .s .n{font-family:var(--mono);font-size:20px;font-weight:700}
  .score-split .s.correct .n{color:var(--emerald)}
  .score-split .s.wrong .n{color:var(--rose)}
  .score-split .s .l{font-size:11px;color:var(--text-dim);margin-top:2px}

  .review-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%}
  .review-item .idx{font-family:var(--mono);font-size:13px;font-weight:700;width:30px;height:30px;flex:0 0 auto;
    border-radius:8px;display:grid;place-items:center}
  .review-item.ok .idx{background:var(--emerald-soft);color:var(--emerald);border:1px solid var(--emerald-line)}
  .review-item.no .idx{background:var(--rose-soft);color:var(--rose);border:1px solid var(--rose-line)}
  .review-item .rtext{flex:1;font-size:14px;line-height:1.45}
  .review-item .rmeta{font-family:var(--mono);font-size:11px;color:var(--text-faint);margin-top:5px}
  .review-item .rmeta b.ok{color:var(--emerald)} .review-item .rmeta b.no{color:var(--rose)}
  .review-item .chev{color:var(--text-faint);align-self:center}

  .empty{color:var(--text-dim);text-align:center;padding:40px 20px;font-size:15px}
  .fadein{animation:fade .35s ease}
  .footer-note{text-align:center;color:var(--text-faint);font-size:11px;font-family:var(--mono);
    margin:26px 0 6px;letter-spacing:.03em}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
  ::selection{background:var(--gold-soft)}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
let QUESTIONS = [];
</script>
<script>
/* ================= State ================= */
const S = {
  screen:'home',
  scope:'all',         // section scope: 'all' | 'A' | 'B'
  topic:null,          // practice topic filter
  practiceList:[],     // current practice question set (indices into QUESTIONS)
  pIdx:0,              // practice pointer
  pSelected:{},        // {questionIndex: 'A'} chosen answers in practice
  pRevealed:{},        // {questionIndex: true}
  pFlagged:{},         // {questionIndex: true} flagged for review
  exam:null,           // {list:[idx...], answers:{}, flagged:{}, pos:0}
};
const app = document.getElementById('app');
const byTopic = () => {
  const m={}; QUESTIONS.forEach((q,i)=>{(m[q.topic]=m[q.topic]||[]).push(i)}); return m;
};
let TOPICS = {};
const SECTIONS = {
  A:{label:'Section A', name:'The Financial Statements'},
  B:{label:'Section B', name:'Planning, Budgeting & Forecasting'},
  C:{label:'Section C', name:'Performance Management'},
};
const topicsBySection = ()=>{
  const m={A:{},B:{}};
  QUESTIONS.forEach((q,i)=>{const s=m[q.section]||(m[q.section]={});(s[q.topic]=s[q.topic]||[]).push(i)});
  return m;
};
let TOPICS_SEC = {};
// Ordered groups: section -> source -> study-unit label -> topics
const topicGroups = ()=>{
  const order=[]; const map={};
  QUESTIONS.forEach((q,i)=>{
    const label = q.source==='Gleim' ? (q.studyUnit||'Gleim') : SECTIONS[q.section].name;
    const gkey = q.section+'|'+(q.source||'HOCK')+'|'+label;
    if(!map[gkey]){ map[gkey]={section:q.section, source:q.source||'HOCK', label, topics:{}}; order.push(gkey); }
    (map[gkey].topics[q.topic]=map[gkey].topics[q.topic]||[]).push(i);
  });
  return order.map(k=>map[k]);
};
let SOURCES = [];
const scopedIndices = ()=> QUESTIONS.map((_,i)=>i).filter(i=> S.scope==='all' || QUESTIONS[i].section===S.scope);
const scopeLabel = ()=> S.scope==='all' ? 'All questions' : SECTIONS[S.scope].label;
const $ = (h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild;};
const esc = (s)=> (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = (a)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a;};
const scrollTop = ()=>window.scrollTo({top:0,behavior:'smooth'});

/* ================= Icons ================= */
const IC = {
  book:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  timer:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>',
  arrow:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  back:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
  check:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  x:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  chev:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
  flag:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>',
};

/* ================= Top bar ================= */
function topbar(back){
  const bar = $(`<div class="topbar"></div>`);
  if(back){
    const b=$(`<button class="backbtn">${IC.back}<span>Back</span></button>`);
    b.onclick=back; bar.appendChild(b);
    bar.appendChild($(`<div class="spacer"></div>`));
  } else {
    bar.appendChild($(`<div class="brand"><div class="mark">Σ</div><div>CMA Practice<small>Part 1 · Sections A–C</small></div></div>`));
    bar.appendChild($(`<div class="spacer"></div>`));
  }
  return bar;
}

/* ================= Render root ================= */
function render(){
  app.innerHTML='';
  if(S.screen==='home') return renderHome();
  if(S.screen==='practice') return renderPractice();
  if(S.screen==='exam') return renderExam();
  if(S.screen==='results') return renderResults();
}

/* ================= HOME ================= */
function renderHome(){
  app.appendChild(topbar(null));
  const topicCount = Object.keys(TOPICS).length;
  const scopedCount = scopedIndices().length;
  const wrap=$(`<div class="fadein"></div>`);
  wrap.appendChild($(`
    <div class="hero">
      <div class="eyebrow">CMA US · Part 1</div>
      <h1>Practice until it's<br><em>second nature.</em></h1>
      <p>Work through real exam-style questions with full answer explanations, or sit a 20-question mock exam.</p>
      <div class="stats">
        <div class="stat"><div class="n">${QUESTIONS.length}</div><div class="l">Questions</div></div>
        <div class="stat"><div class="n">${topicCount}</div><div class="l">Topics</div></div>
        <div class="stat"><div class="n">${SOURCES.length}</div><div class="l">Banks</div></div>
      </div>
    </div>`));

  // Section focus selector
  const focus=$(`<div></div>`);
  focus.appendChild($(`<div class="section-label">Focus</div>`));
  const seg=$(`<div class="chips"></div>`);
  [['all','All sections'],['A','Section A'],['B','Section B'],['C','Section C']].forEach(([v,lbl])=>{
    const on=S.scope===v;
    const n = v==='all'?QUESTIONS.length:Object.values(TOPICS_SEC[v]).reduce((a,b)=>a+b.length,0);
    const c=$(`<button class="chip ${on?'on':''}">${lbl}<span class="c">${n}</span></button>`);
    c.onclick=()=>{S.scope=v;render();scrollTop();};
    seg.appendChild(c);
  });
  focus.appendChild(seg);
  wrap.appendChild(focus);

  const modes=$(`<div></div>`);
  const scopeNote = S.scope==='all' ? 'across both sections' : `from ${SECTIONS[S.scope].label}`;
  const practiceBtn=$(`
    <button class="mode primary">
      <h3>${IC.book} Practice questions</h3>
      <p>Answer one at a time and reveal the correct answer with a full explanation — ${scopedCount} questions ${scopeNote}.</p>
      <span class="go">${IC.arrow}</span>
    </button>`);
  practiceBtn.onclick=()=>startPractice(null);
  const examBtn=$(`
    <button class="mode">
      <h3>${IC.timer} Mock exam · 20 questions</h3>
      <p>A random 20-question set ${scopeNote}. Answer them all, then get your score and review every answer.</p>
      <span class="go">${IC.arrow}</span>
    </button>`);
  examBtn.onclick=startExam;
  modes.appendChild($(`<div class="section-label">Choose a mode</div>`));
  modes.appendChild(practiceBtn);
  modes.appendChild(examBtn);
  wrap.appendChild(modes);

  // Topics grouped by section + source (study unit)
  const topics=$(`<div></div>`);
  topics.appendChild($(`<div class="section-label">Or jump to a topic</div>`));
  topicGroups().forEach(g=>{
    if(S.scope!=='all' && S.scope!==g.section) return;
    const head=$(`<div style="display:flex;align-items:center;gap:8px;margin:16px 2px 8px">
      <span class="src src-${g.source.toLowerCase()}">${g.source}</span>
      <span style="font-size:13px;font-weight:600;color:var(--text-dim)">${SECTIONS[g.section].label} · <span style="color:var(--text-faint);font-weight:400">${esc(g.label)}</span></span>
    </div>`);
    topics.appendChild(head);
    const chips=$(`<div class="chips"></div>`);
    Object.keys(g.topics).forEach(t=>{
      const c=$(`<button class="chip">${esc(t)}<span class="c">${g.topics[t].length}</span></button>`);
      c.onclick=()=>startPractice(t);
      chips.appendChild(c);
    });
    topics.appendChild(chips);
  });
  wrap.appendChild(topics);
  wrap.appendChild($(`<div class="footer-note">CMA US Part 1 · ${SOURCES.join(' + ')} question banks</div>`));
  app.appendChild(wrap);
}

/* ================= PRACTICE ================= */
function startPractice(topic){
  S.topic=topic;
  S.practiceList = topic ? TOPICS[topic].slice() : scopedIndices();
  S.pIdx=0; S.pSelected={}; S.pRevealed={}; S.pFlagged={};
  S.screen='practice'; render(); scrollTop();
}

function renderPractice(){
  app.appendChild(topbar(()=>{S.screen='home';render();scrollTop();}));
  const list=S.practiceList, qi=list[S.pIdx], q=QUESTIONS[qi], last=S.pIdx===list.length-1;

  const session=$(`<div class="qsession fadein"></div>`);
  session.appendChild(buildRail(list, {
    stateFor:(idx,p)=>{
      let cls='';
      if(p===S.pIdx) cls='cur';
      else if(S.pRevealed[idx]) cls=(S.pSelected[idx]===QUESTIONS[idx].correct?'correct':'wrong');
      else if(S.pSelected[idx]!=null) cls='answered';
      return {cls, flagged:!!S.pFlagged[idx]};
    },
    onJump:(p)=>{S.pIdx=p;render();scrollTop();}
  }));
  const main=$(`<div class="qmain"></div>`);
  main.appendChild($(`<div class="qbanner">CMA Part 1 · ${esc(SECTIONS[q.section].label)} — ${esc(S.topic||scopeLabel())}</div>`));
  main.appendChild(questionCard(q, qi, {
    selected:S.pSelected[qi], revealed:!!S.pRevealed[qi], pos:S.pIdx+1, total:list.length,
    flagged:!!S.pFlagged[qi], onFlag:()=>{S.pFlagged[qi]=!S.pFlagged[qi];render();},
    onSelect:(L)=>{ if(S.pRevealed[qi])return; S.pSelected[qi]=L; render(); },
  }));
  session.appendChild(main);
  app.appendChild(session);

  const act=$(`<div class="actions"></div>`);
  const prev=$(`<button class="btn ghost icon" title="Previous">${IC.back}</button>`);
  prev.disabled=S.pIdx===0; prev.onclick=()=>{S.pIdx--;render();scrollTop();};
  act.appendChild(prev);

  const skip=$(`<button class="btn ghost auto">Skip</button>`);
  skip.disabled=last; skip.onclick=()=>{S.pIdx++;render();scrollTop();};
  act.appendChild(skip);

  if(!S.pRevealed[qi]){
    const see=$(`<button class="btn gold wide">See answer</button>`);
    see.onclick=()=>{S.pRevealed[qi]=true;render();};
    act.appendChild(see);
  } else {
    const next=$(`<button class="btn gold wide">${last?'Finish':'Next'} ${last?'':IC.arrow}</button>`);
    next.onclick=()=>{ if(last){S.screen='home';render();scrollTop();} else {S.pIdx++;render();scrollTop();} };
    act.appendChild(next);
  }
  const end=$(`<button class="btn ghost auto">End</button>`);
  end.onclick=()=>{S.screen='home';render();scrollTop();};
  act.appendChild(end);
  app.appendChild(act);
}

/* ================= EXAM ================= */
function startExam(){
  const pool=scopedIndices();
  const n=Math.min(20, pool.length);
  const list=shuffle(pool).slice(0,n);
  S.exam={list, answers:{}, flagged:{}, submitted:false, pos:0, scope:S.scope};
  S.screen='exam'; render(); scrollTop();
}

function renderExam(){
  const ex=S.exam;
  app.appendChild(topbar(()=>{ if(confirm('Leave the exam? Your progress will be lost.')){S.exam=null;S.screen='home';render();scrollTop();}}));
  const qi=ex.list[ex.pos], q=QUESTIONS[qi];
  const answered=Object.keys(ex.answers).length, last=ex.pos===ex.list.length-1;

  const session=$(`<div class="qsession fadein"></div>`);
  session.appendChild(buildRail(ex.list, {
    stateFor:(idx,p)=>{
      let cls='';
      if(p===ex.pos) cls='cur';
      else if(ex.answers[idx]!=null) cls='answered';
      return {cls, flagged:!!ex.flagged[idx]};
    },
    onJump:(p)=>{ex.pos=p;render();scrollTop();}
  }));
  const main=$(`<div class="qmain"></div>`);
  main.appendChild($(`<div class="qbanner">Mock exam · ${answered}/${ex.list.length} answered</div>`));
  main.appendChild(questionCard(q, qi, {
    selected:ex.answers[qi], revealed:false, pos:ex.pos+1, total:ex.list.length,
    flagged:!!ex.flagged[qi], onFlag:()=>{ex.flagged[qi]=!ex.flagged[qi];render();},
    onSelect:(L)=>{ ex.answers[qi]=L; render(); },
  }));
  session.appendChild(main);
  app.appendChild(session);

  const act=$(`<div class="actions"></div>`);
  const prev=$(`<button class="btn ghost icon" title="Previous">${IC.back}</button>`);
  prev.disabled=ex.pos===0; prev.onclick=()=>{ex.pos--;render();scrollTop();};
  act.appendChild(prev);

  const skip=$(`<button class="btn ghost auto">Skip</button>`);
  skip.disabled=last; skip.onclick=()=>{ex.pos++;render();scrollTop();};
  act.appendChild(skip);

  const next=$(`<button class="btn ghost wide">Next ${IC.arrow}</button>`);
  next.disabled=last; next.onclick=()=>{ex.pos++;render();scrollTop();};
  act.appendChild(next);

  const submit=$(`<button class="btn gold auto">Submit${answered<ex.list.length?` · ${answered}/${ex.list.length}`:''}</button>`);
  submit.onclick=()=>{
    const miss=ex.list.length-answered;
    if(miss>0 && !confirm(`${miss} question${miss>1?'s':''} still unanswered — submit anyway?`)) return;
    S.screen='results'; render(); scrollTop();
  };
  act.appendChild(submit);
  app.appendChild(act);
}

/* ================= RESULTS ================= */
function renderResults(){
  const ex=S.exam;
  app.appendChild(topbar(()=>{S.exam=null;S.screen='home';render();scrollTop();}));
  let correct=0;
  ex.list.forEach(idx=>{ if(ex.answers[idx]===QUESTIONS[idx].correct) correct++; });
  const total=ex.list.length;
  const pct=Math.round(correct/total*100);
  const pass=pct>=72; // ICMA scaled pass ~ 72%
  const wrap=$(`<div class="fadein"></div>`);

  // score ring
  const circ=2*Math.PI*66;
  const off=circ*(1-pct/100);
  const ringColor = pct>=72?'var(--emerald)': pct>=50?'var(--gold)':'var(--rose)';
  wrap.appendChild($(`
    <div class="score-card">
      <div class="ring">
        <svg width="150" height="150" viewBox="0 0 150 150">
          <circle cx="75" cy="75" r="66" fill="none" stroke="var(--surface-3)" stroke-width="10"/>
          <circle cx="75" cy="75" r="66" fill="none" stroke="${ringColor}" stroke-width="10"
            stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ}"
            style="transition:stroke-dashoffset 1s ease .15s" id="ringfg"/>
        </svg>
        <div class="pct"><b style="color:${ringColor}">${pct}%</b><span>${correct}/${total}</span></div>
      </div>
      <div class="verdict-line" style="color:${ringColor}">${pass?'Strong pass':pct>=50?'Getting there':'Keep practicing'}</div>
      <div class="verdict-sub">${pass?'You cleared the ~72% benchmark on this set.':`Aim for 72%+. That's ${Math.max(0,Math.ceil(total*0.72)-correct)} more correct.`}</div>
      <div class="score-split">
        <div class="s correct"><div class="n">${correct}</div><div class="l">Correct</div></div>
        <div class="s wrong"><div class="n">${total-correct}</div><div class="l">Incorrect</div></div>
        <div class="s"><div class="n">${total}</div><div class="l">Total</div></div>
      </div>
    </div>`));

  wrap.appendChild($(`<div class="section-label">Review your answers</div>`));
  const rev=$(`<div></div>`);
  ex.list.forEach((idx,p)=>{
    const q=QUESTIONS[idx];
    const your=ex.answers[idx];
    const ok=your===q.correct;
    const item=$(`
      <button class="review-item ${ok?'ok':'no'}">
        <div class="idx">${p+1}</div>
        <div class="rtext">${esc(q.tail||q.question).slice(0,110)}${(q.tail||q.question).length>110?'…':''}
          <div class="rmeta">Your answer: <b class="${ok?'ok':'no'}">${your||'—'}</b> · Correct: <b class="ok">${q.correct}</b></div>
        </div>
        <span class="chev">${IC.chev}</span>
      </button>`);
    item.onclick=()=>openReview(idx);
    rev.appendChild(item);
  });
  wrap.appendChild(rev);

  const act=$(`<div class="actions"></div>`);
  const again=$(`<button class="btn gold wide">${IC.timer} New mock exam</button>`);
  again.onclick=startExam;
  const home=$(`<button class="btn ghost wide">Home</button>`);
  home.onclick=()=>{S.exam=null;S.screen='home';render();scrollTop();};
  act.appendChild(home); act.appendChild(again);
  wrap.appendChild(act);
  app.appendChild(wrap);

  requestAnimationFrame(()=>{const r=document.getElementById('ringfg'); if(r) r.style.strokeDashoffset=off;});
}

// review a single exam question in full (reuse question card, revealed)
function openReview(idx){
  app.innerHTML='';
  app.appendChild(topbar(()=>{S.screen='results';render();scrollTop();}));
  const q=QUESTIONS[idx];
  const pos=S.exam.list.indexOf(idx);
  const wrap=$(`<div class="fadein"></div>`);
  wrap.appendChild($(`<div class="progress-rail"><span class="count"><b>Review</b> · question ${pos+1}</span><div class="bar"><i style="width:100%"></i></div></div>`));
  wrap.appendChild(questionCard(q, idx, {selected:S.exam.answers[idx], revealed:true, pos:pos+1, total:S.exam.list.length}));
  const act=$(`<div class="actions"></div>`);
  const back=$(`<button class="btn gold wide">Back to results</button>`);
  back.onclick=()=>{S.screen='results';render();scrollTop();};
  act.appendChild(back);
  wrap.appendChild(act);
  app.appendChild(wrap);
  scrollTop();
}

/* ================= Shared components ================= */
function progressRail(cur,total,exam,label){
  const pct=Math.round(cur/total*100);
  const rail=$(`<div class="progress-rail"></div>`);
  rail.appendChild($(`<span class="count"><b>${cur}</b>/${total}</span>`));
  rail.appendChild($(`<div class="bar ${exam?'exam':''}"><i style="width:${pct}%"></i></div>`));
  rail.appendChild($(`<span class="count" style="color:var(--text-faint);font-size:11px;max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(label)}</span>`));
  return rail;
}

/* number rail for jumping between questions in a session */
function buildRail(list, {stateFor, onJump}){
  const rail=$(`<aside class="qrail"></aside>`);
  rail.innerHTML = list.map((idx,p)=>{
    const st=stateFor(idx,p);
    return `<button class="qn ${st.cls}" data-p="${p}" aria-label="Question ${p+1}">${p+1}${st.flagged?'<span class="fg"></span>':''}</button>`;
  }).join('');
  rail.addEventListener('click',(e)=>{
    const b=e.target.closest('button[data-p]');
    if(b) onJump(+b.dataset.p);
  });
  requestAnimationFrame(()=>{const cur=rail.querySelector('.qn.cur'); if(cur) cur.scrollIntoView({block:'nearest'});});
  return rail;
}

function questionCard(q, qi, opt){
  const {selected, revealed, onSelect, pos, total, flagged, onFlag} = opt;
  const card=$(`<div class="qcard ${revealed?'locked':''}"></div>`);

  // header: number · flag · Question ID · (Topic) · source
  const head=$(`<div class="qhead2"></div>`);
  if(pos!=null) head.appendChild($(`<span class="no">${pos}.</span>`));
  if(onFlag){
    const fb=$(`<button class="flagbtn ${flagged?'on':''}" title="Flag for review">${IC.flag}</button>`);
    fb.onclick=(e)=>{e.stopPropagation(); onFlag();};
    head.appendChild(fb);
  }
  head.appendChild($(`<span class="qmeta"><b>Question ID:</b> <span class="qidm">${esc(q.id)}</span> <span class="tp">(Topic: ${esc(q.topic)})</span></span>`));
  head.appendChild($(`<span class="src src-${(q.source||'HOCK').toLowerCase()}" style="margin-left:auto">${q.source||'HOCK'}</span>`));
  card.appendChild(head);

  // stem panel
  const panel=$(`<div class="qpanel"></div>`);
  if(q.table && q.table.length){
    if(q.intro) panel.appendChild($(`<div class="qtext"><span class="intro">${esc(q.intro)}</span></div>`));
    const t=$(`<table class="data"></table>`);
    q.table.forEach(([label,vals])=>{
      const tr=$(`<tr><td>${esc(label)}</td></tr>`);
      (Array.isArray(vals)?vals:[vals]).forEach(v=>tr.appendChild($(`<td class="v">${esc(v)}</td>`)));
      t.appendChild(tr);
    });
    panel.appendChild(t);
    if(q.tail) panel.appendChild($(`<div class="qtail">${esc(q.tail)}</div>`));
  } else {
    panel.appendChild($(`<div class="qtext">${esc(q.question)}</div>`));
  }
  card.appendChild(panel);

  // boxed options with letter labels
  const opts=$(`<div class="qopts"></div>`);
  ['A','B','C','D'].forEach(L=>{
    if(!q.options[L]) return;
    let cls='qopt';
    if(revealed){
      if(L===q.correct) cls+=' correct';
      else if(L===selected) cls+=' wrong';
      else cls+=' dim';
    } else if(selected===L){ cls+=' sel'; }
    const row=$(`<div class="${cls}"></div>`);
    row.appendChild($(`<span class="k">${L}.</span>`));
    const box=$(`<button class="box"><span class="t">${esc(q.options[L])}</span></button>`);
    if(revealed){
      if(L===q.correct) box.appendChild($(`<span class="tick" style="color:var(--emerald)">${IC.check}</span>`));
      else if(L===selected) box.appendChild($(`<span class="tick" style="color:var(--rose)">${IC.x}</span>`));
    }
    if(onSelect) box.onclick=()=>onSelect(L);
    row.appendChild(box);
    opts.appendChild(row);
  });
  card.appendChild(opts);

  // footer
  if(pos!=null && total!=null) card.appendChild($(`<div class="qfoot">Question ${pos} of ${total}</div>`));

  // explanation (practice reveal / review only)
  if(revealed){
    const ok=selected===q.correct;
    const ex=$(`<div class="explain"></div>`);
    ex.appendChild($(`
      <div class="verdict ${ok?'ok':'no'}">
        ${ok?IC.check:IC.x} ${ok?'Correct':(selected?'Not quite':'Unanswered')}
        <span class="ans">Answer: ${q.correct}</span>
      </div>`));
    if(q.correctExplanation){
      ex.appendChild($(`<div class="exp-block main"><div class="lbl">Why ${q.correct} is correct</div><p>${esc(q.correctExplanation)}</p></div>`));
    }
    if(!ok && selected && q.explanations[selected]){
      ex.appendChild($(`<div class="exp-block"><div class="lbl">Why ${selected} is wrong</div><p>${esc(q.explanations[selected])}</p></div>`));
    }
    const others=['A','B','C','D'].filter(L=>L!==q.correct && L!==selected && q.explanations[L]);
    if(others.length){
      const det=$(`<details style="margin-top:4px"><summary style="cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--gold);list-style:none">Show other options ▾</summary></details>`);
      others.forEach(L=>det.appendChild($(`<div class="exp-block" style="margin-top:10px"><div class="lbl">Option ${L}</div><p>${esc(q.explanations[L])}</p></div>`)));
      ex.appendChild(det);
    }
    const meta=[];
    if(q.studyUnit) meta.push(esc(q.studyUnit));
    if(q.pctCorrect!=null) meta.push(`${q.pctCorrect}% answer this correctly first try`);
    if(meta.length) ex.appendChild($(`<div class="meta">${meta.join(' · ')}</div>`));
    card.appendChild(ex);
  }
  return card;
}

/* ================= boot ================= */
app.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:72vh;color:var(--text-dim);font-family:var(--sans);font-size:15px">Loading questions\u2026</div>';
async function boot(){
  try{
    const res = await fetch('questions.json', {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    QUESTIONS = await res.json();
  }catch(err){
    app.innerHTML = '<div style="max-width:520px;margin:64px auto;padding:0 24px;font-family:var(--sans)">'
      +'<div style="font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--text);margin-bottom:10px">Couldn\u2019t load questions</div>'
      +'<p style="color:var(--text-dim);font-size:15px;line-height:1.6">This app loads its questions from <code>questions.json</code> next to it. '
      +'If you opened <code>index.html</code> straight from your computer, browsers block reading that file over <code>file://</code>. '
      +'Deploy the folder (e.g. to Vercel) or serve it over http, then reload.</p>'
      +'<p style="color:var(--text-faint);font-family:var(--mono);font-size:12px;margin-top:14px">'+((err&&err.message)||err)+'</p></div>';
    return;
  }
  TOPICS = byTopic();
  TOPICS_SEC = topicsBySection();
  SOURCES = [...new Set(QUESTIONS.map(q=>q.source||'HOCK'))];
  render();
}
boot();
</script>
